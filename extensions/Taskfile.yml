# Taskfile.yml for molecule in ansible-oracle
#
# Usage:
#   task --list
#   task converge S=dbfs-ol9
#   task module-test M=oracle_user,oracle_role L=cx_oracle
#   task module-test M=oracle_user C=false   (without reinstalling the collection)
#   task module-test S=has-ol9 M=oracle_asmdg
#   task login S=default H=ol9
#   task exec H=dbfs-ol9 U=oracle
#   task regression:final J=6   (regression tests with report, see Taskfile.regression.yml)
#   task test:oracle_databases  (controller-only tests of oracle_databases, no VM)
#
# MOLECULE_SW_DIR (local directory mounted as /vagrant) is read from the
# environment or from .env (KEY=VALUE) in this directory (tools/load_env.sh).
version: '3'

includes:
  # regression tests with report: task molecule:regression:<preset>
  regression:
    taskfile: Taskfile.regression.yml
    dir: .

vars:
  S: '{{.S | default "default"}}'
  SW_SCENARIOS: dbfs dbfs-ol9 dbfs-ol10 dataguard has-ol9 download golden ahf
  IMAGES: >-
    quay.io/rendanic/docker-ol8-ansible:latest
    quay.io/rendanic/docker-ol9-ansible:latest
    quay.io/rendanic/docker-ol10-ansible:latest
    geerlingguy/docker-opensuseleap15-ansible:latest
    docker.io/gvenzl/oracle-free:23-slim-faststart

env:
  ANSIBLE_FORCE_COLOR: 'true'
  PY_COLORS: '1'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  list:
    desc: Show status of all scenarios
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - tools/molecule.sh list

  pull:
    desc: Pull container images (molecule has a 15s timeout for pulling)
    cmds:
      - for: {var: IMAGES, split: ' '}
        cmd: docker pull {{.ITEM}}

  collection:
    desc: Reinstall the collection from this repository (needed after role changes without version change)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - tools/collection_install.sh

  _check-sw-dir:
    internal: true
    dir: "{{.TASKFILE_DIR}}"
    preconditions:
      - sh: >-
          [ -n "${MOLECULE_SW_DIR:-}" ]
          || grep -q '^MOLECULE_SW_DIR=' .env 2>/dev/null
        msg: "MOLECULE_SW_DIR is not set. Export it or add it to extensions/.env"

  _molecule:
    internal: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - task: '{{if has .S (splitList " " .SW_SCENARIOS)}}_check-sw-dir{{else}}_noop{{end}}'
    cmds:
      - tools/molecule.sh {{.CMD}} -s {{.S}} {{.CLI_ARGS}}

  _noop:
    internal: true
    cmds: []

  create:
    desc: "Create instances (S=<scenario>)"
    cmds:
      - task: _molecule
        vars: {CMD: create, S: '{{.S}}'}

  converge:
    desc: "Run converge.yml (S=<scenario>, C=false: do not reinstall the collection)"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      # molecule installs the collection only when the version changed => install the current code
      - '[ "{{.C}}" = "false" ] || tools/collection_install.sh'
      - task: _molecule
        vars: {CMD: converge, S: '{{.S}}'}

  side-effect:
    desc: "Run side_effect.yml (S=<scenario>)"
    cmds:
      - task: _molecule
        vars: {CMD: side-effect, S: '{{.S}}'}

  module-test:
    desc: >-
      Module tests (S=dbfs|dbfs-ol10|has-ol9, default dbfs, M=<module>[,<module>...],
      L=<label for result file>, C=false: do not reinstall the collection)
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - _check-sw-dir
    env:
      MODULE_TESTS: '{{.M}}'
      MODULE_TESTS_LABEL: '{{.L}}'
    cmds:
      # side-effect does not install the collection => install the current code
      # C=false skips the installation (go-task 3.45 has no if: for commands)
      - '[ "{{.C}}" = "false" ] || tools/collection_install.sh'
      - tools/molecule.sh side-effect -s {{if eq .S "default"}}dbfs{{else}}{{.S}}{{end}} {{.CLI_ARGS}}

  idempotence:
    desc: "Run converge again and check for changes (S=<scenario>)"
    cmds:
      - task: _molecule
        vars: {CMD: idempotence, S: '{{.S}}'}

  verify:
    desc: "Run verify.yml (S=<scenario>)"
    cmds:
      - task: _molecule
        vars: {CMD: verify, S: '{{.S}}'}

  test:oracle_databases:
    desc: >-
      Controller-only tests of oracle_databases (asserts of orasw_meta, dbca destinations
      and response file), no container or VM needed
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - ansible-playbook -i localhost, tests/oracle_databases/test_oracle_databases.yml {{.CLI_ARGS}}

  test:
    desc: >-
      Full test: create, converge, idempotence, side-effect, verify, destroy
      (S=<scenario>, C=false: do not reinstall the collection)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      # molecule installs the collection only when the version changed => install the current code
      - '[ "{{.C}}" = "false" ] || tools/collection_install.sh'
      - task: _molecule
        vars: {CMD: test, S: '{{.S}}'}

  destroy:
    desc: "Destroy instances of one scenario (S=<scenario>)"
    cmds:
      - task: _molecule
        vars: {CMD: destroy, S: '{{.S}}'}

  destroy-all:
    desc: Destroy instances of all scenarios
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - tools/molecule.sh destroy --all

  login:
    desc: "Open a shell in an instance (S=<scenario>, H=<host> for scenarios with more than one instance)"
    dir: "{{.TASKFILE_DIR}}"
    interactive: true
    cmds:
      - tools/molecule.sh login -s {{.S}} {{if .H}}-h {{.H}}{{end}}

  exec:
    desc: "docker exec bash in a molecule container (H=<container>, U=<user>, e.g. U=oracle)"
    interactive: true
    silent: true
    cmds:
      - |
        H="{{.H}}"
        if [ -z "$H" ]; then
          L=$(docker ps --filter label=owner=molecule --format '{{"{{"}}.Names{{"}}"}}')
          if [ "$(echo "$L" | grep -c .)" -eq 1 ]; then
            H=$L
          else
            echo "No or more than one molecule container running. Set H=<container>:"
            echo "$L" | sed 's/^/  /'
            exit 1
          fi
        fi
        docker ps --filter label=owner=molecule --filter "name=^${H}$" --format '{{"{{"}}.Names{{"}}"}}' | grep -qx "$H" \
          || { echo "'$H' is not a running molecule container"; exit 1; }
        exec docker exec -it {{if .U}}-u {{.U}}{{end}} "$H" bash -l

  download:
    desc: Download patches from support.oracle.com into MOLECULE_SW_DIR
    dir: "{{.TASKFILE_DIR}}"
    preconditions:
      - sh: >-
          { [ -n "${MOS_USERNAME:-}" ] || grep -q '^MOS_USERNAME=' .env 2>/dev/null; }
          && { [ -n "${MOS_PASSWORD:-}" ] || grep -q '^MOS_PASSWORD=' .env 2>/dev/null; }
        msg: "Set MOS_USERNAME and MOS_PASSWORD in the environment or in extensions/.env"
    cmds:
      - task: _molecule
        vars: {CMD: test, S: download}
