---
# Test cases for test_oracle_databases.yml
#
# id:     name of the test case
# dbs:    list of databases, combined with _base_db (home h26, DB1, FS, SI, state present)
#         params: init_parameters in addition to the default parameters below
#         listener: value of local_listener in init_parameters (default '//localhost:1521', null: not defined)
#         max_pdbs: value of max_pdbs in init_parameters (default '3', null: not defined)
#         cmpa: value of control_management_pack_access in init_parameters (default 'NONE', null: not defined)
#         sga / pga: value of sga_target / pga_aggregate_target in init_parameters (default '1G' / '256M', null: not defined)
# vars:   additional variables for the asserts (only configure_hugepages, optional)
# expect: ok | failed (asserts of orasw_meta)
# dest:   {df, rf} - datafile / recovery area destination for dbca of the first database (optional)
# rsp:    expected values in the dbca response file of the first database (optional)
# rsp_absent: keys which must not be set in the dbca response file of the first database (optional)

_p_create: &p_create {name: db_create_file_dest, value: '/u02/oradata', scope: both, state: present}
_p_reco: &p_reco {name: db_recovery_file_dest, value: '/u02/fra', scope: both, state: present}
_p_size: &p_size {name: db_recovery_file_dest_size, value: '10G', scope: both, state: present, dbca: false}

tc_cases:
  # ---------- omf: true (default) ----------
  - id: omf_default_params_ok
    dbs: [{params: [*p_create, *p_size, *p_reco]}]
    expect: ok
    dest: {df: /u02/oradata, rf: /u02/fra}
    rsp: {createAsContainerDatabase: 'true', datafileDestination: /u02/oradata, recoveryAreaDestination: /u02/fra}

  - id: omf_true_explicit_params_ok
    dbs: [{omf: true, params: [*p_create, *p_reco]}]
    expect: ok

  - id: omf_string_yes_params_missing
    dbs: [{omf: 'yes', params: [*p_create]}]
    expect: failed

  - id: omf_default_no_params
    dbs: [{}]
    expect: failed

  - id: omf_default_recovery_missing
    dbs: [{params: [*p_create, *p_size]}]
    expect: failed

  - id: omf_default_create_missing
    dbs: [{params: [*p_size, *p_reco]}]
    expect: failed

  - id: omf_default_param_state_absent
    dbs: [{params: [*p_create, {name: db_recovery_file_dest, value: '/u02/fra', state: absent}]}]
    expect: failed

  - id: omf_default_param_only_for_sid
    dbs: [{params: [*p_create, {name: db_recovery_file_dest, value: '/u02/fra', sid: DB1, dbca: false}]}]
    expect: failed

  - id: omf_default_param_uppercase
    dbs:
      - params:
          - {name: DB_CREATE_FILE_DEST, value: '/data/db1'}
          - {name: DB_RECOVERY_FILE_DEST, value: '/fra/db1'}
    expect: ok
    dest: {df: /data/db1, rf: /fra/db1}

  - id: omf_default_asm_26ai
    dbs:
      - storage_type: ASM
        params:
          - {name: db_create_file_dest, value: '+DATA1'}
          - {name: db_recovery_file_dest, value: '+RECO1'}
    expect: ok
    dest: {df: '+DATA1', rf: '+RECO1'}
    # storageType and diskGroupName are empty in the 26ai response file (not checked)
    rsp: {datafileDestination: '+DATA1', recoveryAreaDestination: '+RECO1', recoveryGroupName: '+RECO1'}

  - id: omf_default_asm_19c
    dbs:
      - home: h19
        storage_type: ASM
        params:
          - {name: db_create_file_dest, value: '+DATA1'}
          - {name: db_recovery_file_dest, value: '+RECO1'}
    expect: ok
    rsp: {storageType: ASM, diskGroupName: '+DATA1', recoveryGroupName: '+RECO1'}

  - id: omf_default_state_absent_no_params
    dbs: [{state: absent}]
    expect: ok

  # ---------- omf: false (FS only, own DBCA template, not tested in molecule) ----------
  - id: omf_false_no_params
    dbs: [{omf: false}]
    expect: ok
    dest: {df: /u02/oradata/, rf: /u02/fra/}
    rsp: {datafileDestination: /u02/oradata/, recoveryAreaDestination: /u02/fra/}

  - id: omf_false_string_no_params
    dbs: [{omf: 'false'}]
    expect: ok
    dest: {df: /u02/oradata/, rf: /u02/fra/}

  - id: omf_false_params_ignored_for_dbca
    dbs: [{omf: false, params: [*p_create, *p_reco]}]
    expect: ok
    dest: {df: /u02/oradata/, rf: /u02/fra/}

  - id: omf_false_asm
    dbs: [{omf: false, storage_type: ASM}]
    expect: failed

  - id: omf_false_asm_state_absent
    dbs: [{omf: false, storage_type: ASM, state: absent}]
    expect: failed

  # ---------- removed datafile_dest / recoveryfile_dest ----------
  - id: removed_datafile_dest
    dbs: [{datafile_dest: /u02/oradata, params: [*p_create, *p_reco]}]
    expect: failed

  - id: removed_recoveryfile_dest
    dbs: [{recoveryfile_dest: /u02/fra, params: [*p_create, *p_reco]}]
    expect: failed

  - id: removed_dest_with_omf_false
    dbs: [{omf: false, datafile_dest: /u03/oradata, recoveryfile_dest: /u03/fra}]
    expect: failed

  - id: removed_dest_state_absent
    dbs: [{state: absent, datafile_dest: /u02/oradata}]
    expect: failed

  # ---------- is_container ----------
  - id: is_container_default_26ai
    dbs: [{params: [*p_create, *p_reco]}]
    expect: ok
    rsp: {createAsContainerDatabase: 'true'}

  - id: is_container_false_26ai
    dbs: [{is_container: false, params: [*p_create, *p_reco]}]
    expect: failed

  - id: is_container_default_19c
    dbs: [{home: h19, params: [*p_create, *p_reco]}]
    expect: ok
    rsp: {createAsContainerDatabase: 'true'}

  - id: is_container_false_19c
    dbs: [{home: h19, is_container: false, params: [*p_create, *p_reco]}]
    expect: ok
    rsp: {createAsContainerDatabase: 'false', numberOfPDBs: '', pdbName: ''}

  - id: is_container_true_19c_pdb
    dbs: [{home: h19, is_container: true, num_pdbs: 1, pdb_prefix: PDB, params: [*p_create, *p_reco]}]
    expect: ok
    rsp: {createAsContainerDatabase: 'true', numberOfPDBs: '1', pdbName: PDB}

  # ---------- several databases ----------
  - id: multi_db_one_bad
    dbs:
      - {params: [*p_create, *p_reco]}
      - {oracle_db_name: DB2, params: [*p_create]}
    expect: failed

  - id: multi_db_removed_dest_second
    dbs:
      - {params: [*p_create, *p_reco]}
      - {oracle_db_name: DB2, datafile_dest: /u02/oradata, params: [*p_create, *p_reco]}
    expect: failed

  - id: multi_db_fs_and_asm_ok
    dbs:
      - {omf: false}
      - {oracle_db_name: DB2, storage_type: ASM, params: [{name: db_create_file_dest, value: '+DATA'}, {name: db_recovery_file_dest, value: '+FRA'}]}
    expect: ok

  # ---------- max_pdbs (license) ----------
  - id: max_pdbs_missing
    dbs: [{max_pdbs: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_missing_no_container_19c
    dbs: [{home: h19, is_container: false, max_pdbs: null, params: [*p_create, *p_reco]}]
    expect: ok

  - id: max_pdbs_missing_state_absent
    dbs: [{state: absent, max_pdbs: null}]
    expect: ok

  - id: max_pdbs_param_state_absent
    dbs: [{max_pdbs: null, params: [*p_create, *p_reco, {name: max_pdbs, value: '3', state: absent}]}]
    expect: failed

  - id: max_pdbs_only_for_sid
    dbs: [{max_pdbs: null, params: [*p_create, *p_reco, {name: max_pdbs, value: '3', sid: DB1, dbca: false}]}]
    expect: failed

  - id: max_pdbs_uppercase_int
    dbs: [{max_pdbs: null, params: [*p_create, *p_reco, {name: MAX_PDBS, value: 5}]}]
    expect: ok

  - id: max_pdbs_not_numeric
    dbs: [{max_pdbs: 'abc', params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_negative
    dbs: [{max_pdbs: '-1', params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_ee_1024
    dbs: [{max_pdbs: '1024', params: [*p_create, *p_reco]}]
    expect: ok

  - id: max_pdbs_ee_1025
    dbs: [{max_pdbs: '1025', params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_se2_3_26ai
    dbs: [{home: h26se2, params: [*p_create, *p_reco]}]
    expect: ok

  - id: max_pdbs_se2_4_26ai
    dbs: [{home: h26se2, max_pdbs: '4', params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_se2_4_19c
    dbs: [{home: h19se2, max_pdbs: 4, params: [*p_create, *p_reco]}]
    expect: failed

  - id: max_pdbs_se2_missing_no_container_19c
    dbs: [{home: h19se2, is_container: false, max_pdbs: null, params: [*p_create, *p_reco]}]
    expect: ok

  - id: multi_db_max_pdbs_second_missing
    dbs:
      - {params: [*p_create, *p_reco]}
      - {oracle_db_name: DB2, max_pdbs: null, params: [*p_create, *p_reco]}
    expect: failed

  # ---------- control_management_pack_access (license) ----------
  - id: cmpa_ee_missing
    dbs: [{cmpa: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_ee_missing_19c_non_cdb
    dbs: [{home: h19, is_container: false, cmpa: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_ee_missing_state_absent
    dbs: [{state: absent, cmpa: null}]
    expect: ok

  - id: cmpa_ee_param_state_absent
    dbs: [{cmpa: null, params: [*p_create, *p_reco, {name: control_management_pack_access, value: 'NONE', state: absent}]}]
    expect: failed

  - id: cmpa_ee_only_for_sid
    dbs: [{cmpa: null, params: [*p_create, *p_reco, {name: control_management_pack_access, value: 'NONE', sid: DB1, dbca: false}]}]
    expect: failed

  - id: cmpa_ee_diagnostic
    dbs: [{cmpa: DIAGNOSTIC, params: [*p_create, *p_reco]}]
    expect: ok

  - id: cmpa_ee_diagnostic_tuning
    dbs: [{cmpa: 'DIAGNOSTIC+TUNING', params: [*p_create, *p_reco]}]
    expect: ok

  - id: cmpa_ee_uppercase_name_lowercase_value
    dbs: [{cmpa: null, params: [*p_create, *p_reco, {name: CONTROL_MANAGEMENT_PACK_ACCESS, value: 'diagnostic+tuning'}]}]
    expect: ok

  - id: cmpa_ee_tuning_only
    dbs: [{cmpa: TUNING, params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_ee_empty
    dbs: [{cmpa: '', params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_se2_missing
    dbs: [{home: h26se2, cmpa: null, params: [*p_create, *p_reco]}]
    expect: ok

  - id: cmpa_se2_invalid
    dbs: [{home: h19se2, cmpa: 'ALL', params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_se2_none_lowercase
    dbs: [{home: h26se2, cmpa: 'none', params: [*p_create, *p_reco]}]
    expect: ok

  - id: cmpa_se2_diagnostic
    dbs: [{home: h26se2, cmpa: DIAGNOSTIC, params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_se2_diagnostic_tuning
    dbs: [{home: h19se2, cmpa: 'DIAGNOSTIC+TUNING', params: [*p_create, *p_reco]}]
    expect: failed

  - id: cmpa_se2_empty
    dbs: [{home: h26se2, cmpa: '', params: [*p_create, *p_reco]}]
    expect: ok

  - id: multi_db_cmpa_second_missing
    dbs:
      - {params: [*p_create, *p_reco]}
      - {oracle_db_name: DB2, cmpa: null, params: [*p_create, *p_reco]}
    expect: failed

  # ---------- memory: sga_target, pga_aggregate_target ----------
  - id: mem_sga_missing
    dbs: [{sga: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: mem_pga_missing
    dbs: [{pga: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: mem_both_missing_19c_non_cdb_se2
    dbs: [{home: h19se2, is_container: false, sga: null, pga: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: mem_missing_state_absent
    dbs: [{state: absent, sga: null, pga: null}]
    expect: ok

  - id: mem_sga_param_state_absent
    dbs: [{sga: null, params: [*p_create, *p_reco, {name: sga_target, value: '1G', state: absent}]}]
    expect: failed

  - id: mem_pga_empty_value
    dbs: [{pga: '', params: [*p_create, *p_reco]}]
    expect: failed

  - id: mem_sid_specific_rac
    dbs:
      - oracle_db_type: RAC
        sga: null
        pga: null
        params:
          - *p_create
          - *p_reco
          - {name: sga_target, value: '1G', sid: DB11, dbca: false}
          - {name: pga_aggregate_target, value: '256M', sid: DB11, dbca: false}
    expect: ok

  - id: mem_uppercase
    dbs: [{sga: null, pga: null, params: [*p_create, *p_reco, {name: SGA_TARGET, value: '1G'}, {name: PGA_AGGREGATE_TARGET, value: '256M'}]}]
    expect: ok

  - id: mem_oracle_db_mem_totalmb
    dbs: [{oracle_db_mem_totalmb: 1024, params: [*p_create, *p_reco]}]
    expect: failed
    rsp_absent: [totalMemory]

  - id: mem_oracle_db_mem_totalmb_19c
    dbs: [{home: h19, oracle_db_mem_totalmb: 1024, params: [*p_create, *p_reco]}]
    expect: failed
    rsp_absent: [totalMemory]

  - id: multi_db_mem_second_missing
    dbs:
      - {params: [*p_create, *p_reco]}
      - {oracle_db_name: DB2, pga: null, params: [*p_create, *p_reco]}
    expect: failed

  # ---------- memory: no memory_target / memory_max_target with Hugepages ----------
  - id: amm_memory_target_hugepages_default
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '2G'}]}]
    expect: failed

  - id: amm_memory_max_target_hugepages_default
    dbs: [{params: [*p_create, *p_reco, {name: MEMORY_MAX_TARGET, value: '2G', scope: spfile}]}]
    expect: failed

  - id: amm_memory_target_sid_hugepages
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '2G', sid: DB1, dbca: false}]}]
    expect: failed

  - id: amm_memory_target_state_absent
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '0', state: absent}, {name: memory_max_target, value: '0', state: absent}]}]
    expect: ok

  - id: amm_memory_target_db_state_absent
    dbs: [{state: absent, params: [{name: memory_target, value: '2G'}]}]
    expect: ok

  - id: amm_memory_target_hugepages_false
    vars: {configure_hugepages: false}
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '2G'}, {name: memory_max_target, value: '2G'}]}]
    expect: ok

  - id: amm_memory_target_hugepages_string_false
    vars: {configure_hugepages: 'false'}
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '2G'}]}]
    expect: ok

  - id: amm_memory_target_hugepages_true
    vars: {configure_hugepages: true}
    dbs: [{params: [*p_create, *p_reco, {name: memory_target, value: '2G'}]}]
    expect: failed

  # ---------- local_listener (Single Instance) ----------
  - id: listener_si_missing
    dbs: [{listener: null, params: [*p_create, *p_reco]}]
    expect: failed

  - id: listener_si_param_state_absent
    dbs: [{listener: null, params: [*p_create, *p_reco, {name: local_listener, value: '//localhost:1521', state: absent}]}]
    expect: failed

  - id: listener_si_uppercase
    dbs: [{listener: null, params: [*p_create, *p_reco, {name: LOCAL_LISTENER, value: '//localhost:1521'}]}]
    expect: ok

  - id: listener_si_missing_state_absent
    dbs: [{state: absent, listener: null}]
    expect: ok

  - id: listener_rac_missing
    dbs: [{oracle_db_type: RAC, listener: null, params: [*p_create, *p_reco]}]
    expect: ok

  - id: listener_raconenode_missing
    dbs: [{oracle_db_type: RACONENODE, listener: null, params: [*p_create, *p_reco]}]
    expect: ok
