---
dependency:
  name: galaxy
  enabled: true

driver:
  name: docker
platforms:
  - name: has-ol9
    image: "${MOLECULE_IMAGE:-quay.io/rendanic/docker-ol9-ansible:latest}"
    pre_build_image: true
    # The following 4 lines are needed only for making systemd work
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${MOLECULE_SW_DIR}:/vagrant:ro
    cgroupns_mode: host
    privileged: true
    # ASM uses MEMORY_TARGET => /dev/shm must be larger than 64m
    # => ORA-00845: MEMORY_TARGET not supported on this system
    shm_size: 4g

verifier:
  name: ansible

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../shared_config/inventory/group_vars/
      host_vars: ../shared_config/inventory/host_vars/
