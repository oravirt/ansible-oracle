---
- name: Converge AHF Fleet Insights
  ansible.builtin.import_playbook: opitzconsulting.ansible_oracle.ahf_fleet_insights
  vars:
    hostgroup: ahf_server

# ansible.builtin.expect for the registration in Fleet Insights
- name: Converge pexpect for AHF
  hosts: ahf_server
  gather_facts: false
  become: true
  tasks:
    - name: Install pexpect
      ansible.builtin.package:
        name: python3-pexpect

- name: Converge AHF
  ansible.builtin.import_playbook: opitzconsulting.ansible_oracle.ahf
  vars:
    hostgroup: ahf_server
    # fact of role ahf_fleet_insights (self-signed certificate)
    ahf_fleet_insights_public_cert: "{{ ahf_fi_public_cert }}"
