---
# Common variables for the module tests (module_tests.yml)

# Scenario specific variables are in <scenario>/module_tests.yml:
#   mt_all_modules       list of the test files (without .yml) of the scenario
#   mt_oracle_home       ORACLE_HOME of the database
#   mt_oracle_sid        ORACLE_SID of the database
#   mt_tns_admin         directory with tnsnames.ora/sqlnet.ora (wallet)
#   mt_cdb, mt_pdb       CDB and PDB for the tests
#   mt_datafile_dir      directory or ASM disk group for explicit data files
#   mt_known_bugs_scenario  known bugs of the scenario (see known_bugs.yml)

# Selection: MODULE_TESTS=oracle_user,oracle_role (empty = mt_all_modules of the scenario)
mt_modules: >-
  {{ (lookup('ansible.builtin.env', 'MODULE_TESTS') | split(',') | map('trim') | select | list)
     or mt_all_modules }}

# Result file on the controller: <scenario>/module_tests_results/<MODULE_TESTS_LABEL>.json
# e.g. MODULE_TESTS_LABEL=cx_oracle before and MODULE_TESTS_LABEL=oracledb after the migration
mt_label: "{{ lookup('ansible.builtin.env', 'MODULE_TESTS_LABEL') | default('latest', true) }}"
mt_result_file: >-
  {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/module_tests_results/{{ mt_label }}.json

mt_env:
  ORACLE_HOME: "{{ mt_oracle_home }}"
  ORACLE_SID: "{{ mt_oracle_sid }}"
  LD_LIBRARY_PATH: "{{ mt_oracle_home }}/lib"
  TNS_ADMIN: "{{ mt_tns_admin }}"

# common known bugs (known_bugs.yml) and known bugs of the scenario
mt_known_bugs: "{{ mt_known_bugs_common | default({}, true) | combine(mt_known_bugs_scenario | default({}, true)) }}"

# module_defaults are templated for gather_facts too => default for missing facts
mt_hostname: "{{ ansible_facts['hostname'] | default(inventory_hostname) }}"
mt_port: 1521

# same logic as oradb_manage_db (lower case keys in dbpasswords)
mt_system_password: "{{ dbpasswords[mt_cdb]['system'] | default(default_dbpass) }}"
mt_sys_password: "{{ dbpasswords[mt_cdb]['sys'] | default(default_dbpass) }}"

# Connection variants for module_defaults in module_tests.yml.
# Set mt_conn on a task or an include to switch the connection.
mt_conn_cdb:
  service_name: "{{ mt_cdb }}"
  user: system
  password: "{{ mt_system_password }}"
  mode: normal
mt_conn_pdb:
  service_name: "{{ mt_pdb }}"
  user: system
  password: "{{ mt_system_password }}"
  mode: normal
mt_conn_cdb_sysdba:
  service_name: "{{ mt_cdb }}"
  user: sys
  password: "{{ mt_sys_password }}"
  mode: sysdba
mt_conn_pdb_sysdba:
  service_name: "{{ mt_pdb }}"
  user: sys
  password: "{{ mt_sys_password }}"
  mode: sysdba
# Oracle wallet: no user/password, service_name is the TNS alias of the wallet credential
mt_conn_pdb_wallet:
  service_name: "{{ mt_pdb }}_SYSTEM"
# not existing user => ORA-01017 without locking an account (FAILED_LOGIN_ATTEMPTS)
mt_conn_pdb_wrong_password:
  service_name: "{{ mt_pdb }}"
  user: moltest_nouser
  password: wrong_password
  mode: normal

# default connection
mt_conn: "{{ mt_conn_pdb }}"
