---
# Tests for oracle_db against the existing CDB mt_cdb.
# Without Grid Infrastructure the module uses /etc/oratab and sqlplus,
# with Grid Infrastructure / Oracle Restart (/etc/oracle/olr.loc) srvctl.
# Only low-risk checks: no dbca, no shutdown/restart.
# - state=started on the running database (startup returns ORA-01081 => ok)
# - state=present with the current settings of DB1 (no restart because archivelog is unchanged)
# - state=present with hostname as ip address and with a host name that does not resolve
# - state=started/absent for a database that does not exist (only checks /etc/oratab)
#   => not executed with Grid Infrastructure / Oracle Restart
# Connection: the module always connects as sys as sysdba (sys_password) to the service
# db_name; there is no wallet entry for DB1, so the wallet variant is not tested.

# same check as the module: /etc/oracle/olr.loc => managed by Grid Infrastructure / Oracle Restart
- name: oracle_db | Grid Infrastructure / Oracle Restart
  ansible.builtin.stat:
    path: /etc/oracle/olr.loc
  register: _db_olr_loc

- name: oracle_db | variables
  ansible.builtin.set_fact:
    _db_gi: "{{ _db_olr_loc.stat.exists }}"
    _db_args:
      oracle_home: "{{ mt_oracle_home }}"
      db_name: "{{ mt_cdb }}"
      sid: "{{ mt_oracle_sid }}"
      sys_password: "{{ mt_sys_password }}"
      port: "{{ mt_port }}"
    _db_settings_sql: >-
      select log_mode || ',' || force_logging || ',' || flashback_on || ','
             || supplemental_log_data_min
      from v$database;

- name: oracle_db | started on running database
  opitzconsulting.ansible_oracle.oracle_db:
    oracle_home: "{{ _db_args.oracle_home }}"
    db_name: "{{ _db_args.db_name }}"
    sid: "{{ _db_args.sid }}"
    sys_password: "{{ _db_args.sys_password }}"
    port: "{{ _db_args.port }}"
    state: started
  register: _res
  ignore_errors: true
- name: oracle_db | check started on running database
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_db.cdb.started_running, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_db | read current settings
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: "{{ _db_settings_sql }}"

- name: oracle_db | remember current settings
  ansible.builtin.set_fact:
    _db_settings: "{{ mt_sql_value }}"

- name: oracle_db | read default tablespace type
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: >-
      select lower(property_value) from database_properties
      where property_name = 'DEFAULT_TBS_TYPE';

- name: oracle_db | remember default tablespace type
  ansible.builtin.set_fact:
    _db_tbs_type: "{{ mt_sql_value }}"

# Run state=present only if all settings are known values, so that the module
# never switches the archivelog mode (=> restart) or another setting of DB1.
- name: oracle_db | present with current settings
  # vars instead of set_fact: set_fact converts YES/NO to a boolean
  vars:
    _db_log_mode: "{{ _db_settings.split(',')[0] }}"
    _db_force_logging: "{{ _db_settings.split(',')[1] }}"
    _db_flashback: "{{ _db_settings.split(',')[2] }}"
    _db_supplemental: "{{ _db_settings.split(',')[3] }}"
  when:
    - _db_log_mode in ['ARCHIVELOG', 'NOARCHIVELOG']
    - _db_force_logging in ['YES', 'NO']
    - _db_flashback in ['YES', 'NO']
    - _db_supplemental in ['YES', 'NO']
    - _db_tbs_type in ['smallfile', 'bigfile']
  block:
    - name: oracle_db | present with current settings
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental == 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check present with current settings
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.present_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

    - name: oracle_db | verify settings unchanged
      ansible.builtin.include_tasks: _sql.yml
      vars:
        mt_sql: "{{ _db_settings_sql }}"
        mt_sql_expect: "{{ _db_settings }}"
        mt_sql_id: oracle_db.cdb.present_idempotent_sql

    # hostname is used for the connection (oravirt#542), default is os.uname()[1]
    - name: oracle_db | present with hostname as ip address
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        hostname: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental == 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check present with hostname as ip address
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.hostname_address, mt_res: "{{ _res }}", mt_expect: ok}

    # the listener listens on all addresses (*:1521) => use a host name that does
    # not resolve (RFC 2606), fails only if hostname is used
    - name: oracle_db | present with hostname that does not resolve
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        hostname: moltest-nohost.invalid
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental == 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check present with hostname that does not resolve
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.hostname_unresolved, mt_res: "{{ _res }}", mt_expect: failed}

    # switch minimal supplemental logging (online, no restart) and back
    - name: oracle_db | switch supplemental logging
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental != 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check switch supplemental logging
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.supplemental_switch, mt_res: "{{ _res }}", mt_expect: changed}

    - name: oracle_db | switch supplemental logging again
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental != 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check switch supplemental logging again
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.supplemental_switch_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

    - name: oracle_db | verify switch supplemental logging
      ansible.builtin.include_tasks: _sql.yml
      vars:
        mt_sql: "select supplemental_log_data_min from v$database;"
        mt_sql_expect: "{{ 'NO' if _db_supplemental == 'YES' else 'YES' }}"
        mt_sql_id: oracle_db.cdb.supplemental_switch_sql

    - name: oracle_db | restore supplemental logging
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: "{{ _db_args.db_name }}"
        sid: "{{ _db_args.sid }}"
        sys_password: "{{ _db_args.sys_password }}"
        port: "{{ _db_args.port }}"
        archivelog: "{{ _db_log_mode == 'ARCHIVELOG' }}"
        force_logging: "{{ _db_force_logging == 'YES' }}"
        flashback: "{{ _db_flashback == 'YES' }}"
        supplemental_logging: "{{ _db_supplemental == 'YES' }}"
        default_tablespace_type: "{{ _db_tbs_type }}"
        state: present
      register: _res
      ignore_errors: true
    - name: oracle_db | check restore supplemental logging
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.supplemental_restore, mt_res: "{{ _res }}", mt_expect: changed}

    - name: oracle_db | verify settings restored
      ansible.builtin.include_tasks: _sql.yml
      vars:
        mt_sql: "{{ _db_settings_sql }}"
        mt_sql_expect: "{{ _db_settings }}"
        mt_sql_id: oracle_db.cdb.supplemental_restore_sql

# databases that do not exist: only /etc/oratab is checked, no database access
# => not with Grid Infrastructure / Oracle Restart (srvctl instead of /etc/oratab)
- name: oracle_db | missing database (without Grid Infrastructure)
  when: not _db_gi | bool
  block:
    - name: oracle_db | started for missing database
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: MOLTEST_NODB
        sid: MOLTEST_NODB
        sys_password: "{{ _db_args.sys_password }}"
        state: started
      register: _res
      ignore_errors: true
    - name: oracle_db | check started for missing database
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.started_missing, mt_res: "{{ _res }}", mt_expect: failed}

    - name: oracle_db | absent for missing database
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _db_args.oracle_home }}"
        db_name: MOLTEST_NODB
        sid: MOLTEST_NODB
        sys_password: "{{ _db_args.sys_password }}"
        state: absent
      register: _res
      ignore_errors: true
    - name: oracle_db | check absent for missing database
      ansible.builtin.include_tasks: _check.yml
      vars: {mt_id: oracle_db.cdb.absent_missing, mt_res: "{{ _res }}", mt_expect: ok}

# error handling: wrong sys password (state=present connects to the database)
- name: oracle_db | wrong sys password
  opitzconsulting.ansible_oracle.oracle_db:
    oracle_home: "{{ _db_args.oracle_home }}"
    db_name: "{{ _db_args.db_name }}"
    sid: "{{ _db_args.sid }}"
    sys_password: wrong_password
    port: "{{ _db_args.port }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_db | check wrong sys password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_db.cdb.wrong_password, mt_res: "{{ _res }}", mt_expect: failed}
