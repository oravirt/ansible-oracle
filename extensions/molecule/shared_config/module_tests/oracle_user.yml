- name: oracle_user | verify common user in CDB$ROOT
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: "select common || ',' || account_status from dba_users where username = '{{ _usr_common }}';"
    mt_sql_expect: "YES,OPEN"
    mt_sql_id: oracle_user.cdb.create_common_sql

- name: oracle_user | verify common user in ORCLPDB
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select common from dba_users where username = '{{ _usr_common }}';"
    mt_sql_expect: "YES"
    mt_sql_id: oracle_user.cdb.create_common_pdb_sql

- name: oracle_user | lock common user
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_common }}"
    state: locked
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
