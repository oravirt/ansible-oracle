- name: oracle_user | check lock again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.locked_idempotent_wallet, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify lock
  ansible.builtin.include_tasks: _sql.yml
