  vars: {mt_id: oracle_user.cdb.create_common_sysdba, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | create common user again (system)
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_common }}"
    container: all
    state: present
  vars:
    mt_conn: "{{ mt_conn_cdb }}"
