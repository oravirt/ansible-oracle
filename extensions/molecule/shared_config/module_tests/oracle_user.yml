  ignore_errors: true
- name: oracle_user | check lock common user
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.cdb.locked_common, mt_res: "{{ _res }}", mt_expect: changed}

# documented: container_data sets CONTAINER_DATA=<container> after the creation
- name: oracle_user | create common user with container_data
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_common_cd }}"
    schema_password: "{{ _usr_password }}"
    container: all
    container_data: all
    state: present
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
  register: _res
  ignore_errors: true
- name: oracle_user | check create common user with container_data
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.cdb.create_container_data, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | verify container_data
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: >-
      select count(*) from dba_container_data
      where username = '{{ _usr_common_cd }}' and all_containers = 'Y';
    mt_sql_expect: "1"
    mt_sql_id: oracle_user.cdb.create_container_data_sql

- name: oracle_user | drop common users
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ item.schema }}"
    state: absent
  loop:
    - {schema: "{{ _usr_common }}", id: oracle_user.cdb.drop_common}
    - {schema: "{{ _usr_common_cd }}", id: oracle_user.cdb.drop_container_data}
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
  register: _res
  ignore_errors: true
- name: oracle_user | check drop common users
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: "{{ _usr_item.item.id }}", mt_res: "{{ _usr_item }}", mt_expect: changed}
  loop: "{{ _res.results }}"
  loop_control:
    loop_var: _usr_item

- name: oracle_user | drop common user again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_common }}"
    state: absent
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
  register: _res
  ignore_errors: true
- name: oracle_user | check drop common user again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.cdb.drop_common_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify drop common users
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: >-
      select count(*) from dba_users
      where username in ('{{ _usr_common }}', '{{ _usr_common_cd }}');
    mt_sql_expect: "0"
    mt_sql_id: oracle_user.cdb.drop_sql

- name: oracle_user | teardown tablespace MOLTEST_USERS
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "drop tablespace MOLTEST_USERS including contents and datafiles;"

- name: oracle_user | teardown grant on SYS.USER$ for SYSTEM
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: "revoke read on sys.user$ from system container=all;"
