---
# Tests for oracle_user
# PDB ORCLPDB (local users MOLTEST_USER, MOLTEST_USER2, MOLTEST_EXT):
# - create, idempotence, states locked/unlocked/expired/expired & locked/present,
#   change default tablespace, update_password on_create, password hash, external user,
#   drop, error cases (missing schema, missing password, wrong password)
# CDB$ROOT (common users C##MOLTEST_USER, C##MOLTEST_CD):
# - create with container=all, container_data, drop
# - connection variants: system (default), sys as sysdba (PDB and CDB), system in CDB, wallet
# - oracle_user does not support check mode
- name: oracle_user | variables
  ansible.builtin.set_fact:
    _usr_name: MOLTEST_USER
    _usr_name2: MOLTEST_USER2
    _usr_ext: MOLTEST_EXT
    _usr_common: C##MOLTEST_USER
    _usr_common_cd: C##MOLTEST_CD
    _usr_password: "Moltest_Pw_1#x"
    _usr_password2: "Moltest_Pw_2#y"

# documented requirement: the connect user needs READ on SYS.USER$ (password check)
# ORCLPDB on 26ai has no tablespace USERS => own smallfile tablespace
- name: oracle_user | setup grant on SYS.USER$ for SYSTEM
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql: "grant read on sys.user$ to system container=all;"

- name: oracle_user | setup tablespace MOLTEST_USERS
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: |
      declare
        n number;
      begin
        select count(*) into n from dba_tablespaces where tablespace_name = 'MOLTEST_USERS';
        if n = 0 then
          execute immediate 'create smallfile tablespace MOLTEST_USERS datafile size 10M '
                         || 'autoextend on next 10M maxsize 200M';
        end if;
      end;
      /

- name: oracle_user | cleanup PDB users
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ item }}"
    state: absent
  loop:
    - "{{ _usr_name }}"
    - "{{ _usr_name2 }}"
    - "{{ _usr_ext }}"
  register: _res
  ignore_errors: true

- name: oracle_user | cleanup CDB users
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ item }}"
    state: absent
  loop:
    - "{{ _usr_common }}"
    - "{{ _usr_common_cd }}"
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
  register: _res
  ignore_errors: true

# ---------------------------------------------------------------- PDB
- name: oracle_user | create
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    schema_password: "{{ _usr_password }}"
    default_tablespace: MOLTEST_USERS
    default_temp_tablespace: TEMP
    profile: DEFAULT
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create, mt_res: "{{ _res }}", mt_expect: changed}

# documented: the password is checked against the S: hash, without S: hash it is reset
- name: oracle_user | create again with password
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    schema_password: "{{ _usr_password }}"
    default_tablespace: MOLTEST_USERS
    default_temp_tablespace: TEMP
    profile: DEFAULT
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create again with password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | create again without password
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    default_tablespace: MOLTEST_USERS
    default_temp_tablespace: TEMP
    profile: DEFAULT
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create again without password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_idempotent_nopw, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify create
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select account_status || ',' || default_tablespace || ',' || temporary_tablespace
      || ',' || profile || ',' || authentication_type
      from dba_users where username = '{{ _usr_name }}';
    mt_sql_expect: "OPEN,MOLTEST_USERS,TEMP,DEFAULT,PASSWORD"
    mt_sql_id: oracle_user.pdb.create_sql

- name: oracle_user | verify quota on default tablespace
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select max_bytes from dba_ts_quotas
      where username = '{{ _usr_name }}' and tablespace_name = 'MOLTEST_USERS';
    mt_sql_expect: "-1"
    mt_sql_id: oracle_user.pdb.create_quota_sql

# update_password=on_create: the password of an existing user is not changed
- name: oracle_user | other password with update_password on_create
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    schema_password: "{{ _usr_password2 }}"
    update_password: on_create
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check update_password on_create
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.update_password_on_create, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | change default tablespace (sys as sysdba)
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    default_tablespace: SYSAUX
    state: present
  vars:
    mt_conn: "{{ mt_conn_pdb_sysdba }}"
  register: _res
  ignore_errors: true
- name: oracle_user | check change default tablespace
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.change_tablespace_sysdba, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | change default tablespace again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    default_tablespace: SYSAUX
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check change default tablespace again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.change_tablespace_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify default tablespace
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select default_tablespace from dba_users where username = '{{ _usr_name }}';"
    mt_sql_expect: "SYSAUX"
    mt_sql_id: oracle_user.pdb.change_tablespace_sql

- name: oracle_user | lock
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: locked
  register: _res
  ignore_errors: true
- name: oracle_user | check lock
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.locked, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | lock again (wallet)
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
