- name: oracle_user | unlock
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: unlocked
  register: _res
  ignore_errors: true
- name: oracle_user | check unlock
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.unlocked, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | unlock again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: unlocked
  register: _res
  ignore_errors: true
- name: oracle_user | check unlock again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.unlocked_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify unlock
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select account_status from dba_users where username = '{{ _usr_name }}';"
