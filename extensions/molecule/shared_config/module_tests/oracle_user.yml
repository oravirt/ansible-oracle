  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: expired & locked
  register: _res
  ignore_errors: true
- name: oracle_user | check expire and lock
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.expired_locked, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | expire and lock again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: expired & locked
  register: _res
  ignore_errors: true
- name: oracle_user | check expire and lock again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.expired_locked_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify expire and lock
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select account_status from dba_users where username = '{{ _usr_name }}';"
    mt_sql_expect: "EXPIRED & LOCKED"
    mt_sql_id: oracle_user.pdb.expired_locked_sql

# documented: present unlocks an existing user (ACCOUNT UNLOCK), the password stays expired
- name: oracle_user | present after expired & locked
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check present after expired & locked
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.present_after_expired, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | present again after expired
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check present again after expired
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.present_after_expired_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify present after expired
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select account_status from dba_users where username = '{{ _usr_name }}';"
    mt_sql_expect: "EXPIRED"
    mt_sql_id: oracle_user.pdb.present_after_expired_sql

# documented: locked only locks, the expired password stays expired
- name: oracle_user | lock expired user
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: locked
  register: _res
  ignore_errors: true
- name: oracle_user | check lock expired user
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.locked_after_expired, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | lock expired user again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: locked
  register: _res
  ignore_errors: true
- name: oracle_user | check lock expired user again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.locked_after_expired_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

# documented: expired does not change the lock => nothing to do for EXPIRED & LOCKED
- name: oracle_user | expire locked user
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: expired
  register: _res
  ignore_errors: true
- name: oracle_user | check expire locked user
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.expired_after_locked_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify lock expired user
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select account_status from dba_users where username = '{{ _usr_name }}';"
    mt_sql_expect: "EXPIRED & LOCKED"
    mt_sql_id: oracle_user.pdb.locked_after_expired_sql

- name: oracle_user | unlock expired user
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check unlock expired user
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.unlocked_after_expired, mt_res: "{{ _res }}", mt_expect: changed}

# password hash: create a second user with the hash of the first user
- name: oracle_user | get password hash of the first user
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select spare4 from sys.user$ where name = '{{ _usr_name }}';"
- name: oracle_user | remember password hash
  ansible.builtin.set_fact:
    _usr_hash: "{{ mt_sql_value }}"

- name: oracle_user | create with password hash
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name2 }}"
    schema_password_hash: "{{ _usr_hash }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create with password hash
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_hash, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | create with password hash again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name2 }}"
    schema_password_hash: "{{ _usr_hash }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create with password hash again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_hash_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify password hash
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select spare4 from sys.user$ where name = '{{ _usr_name2 }}';"
    mt_sql_expect: "{{ _usr_hash }}"
    mt_sql_id: oracle_user.pdb.create_hash_sql

# external authentication
- name: oracle_user | create external user
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_ext }}"
    authentication_type: external
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create external user
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_external, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_user | create external user again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_ext }}"
    authentication_type: external
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create external user again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_external_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify external user
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select authentication_type from dba_users where username = '{{ _usr_ext }}';"
    mt_sql_expect: "EXTERNAL"
    mt_sql_id: oracle_user.pdb.create_external_sql

- name: oracle_user | drop
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ item.schema }}"
    state: absent
  loop:
    - {schema: "{{ _usr_name }}", id: oracle_user.pdb.drop}
    - {schema: "{{ _usr_name2 }}", id: oracle_user.pdb.drop_hash_user}
    - {schema: "{{ _usr_ext }}", id: oracle_user.pdb.drop_external_user}
  register: _res
  ignore_errors: true
- name: oracle_user | check drop
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: "{{ _usr_item.item.id }}", mt_res: "{{ _usr_item }}", mt_expect: changed}
  loop: "{{ _res.results }}"
  loop_control:
    loop_var: _usr_item

- name: oracle_user | drop again
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: absent
  register: _res
  ignore_errors: true
- name: oracle_user | check drop again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.drop_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify drop
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select count(*) from dba_users
      where username in ('{{ _usr_name }}', '{{ _usr_name2 }}', '{{ _usr_ext }}');
    mt_sql_expect: "0"
    mt_sql_id: oracle_user.pdb.drop_sql

# error handling
- name: oracle_user | create without password
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check create without password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.create_no_password, mt_res: "{{ _res }}", mt_expect: failed}

# documented: schema is required
- name: oracle_user | missing schema
  opitzconsulting.ansible_oracle.oracle_user:
    schema_password: "{{ _usr_password }}"
    state: present
  register: _res
  ignore_errors: true
- name: oracle_user | check missing schema
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.missing_schema, mt_res: "{{ _res }}", mt_expect: failed}

- name: oracle_user | wrong password
  opitzconsulting.ansible_oracle.oracle_user:
    schema: "{{ _usr_name }}"
    state: absent
  vars:
    mt_conn: "{{ mt_conn_pdb_wrong_password }}"
  register: _res
  ignore_errors: true
- name: oracle_user | check wrong password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.wrong_password, mt_res: "{{ _res }}", mt_expect: failed}

# ---------------------------------------------------------------- CDB
