- name: oracle_user | check expire again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_user.pdb.expired_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_user | verify expire
  ansible.builtin.include_tasks: _sql.yml
  vars:
