      from dba_data_files where tablespace_name = '{{ _ts_df }}';
    mt_sql_expect: "{{ _ts_dir }}/moltest_ts_df01.dbf,{{ _ts_dir }}/moltest_ts_df02.dbf"
    mt_sql_id: oracle_tablespace.pdb.datafile_add_sql

