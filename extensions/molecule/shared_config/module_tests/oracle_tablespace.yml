  ignore_errors: true
- name: oracle_tablespace | check create with data file
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.datafile_create, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | add data file
