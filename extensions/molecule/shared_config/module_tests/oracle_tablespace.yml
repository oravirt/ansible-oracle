# grow and shrink with units in lower case (k, m, g)
# The files are not resized (documented): grow/shrink = autoextend nextsize/maxsize.
# Changes are only detected for M, G and T (documented) => k and unlimited are not applied.
# verify: bigfile,size MB,next MB,maxsize MB,autoextensible
- name: oracle_tablespace | create resize tablespace (10m, next 1m, max 100m)
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_resize }}"
    bigfile: true
    autoextend: true
    size: 10m
    nextsize: 1m
    maxsize: 100m
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create resize tablespace (10m, next 1m, max 100m)
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.resize_create, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | verify resize_create
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "{{ _ts_resize_sql }}"
    mt_sql_expect: "YES,10,1,100,YES"
    mt_sql_id: oracle_tablespace.pdb.resize_create_sql

- name: oracle_tablespace | create resize tablespace again
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_resize }}"
    bigfile: true
    autoextend: true
    size: 10m
    nextsize: 1m
    maxsize: 100m
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create resize tablespace again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.resize_create_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_tablespace | same sizes with upper case units
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_resize }}"
    bigfile: true
    autoextend: true
    size: 10M
    nextsize: 1M
    maxsize: 100M
  register: _res
  ignore_errors: true
