# cleanup with the module
- name: oracle_tablespace | drop test tablespaces
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ item }}"
    state: absent
  loop: "{{ _ts_all }}"
  register: _res_loop
  ignore_errors: true

- name: oracle_tablespace | verify cleanup
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
