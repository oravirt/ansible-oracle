---
# Tests for oracle_tablespace in PDB ORCLPDB (OMF: db_create_file_dest is set) and CDB DB1
# - OMF tablespace: create with numfiles, add files, autoextend settings, status changes
#   (read_only, read_write, offline, online, present), drop
# - explicit data files: add a file, bigfile tablespace, more than one file for bigfile,
#   no file is added to an existing bigfile tablespace
# - bigfile: false creates SMALLFILE tablespaces (also temporary and undo), independent of
#   the default tablespace type of the database (BIGFILE in 26ai)
# - grow/shrink of autoextend nextsize/maxsize with units in lower case (k, m, g),
#   size of existing files is not changed
# - temporary and undo tablespace
# - connection variants: system (default), sys as sysdba, system in CDB, wallet,
#   wrong password
- name: oracle_tablespace | variables
  ansible.builtin.set_fact:
    _ts_name: MOLTEST_TS
    _ts_df: MOLTEST_TS_DF
    _ts_big: MOLTEST_TS_BIG
    _ts_temp: MOLTEST_TS_TEMP
    _ts_undo: MOLTEST_TS_UNDO
    _ts_cdb: MOLTEST_TS_CDB
    _ts_resize: MOLTEST_TS_RESIZE
    _ts_resize_sql: >-
      select t.bigfile || ',' || f.bytes/1048576 || ','
             || f.increment_by*t.block_size/1048576 || ',' || f.maxbytes/1048576
             || ',' || f.autoextensible
      from dba_tablespaces t join dba_data_files f on f.tablespace_name = t.tablespace_name
      where t.tablespace_name = 'MOLTEST_TS_RESIZE';
    # directory or ASM disk group (+DATA) for explicit data files
    _ts_dir: "{{ mt_datafile_dir }}"
    _ts_all: [MOLTEST_TS, MOLTEST_TS_DF, MOLTEST_TS_BIG, MOLTEST_TS_TEMP, MOLTEST_TS_UNDO,
              MOLTEST_TS_RESIZE]

- name: oracle_tablespace | cleanup in PDB
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: |-
      begin
        for r in (select tablespace_name from dba_tablespaces
                  where tablespace_name like 'MOLTEST\_TS%' escape '\') loop
          execute immediate 'drop tablespace ' || r.tablespace_name
            || ' including contents and datafiles';
        end loop;
      end;
      /

# data files left over from an aborted run (tablespaces are dropped above)
# ASM: the files are removed by drop tablespace ... including datafiles
- name: oracle_tablespace | cleanup explicit data files
  ansible.builtin.file:
    path: "{{ _ts_dir }}/{{ item }}"
    state: absent
  when: not _ts_dir.startswith('+')
  loop:
    - moltest_ts_df01.dbf
    - moltest_ts_df02.dbf
    - moltest_ts_big01.dbf
    - moltest_ts_big02.dbf

- name: oracle_tablespace | cleanup in CDB
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_cdb }}"
    state: absent
  vars:
    mt_conn: "{{ mt_conn_cdb_sysdba }}"
  register: _res
  ignore_errors: true

# OMF tablespace (smallfile, bigfile: false is the default)
- name: oracle_tablespace | create OMF tablespace
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    numfiles: 1
    size: 10M
    autoextend: true
    nextsize: 1M
    maxsize: 100M
    state: present
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create OMF tablespace
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.create_omf, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | create OMF tablespace again
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    numfiles: 1
    size: 10M
    autoextend: true
    nextsize: 1M
    maxsize: 100M
    state: present
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create OMF tablespace again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.create_omf_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_tablespace | verify create OMF tablespace
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select t.bigfile || ',' || t.status || ',' || count(f.file_name) || ','
      || min(f.autoextensible) || ',' || min(f.maxbytes) || ',' || max(f.maxbytes)
      from dba_tablespaces t join dba_data_files f on f.tablespace_name = t.tablespace_name
      where t.tablespace_name = '{{ _ts_name }}' group by t.bigfile, t.status;
    mt_sql_expect: "NO,ONLINE,1,YES,104857600,104857600"
    mt_sql_id: oracle_tablespace.pdb.create_omf_sql

- name: oracle_tablespace | add OMF file (numfiles 2)
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    numfiles: 2
    size: 10M
    autoextend: true
    nextsize: 1M
    maxsize: 100M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check add OMF file
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.add_omf_file, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | add OMF file again
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    numfiles: 2
    size: 10M
    autoextend: true
    nextsize: 1M
    maxsize: 100M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check add OMF file again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.add_omf_file_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_tablespace | verify add OMF file
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: "select count(*) from dba_data_files where tablespace_name = '{{ _ts_name }}';"
    mt_sql_expect: "2"
    mt_sql_id: oracle_tablespace.pdb.add_omf_file_sql

# autoextend settings are enforced on all files
- name: oracle_tablespace | change maxsize
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    size: 10M
    autoextend: true
    nextsize: 2M
    maxsize: 200M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check change maxsize
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.change_autoextend, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | change maxsize again
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    size: 10M
    autoextend: true
    nextsize: 2M
    maxsize: 200M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check change maxsize again
  ansible.builtin.include_tasks: _check.yml
  vars:
    mt_id: oracle_tablespace.pdb.change_autoextend_idempotent
    mt_res: "{{ _res }}"
    mt_expect: ok

- name: oracle_tablespace | verify change maxsize
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select count(*) from dba_data_files f join dba_tablespaces t
      on t.tablespace_name = f.tablespace_name
      where f.tablespace_name = '{{ _ts_name }}'
      and (f.maxbytes <> 209715200 or f.increment_by * t.block_size <> 2097152
           or f.autoextensible <> 'YES');
    mt_sql_expect: "0"
    mt_sql_id: oracle_tablespace.pdb.change_autoextend_sql

