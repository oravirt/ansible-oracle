    content: temp
    size: 10M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create temporary tablespace
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.temp_create, mt_res: "{{ _res }}", mt_expect: changed}

- name: oracle_tablespace | create temporary tablespace again
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_temp }}"
    content: temp
    size: 10M
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check create temporary tablespace again
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.temp_create_idempotent, mt_res: "{{ _res }}", mt_expect: ok}

- name: oracle_tablespace | verify temporary tablespace
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select t.contents || ',' || t.bigfile || ',' || count(*) from dba_tablespaces t
      join dba_temp_files f on f.tablespace_name = t.tablespace_name
      where t.tablespace_name = '{{ _ts_temp }}' group by t.contents, t.bigfile;
    mt_sql_expect: "TEMPORARY,NO,1"
    mt_sql_id: oracle_tablespace.pdb.temp_create_sql

