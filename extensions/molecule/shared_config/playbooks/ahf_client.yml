---
# AHF as client of AHF Fleet Insights (scenarios dbfs, has-ol9)
# Requires ahf_download.yml and ahf_fleet_connect.yml (molecule_ahffi_available).
#
# Variables:
#   molecule_ahf_collect              create one TFA collection for the upload into Fleet Insights
#                                     (default: true)
#   molecule_ahf_fleet_ignore_errors  ignore failures of the registration in Fleet Insights
#                                     (default: false)

# ansible.builtin.expect for the registration in Fleet Insights
- name: Install pexpect for AHF
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install pexpect
      ansible.builtin.package:
        name: python3-pexpect
      when: molecule_ahffi_available | bool

# Role ahf in block/rescue (like playbooks/ahf.yml otherwise):
# molecule_ahf_fleet_ignore_errors=true ignores failures of the registration in
# AHF Fleet Insights (tasks fleet_insights_client), all other failures stop the converge.
- name: Converge AHF
  hosts: all
  become: true
  any_errors_fatal: true
  vars:
    oracle_sw_copy: false
    oracle_stage_remote: /u01/stage/download
    # Fleet Insights is optional for the clients (provided by the scenario ahf):
    # registration only, when Fleet Insights is reachable, otherwise the registration
    # is not changed (no deregistration without Fleet Insights)
    ahf_fleet_insights_client: true
    ahf_fleet_insights_manage: "{{ molecule_ahffi_available | bool }}"
    ahf_fleet_insights_public_cert: "{{ molecule_ahffi_public_cert | default('') }}"
  tasks:
    - name: AHF
      block:
        - name: Role ahf
          ansible.builtin.include_role:
            name: opitzconsulting.ansible_oracle.ahf
      rescue:
        - name: Failure outside the registration in AHF Fleet Insights
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('see failed task above') }}"
          when: >-
            not molecule_ahf_fleet_ignore_errors | default(false) | bool
            or 'fleet_insights_client' not in ansible_failed_task.name | default('')

        - name: Ignored failure of the registration in AHF Fleet Insights
          ansible.builtin.debug:
            msg: >-
              IGNORED (molecule_ahf_fleet_ignore_errors):
              {{ ansible_failed_task.name | default('') }}:
              {{ ansible_failed_result.msg | default('') }}

        - name: Remember failed registration
          ansible.builtin.set_fact:
            molecule_ahffi_registered: false

# Only once (marker file) => no change in the idempotence check
- name: TFA collection for AHF Fleet Insights
  hosts: all
  gather_facts: false
  become: true
  tasks:
    # -insights: AHF Insights data, which updates the dashboard of Fleet Insights immediately
    #            (otherwise Insights are collected at 05:00 and 17:00 only)
    # -silent:   background collection without questions
    #            (without it, tfactl asks for an event or event time, e.g. with GI)
    - name: Create TFA collection with AHF Insights
      ansible.builtin.shell: >-
        /opt/oracle.ahf/bin/tfactl diagcollect -insights -last 1h -silent
        && touch /opt/oracle.ahf.molecule_collect
      args:
        creates: /opt/oracle.ahf.molecule_collect
      register: _mol_collect
      when:
        - molecule_ahffi_available | bool
        - molecule_ahffi_registered | default(true) | bool
        - molecule_ahf_collect | default(true) | bool

    - name: Result of TFA collection
      ansible.builtin.debug:
        var: _mol_collect.stdout_lines
      when: _mol_collect.stdout_lines is defined
