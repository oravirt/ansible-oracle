---
# RAC database RACCDB (Oracle AI Database 26ai) on the cluster molecule-rac
#
# The database home must not be newer than Grid Infrastructure (RU-1 in the converge)
# => RU-1 of 26ai from oracle_ru.yml (db_home_<molecule_ru_26_prev_short>.zip)
# runInstaller on rac-1 copies the ORACLE_HOME to rac-2 (clusterNodes from
# orasw_meta_cluster_hostgroup), root.sh on all nodes.
# dbca on rac-1 creates the instances RACCDB1 (rac-1) and RACCDB2 (rac-2).
db_homes_config:
  db26prev-rac-ee:
    version: 26.1.0.0
    oracle_home: "/u01/app/oracle/product/26/db_{{ molecule_ru_26_prev_short }}"
    imagename: "db_home_{{ molecule_ru_26_prev_short }}.zip"
    edition: EE
    readonly_home: true
    oracle_home_name: "db{{ molecule_ru_26_prev_nodot }}racee"

db_homes_installed:
  - home: db26prev-rac-ee
    state: present
    apply_patches: false

# The listener LISTENER and the SCAN listener are resources of Grid Infrastructure.
# RAC: Clusterware sets local_listener and remote_listener.
oracle_databases:
  - home: db26prev-rac-ee
    oracle_db_name: RACCDB
    oracle_db_type: RAC
    storage_type: ASM
    oracle_database_type: MULTIPURPOSE
    redolog_size: 50M
    redolog_groups: 2
    listener_port: 1521
    archivelog: false
    flashback: false
    force_logging: false
    state: present
    init_parameters:
      - {name: max_pdbs, value: '3', scope: both, state: present}
      - {name: control_management_pack_access, value: 'NONE', scope: both, state: present}
      - {name: db_create_file_dest, value: '+DATA', scope: both, state: present}
      - {name: db_recovery_file_dest_size, value: '8G', scope: both, state: present, dbca: false}
      - {name: db_recovery_file_dest, value: '+FRA', scope: both, state: present}
      - {name: recyclebin, value: 'off', scope: spfile, state: present}
      - {name: pga_aggregate_target, value: '256M', scope: both, state: present}
      - {name: processes, value: '320', scope: spfile, state: present}
      # 1536M: ORA-04031 in java pool during datapatch of dbca
      - {name: sga_target, value: '2560M', scope: spfile, state: present}

# PDB ORCLPDB1 in RACCDB (open on all instances), used by the module tests (side_effect.yml)
oracle_pdbs:
  - cdb: RACCDB
    home: db26prev-rac-ee
    pdb_name: ORCLPDB1
    listener_port: 1521
    state: present

# tnsnames.ora, sqlnet.ora and wallet on every node for the module tests (side_effect.yml)
# Read-Only Oracle Home => files are in ORACLE_BASE_HOME (/u01/app/oracle/homes/<oracle_home_name>)
# the alias is used for the wallet credential (items2dict in group_vars/all drops 'alias')
oracle_tnsnames_config:
  ORCLPDB1:
    alias:
      - ORCLPDB1_SYSTEM
    connect:
      service_name: ORCLPDB1
    address:
      - host: "{{ ansible_hostname }}"

tnsnames_installed:
  - tnsname: ORCLPDB1
    home: db26prev-rac-ee
    state: present

sqlnet_installed:
  - home: db26prev-rac-ee
    sqlnet: sqlnetalias1
    state: present

oracle_wallet_config:
  - name: wallet1
    home: db26prev-rac-ee
    path: /u01/app/oracle/wallet
    state: present
    dbcredentials:
      - tns_name: ORCLPDB1_SYSTEM
        db_name: ORCLPDB1
        db_user: system
        state: present
