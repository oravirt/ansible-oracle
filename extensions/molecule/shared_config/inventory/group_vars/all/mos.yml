---
# My Oracle Support credentials from the environment variables MOS_USERNAME / MOS_PASSWORD.
# The Taskfile (tools/molecule.sh) loads them from extensions/.env,
# variables of the environment have precedence.
mos_login: "{{ lookup('ansible.builtin.env', 'MOS_USERNAME') }}"
mos_password: "{{ lookup('ansible.builtin.env', 'MOS_PASSWORD') }}"
# orasw_download_patches uses mos_login, autoupgrade uses mos_username
mos_username: "{{ mos_login }}"
