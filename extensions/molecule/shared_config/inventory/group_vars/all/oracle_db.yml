---
# special test with copy patches via www
# is_sw_source_local: false
# oracle_sw_source_www: http://10.0.2.15:8080

is_sw_source_local: true
oracle_sw_copy: true
oracle_sw_unpack: true

# directory for patch download
oracle_sw_source_local: /vagrant

# Directory for Installation-Media
oracle_stage_remote: /vagrant

autostartup_service: true

# Directory for response files, extraceted patches etc.
oracle_stage: /u01/stage

oraswdb_golden_image_create: true
golden_image_dest: /u01/golden

apply_patches_db: false

oracle_sw_patches:
  - filename: cvupack_linux_ol7_x86_64.zip
    patchid: 30839369
    version: 21.0.0.0
    description: Latest cluvfy
  # - filename: p36695709_2410_Generic.zip
  #   patchid: 36695709
  #   version: 24.1
  #   description: PSE BUNDLE FOR APEX 24.1
  #   opatch_needed: false
  # RU for the patch tests (dbfs-ol9): must match molecule_ru_19 in oracle_ru.yml
  # => update manually after a renovate update of oracle_ru.yml (patch id is not known by renovate)
  - filename: p39472050_190000_Linux-x86-64.zip
    patchid: 39472050
    version: 19.3.0.0
    description: Database Release Update 19.32.0.0.260721

# Important!
# The converge.yml disables the installation of patches.
# Patching is tested in side_effect.yml of dbfs-ol9.
db_homes_installed:
  - home: db19-si-ee
    state: present
    apply_patches: "{{ apply_patches_db }}"  # patching is done in side-effect.yml!

# ORACLE_HOMEs with the Release Updates of oracle_ru.yml (updated by renovate):
#   db19curr-si-ee / db26curr-si-ee: current RU      (molecule_ru_19 / molecule_ru_26)
#   db19prev-si-ee / db26prev-si-ee: previous RU-1   (molecule_ru_19_prev / molecule_ru_26_prev)
# The keys are fixed, only the values follow the RU.
# Use the stable aliases db19-si-ee / db26-si-ee unless a scenario needs a specific RU.
db_homes_config:
  db19prev-si-ee: &db19prev-si-ee
    version: 19.3.0.0
    oracle_home: "/u01/app/oracle/product/19/db_{{ molecule_ru_19_prev }}"
    edition: EE
    opatch_minversion: 12.2.0.1.52
    imagename: "db_home_{{ molecule_ru_19_prev }}.zip"
    readonly_home: true
    oracle_home_name: "db{{ molecule_ru_19_prev_nodot }}siee"
    opatch: []
  db19curr-si-ee: &db19curr-si-ee
    version: 19.3.0.0
    oracle_home: "/u01/app/oracle/product/19/db_{{ molecule_ru_19 }}"
    edition: EE
    opatch_minversion: 12.2.0.1.52
    imagename: "db_home_{{ molecule_ru_19 }}.zip"
    readonly_home: true
    oracle_home_name: "db{{ molecule_ru_19_nodot }}siee"
    opatch: []
  db26prev-si-ee: &db26prev-si-ee
    version: 26.1.0.0
    oracle_home: "/u01/app/oracle/product/26/db_{{ molecule_ru_26_prev_short }}"
    imagename: "db_home_{{ molecule_ru_26_prev_short }}.zip"
    edition: EE
    readonly_home: true
    oracle_home_name: "db{{ molecule_ru_26_prev_nodot }}siee"
  db26curr-si-ee: &db26curr-si-ee
    version: 26.1.0.0
    oracle_home: "/u01/app/oracle/product/26/db_{{ molecule_ru_26_short }}"
    imagename: "db_home_{{ molecule_ru_26_short }}.zip"
    edition: EE
    readonly_home: true
    oracle_home_name: "db{{ molecule_ru_26_nodot }}siee"
  # stable aliases for the scenarios
  # 19c: RU-1 => patch tests (dbfs-ol9) patch it to the current RU
  db19-si-ee:
    <<: *db19prev-si-ee
  # 26ai: current RU (dbfs, dbfs-ol10, dataguard, target of the upgrade)
  db26-si-ee:
    <<: *db26curr-si-ee

oracle_listeners_config:
  LISTENER:
    address:
      - host: "{{ ansible_hostname }}"
        protocol: TCP
        port: 1521
  LISTENER1522:
    address:
      - host: "{{ ansible_hostname }}"
        protocol: TCP
        port: 1522

listener_installed:
  - home: db19-si-ee
    listener_name: LISTENER
    state: present
  - home: db19-si-ee
    listener_name: LISTENER1522
    state: present

_tnsnames_config_pdb_helper:
  - key: "{{ oracle_pdbs[0]['pdb_name'] }}"
    alias:
      - "{{ oracle_pdbs[0]['pdb_name'] }}_SYSTEM"
      - "{{ oracle_pdbs[0]['pdb_name'] }}_PERFSTAT"
    value:
      connect:
        service_name: "{{ oracle_pdbs[0]['pdb_name'] }}"
      address:
        - host: "{{ ansible_hostname }}"

oracle_tnsnames_config: "{{ _tnsnames_config_pdb_helper | items2dict }}"

tnsnames_installed:
  - tnsname: "{{ oracle_pdbs[0]['pdb_name'] }}"
    home: db19-si-ee
    state: present

sqlnet_config:
  sqlnetalias1:
    - {name: "ADR_BASE", value: "/u01/app/oracle/"}
    - {name: "SQLNET.ALLOWED_LOGON_VERSION_CLIENT", value: 12}
    - {name: "SQLNET.WALLET_OVERRIDE", value: 'TRUE'}
    - name: WALLET_LOCATION
      value: |-
        (
          SOURCE =
            (METHOD = FILE)(METHOD_DATA = (DIRECTORY=/u01/app/oracle/wallet))
          )

sqlnet_installed:
  - home: db19-si-ee
    sqlnet: sqlnetalias1
    state: present

oracle_wallet_config:
  - name: wallet1
    home: db19-si-ee
    path: /u01/app/oracle/wallet
    state: present
    # mode: g+rx
    dbcredentials:
      - tns_name: "{{ oracle_pdbs[0]['pdb_name'] }}_SYSTEM"
        db_name: "{{ oracle_pdbs[0]['pdb_name'] }}"
        db_user: system
        state: present
      - tns_name: "{{ oracle_pdbs[0]['pdb_name'] }}_PERFSTAT"
        db_name: "{{ oracle_pdbs[0]['pdb_name'] }}"
        db_user: perfstat
        state: present
