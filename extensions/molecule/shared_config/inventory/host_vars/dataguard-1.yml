---
# Scenario dataguard: initial primary of the Data Guard configuration DG1
#
# Common configuration (db_standby_config, tnsnames, listener, pdbs): group_vars/dg_db1/standby.yml

oracle_databases:
  - home: db26-si-ee
    oradb_facts_ignore_unreachable: true
    oracle_db_name: DB1
    oracle_db_unique_name: DB1_SITE1
    standby_config: DG1
    oracle_db_type: SI
    storage_type: FS
    oracle_database_type: MULTIPURPOSE
    redolog_size: 50M
    redolog_groups: 3
    listener_name: LISTENER
    listener_port: 1521
    archivelog: true
    flashback: true
    force_logging: true
    state: present
    init_parameters:
      # EZConnect of the local listener => replaces the alias LISTENER_<SID> from dbca,
      # the standby gets its own value with SET in RMAN DUPLICATE (oradb_standby)
      - {name: local_listener, value: '//dataguard-1:1521', scope: both, state: present}
      - {name: max_pdbs, value: '3', scope: both, state: present}
      - {name: control_management_pack_access, value: 'NONE', scope: both, state: present}
      # Data Guard Broker (dgmgrl.cfg from oradb_standby), not used by dbca
      # broker configuration files outside of ORACLE_HOME (Out-of-Place Patching): read-only ORACLE_HOME => ORACLE_BASE/dbs,
      # before dg_broker_start: the files cannot be changed while the broker is running
      - {name: dg_broker_config_file1, value: '/u01/app/oracle/dbs/dr1DB1_SITE1.dat', scope: both, state: present, dbca: false}
      - {name: dg_broker_config_file2, value: '/u01/app/oracle/dbs/dr2DB1_SITE1.dat', scope: both, state: present, dbca: false}
      - {name: dg_broker_start, value: 'TRUE', scope: both, state: present, dbca: false}
      - {name: standby_file_management, value: 'AUTO', scope: both, state: present}
      - {name: db_create_file_dest, value: '/u01/app/oracle/oradata', scope: both, state: present}
      - {name: db_recovery_file_dest, value: '/u01/app/oracle/fra', scope: both, state: present}
      - {name: db_create_online_log_dest_1, value: '/u01/app/oracle/oradata', scope: both, state: present}
      - {name: recyclebin, value: 'off', scope: spfile, state: present}
      - {name: pga_aggregate_target, value: '128M', scope: both, state: present}
      - {name: sga_target, value: '1808M', scope: spfile, state: present}
