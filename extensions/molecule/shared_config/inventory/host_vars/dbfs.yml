---
# Scenario dbfs: Oracle AI Database 26ai on filesystem as base for the module tests
#
# converge:    ORACLE_HOME 26ai, CDB DB1 with PDB ORCLPDB, wallet with ORCLPDB_SYSTEM
# side_effect: module tests (extensions/molecule/shared_config/module_tests)
#
#              AHF registered in AHF Fleet Insights of the scenario ahf
#              (extensions/molecule/dbfs/ahf.yml)
#
# The 19c patching tests are done in dbfs-ol9.
# Only one CDB with one PDB to keep the converge as short as possible.

db_homes_installed:
  - home: db26-si-ee
    state: present
    apply_patches: false

listener_installed:
  - home: db26-si-ee
    listener_name: LISTENER
    state: present

# alias for the wallet credential (items2dict in group_vars drops 'alias')
oracle_tnsnames_config:
  ORCLPDB:
    alias:
      - ORCLPDB_SYSTEM
    connect:
      service_name: ORCLPDB
    address:
      - host: "{{ ansible_hostname }}"

tnsnames_installed:
  - tnsname: "{{ oracle_pdbs[0]['pdb_name'] }}"
    home: db26-si-ee
    state: present

sqlnet_installed:
  - home: db26-si-ee
    sqlnet: sqlnetalias1
    state: present

# wallet from group_vars uses home db19-si-ee
oracle_wallet_config:
  - name: wallet1
    home: db26-si-ee
    path: /u01/app/oracle/wallet
    state: present
    dbcredentials:
      - tns_name: "{{ oracle_pdbs[0]['pdb_name'] }}_SYSTEM"
        db_name: "{{ oracle_pdbs[0]['pdb_name'] }}"
        db_user: system
        state: present

oracle_databases:
  - home: db26-si-ee
    oradb_facts_ignore_unreachable: true
    oracle_db_name: DB1
    oracle_db_type: SI
    storage_type: FS
    oracle_database_type: MULTIPURPOSE
    redolog_size: 50M
    redolog_groups: 3
    listener_name: LISTENER
    listener_port: 1521
    archivelog: false
    flashback: false
    force_logging: true
    state: present
    init_parameters:
      - {name: local_listener, value: '//localhost:1521', scope: both, state: present}
      - {name: max_pdbs, value: '3', scope: both, state: present}
      - {name: control_management_pack_access, value: 'NONE', scope: both, state: present}
      - {name: db_create_file_dest, value: '/u01/app/oracle/oradata', scope: both, state: present}
      - {name: db_recovery_file_dest, value: '/u01/app/oracle/fra', scope: both, state: present}
      - {name: db_create_online_log_dest_1, value: '/u01/app/oracle/oradata', scope: both, state: present}
      - {name: recyclebin, value: 'off', scope: spfile, state: present}
      - {name: pga_aggregate_target, value: '128M', scope: both, state: present}
      - {name: sga_target, value: '1808M', scope: spfile, state: present}

oracle_pdbs:
  - cdb: DB1
    home: db26-si-ee
    pdb_name: ORCLPDB
    pdbadmin_user: PDBROOT
    listener_port: 1521
    state: present
    datafile_dest: /u01/app/oracle/oradata
# AHF (role ahf), client of AHF Fleet Insights in the scenario ahf (group_vars/all/ahf.yml)
ahf_tfa_settings:
  autodiagcollect: "OFF"
ahf_compliance_autostart: true
ahf_compliance_settings:
  autostart_client:
    COLLECTION_RETENTION: 10
