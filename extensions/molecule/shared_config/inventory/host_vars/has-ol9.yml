---
# Oracle Restart (HA_CONFIG) with ASM inside a container
#
# ASM uses plain files in /u01/asmdisks as disks
# => device_persistence: '' => asm_diskgroups.disk.device is used as ASM disk
# => the files are created in converge.yml before the installation of GI

oracle_install_option_gi: HA_CONFIG
oracle_install_version_gi: 26.1.0.0
oracle_install_image_gi: gi_goldimage_26_04.zip
oracle_home_gi: /u01/app/oracle/product/26/restart_26.04

apply_patches_gi: false
patch_before_rootsh: false

# cluvfy does not work inside a container
gi_ignoreprereq: true

role_separation: false
default_gipass: Oracle_123

device_persistence: ''
partition_devices: false
oracle_asm_disk_string: /u01/asmdisks/*
oracle_asm_init_dg: data

asm_diskgroups:
  - diskgroup: data
    state: present
    properties:
      - {redundancy: external, ausize: 4}
    attributes:
      - {name: compatible.rdbms, value: 19.0.0.0.0}
      - {name: compatible.asm, value: 23.0.0.0.0}
    disk:
      - {device: /u01/asmdisks/data01, asmlabel: data01, size: 30G}
  - diskgroup: fra
    state: present
    properties:
      - {redundancy: external, ausize: 4}
    attributes:
      - {name: compatible.rdbms, value: 19.0.0.0.0}
      - {name: compatible.asm, value: 23.0.0.0.0}
    disk:
      - {device: /u01/asmdisks/fra01, asmlabel: fra01, size: 15G}

# Spare ASM disks without disk group for the module tests (oracle_asmdg),
# created in converge.yml like the disks of asm_diskgroups
molecule_asm_spare_disks:
  - {device: /u01/asmdisks/spare01, size: 2G}
  - {device: /u01/asmdisks/spare02, size: 2G}
  - {device: /u01/asmdisks/spare03, size: 2G}

# DB-Home must not be newer than GI
db_homes_config:
  db19-gi-ee:
    version: 19.3.0.0
    oracle_home: "/u01/app/oracle/product/19/db_19.33"
    edition: EE
    opatch_minversion: 12.2.0.1.52
    imagename: db_home_19.33.zip
    readonly_home: true
    oracle_home_name: db1933giee
    opatch: []
  # target ORACLE_HOME for Out-of-Place Patching (side_effect.yml)
  db19-2-gi-ee:
    version: 19.3.0.0
    oracle_home: "/u01/app/oracle/product/19/db_19.32"
    edition: EE
    opatch_minversion: 12.2.0.1.52
    imagename: db_home_19.32.zip
    readonly_home: true
    oracle_home_name: db1932giee
    opatch: []

# ORACLE_HOME of database DBHAS
# side_effect.yml switches the database to db19-2-gi-ee (Out-of-Place Patching)
oracle_dbhas_home: db19-gi-ee

db_homes_installed:
  - home: db19-gi-ee
    state: present
    apply_patches: false
  - home: db19-2-gi-ee
    state: present
    apply_patches: false

# Listener resources in Oracle Restart (srvctl), for the tests of the listener management:
# - LISTENER:          GI / Oracle Restart home (created in converge.yml)
# - LISTENER_RES_1522: additional listener in the Oracle Restart home (use_gi_home)
# - LISTENER_DB_1523:  additional listener in the ORACLE_HOME of the database (srvctl -oraclehome)
oracle_listeners_config:
  LISTENER:
    address:
      - host: "{{ ansible_hostname }}"
        protocol: TCP
        port: 1521
  LISTENER_RES_1522:
    address:
      - host: "{{ ansible_hostname }}"
        protocol: TCP
        port: 1522
  LISTENER_DB_1523:
    address:
      - host: "{{ ansible_hostname }}"
        protocol: TCP
        port: 1523

listener_installed:
  - listener_name: LISTENER
    use_gi_home: true
    state: present
  - listener_name: LISTENER_RES_1522
    use_gi_home: true
    state: present
  - listener_name: LISTENER_DB_1523
    home: "{{ oracle_dbhas_home }}"
    state: present

# tnsnames.ora, sqlnet.ora and wallet for the module tests (side_effect)
# group_vars/all references db19-si-ee
# alias for the wallet credential (items2dict in group_vars drops 'alias')
oracle_tnsnames_config:
  ORCLPDB1:
    alias:
      - ORCLPDB1_SYSTEM
    connect:
      service_name: ORCLPDB1
    address:
      - host: "{{ ansible_hostname }}"

tnsnames_installed:
  - tnsname: "{{ oracle_pdbs[0]['pdb_name'] }}"
    home: "{{ oracle_dbhas_home }}"
    state: present

sqlnet_installed:
  - home: "{{ oracle_dbhas_home }}"
    sqlnet: sqlnetalias1
    state: present

oracle_wallet_config:
  - name: wallet1
    home: "{{ oracle_dbhas_home }}"
    path: /u01/app/oracle/wallet
    state: present
    dbcredentials:
      - tns_name: "{{ oracle_pdbs[0]['pdb_name'] }}_SYSTEM"
        db_name: "{{ oracle_pdbs[0]['pdb_name'] }}"
        db_user: system
        state: present

oracle_databases:
  - home: "{{ oracle_dbhas_home }}"
    oracle_db_name: DBHAS
    oracle_db_type: SI
    storage_type: ASM
    oracle_database_type: MULTIPURPOSE
    redolog_size: 50M
    redolog_groups: 3
    listener_port: 1521
    archivelog: false
    flashback: false
    force_logging: false
    state: present
    init_parameters:
      - {name: local_listener, value: '//localhost:1521', scope: both, state: present}
      - {name: max_pdbs, value: '3', scope: both, state: present}
      - {name: control_management_pack_access, value: 'NONE', scope: both, state: present}
      - {name: db_create_file_dest, value: '+DATA', scope: both, state: present}
      - {name: db_recovery_file_dest_size, value: '10G', scope: both, state: present, dbca: false}
      - {name: db_recovery_file_dest, value: '+FRA', scope: both, state: present}
      - {name: recyclebin, value: 'off', scope: spfile, state: present}
      - {name: pga_aggregate_target, value: '128M', scope: both, state: present}
      - {name: sga_target, value: '1808M', scope: spfile, state: present}

oracle_pdbs:
  - cdb: DBHAS
    home: "{{ oracle_dbhas_home }}"
    pdb_name: ORCLPDB1
    listener_port: 1521
    state: present

# AHF (role ahf) with Oracle Restart, installation media from
# shared_config/playbooks/ahf_download.yml (AutoUpgrade)
ahf_tfa_settings:
  autodiagcollect: "OFF"
ahf_compliance_autostart: true
# upload complete TFA collections (with log files) into Fleet Insights
ahf_properties:
  ahf.fleet-insights.upload-only-minimal-files: "false"
# audit files of DBHAS, not discovered by TFA
ahf_tfa_directories:
  - path: /u01/app/oracle/admin/DBHAS/adump
    component: RDBMS
    database: dbhas
    instance: DBHAS
    collection: noexclusions
ahf_compliance_settings:
  autostart_client:
    COLLECTION_RETENTION: 10
