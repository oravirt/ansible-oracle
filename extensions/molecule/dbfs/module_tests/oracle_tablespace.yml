# error handling
- name: oracle_tablespace | datafile and numfiles (mutually exclusive)
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    datafile:
      - "{{ _ts_dir }}/moltest_ts01.dbf"
    numfiles: 1
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check datafile and numfiles
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.datafile_and_numfiles, mt_res: "{{ _res }}", mt_expect: failed}

- name: oracle_tablespace | autoextend without nextsize
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    size: 10M
    autoextend: true
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check autoextend without nextsize
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.autoextend_no_next, mt_res: "{{ _res }}", mt_expect: failed}

- name: oracle_tablespace | wrong password
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ _ts_name }}"
    state: absent
  vars:
    mt_conn: "{{ mt_conn_pdb_wrong_password }}"
  register: _res
  ignore_errors: true
- name: oracle_tablespace | check wrong password
  ansible.builtin.include_tasks: _check.yml
  vars: {mt_id: oracle_tablespace.pdb.wrong_password, mt_res: "{{ _res }}", mt_expect: failed}

# cleanup with the module
- name: oracle_tablespace | drop test tablespaces
  opitzconsulting.ansible_oracle.oracle_tablespace:
    tablespace: "{{ item }}"
    state: absent
  loop: "{{ _ts_all }}"
  register: _res_loop
  ignore_errors: true

- name: oracle_tablespace | verify cleanup
  ansible.builtin.include_tasks: _sql.yml
  vars:
    mt_sql_container: "{{ mt_pdb }}"
    mt_sql: >-
      select count(*) from dba_tablespaces
      where tablespace_name like 'MOLTEST\_TS%' escape '\';
    mt_sql_expect: "0"
    mt_sql_id: oracle_tablespace.pdb.cleanup_sql
