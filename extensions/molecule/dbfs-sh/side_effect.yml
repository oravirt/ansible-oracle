---
# Out-of-Place Patching
# Switch database DB2 from db19prev-si-ee (converge, RU-1) to db19curr-si-ee (current RU)
# Listener, sqlnet.ora and tnsnames.ora are switched to the same ORACLE_HOME.
- name: Switch ORACLE_HOME of DB2
  ansible.builtin.import_playbook: opitzconsulting.ansible_oracle.manage_db
  vars:
    oracle_db2_home: db19curr-si-ee

    listener_installed:
      - home: "{{ oracle_db2_home }}"
        listener_name: LISTENER
        state: present
      - home: "{{ oracle_db2_home }}"
        listener_name: LISTENER1522
        state: present

    tnsnames_installed:
      - tnsname: "{{ oracle_pdbs[0]['pdb_name'] }}"
        home: "{{ oracle_db2_home }}"
        state: present

    sqlnet_installed:
      - home: "{{ oracle_db2_home }}"
        sqlnet: sqlnetalias1
        state: present
