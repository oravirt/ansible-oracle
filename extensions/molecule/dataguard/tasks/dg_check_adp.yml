---
# RMAN ARCHIVELOG DELETION POLICY of a member (configured by oradb_standby on every member).
# v$rman_configuration contains only values, which are not the default (NONE).
# The value starts with 'TO ' (e.g. 'TO APPLIED ON ALL STANDBY') => removed for the comparison.
# Input: dg_adp_ci (connect identifier of the member)
#        expected value: archivelog_deletion_policy of db_standby_config (inventory)
- name: Archivelog deletion policy of {{ dg_adp_ci }}
  ansible.builtin.include_tasks: dg_sql.yml
  vars:
    dg_sql_ci: "{{ dg_adp_ci }}"
    dg_sql: >-
      select 'ADP=' || regexp_replace(value, '^TO +') from v$rman_configuration
      where name = 'ARCHIVELOG DELETION POLICY';

- name: Assert archivelog deletion policy of {{ dg_adp_ci }}
  ansible.builtin.assert:
    quiet: true
    that:
      - ('ADP=' ~ _dg_adp_expected) in dg_sql_result
    fail_msg: "{{ dg_adp_ci }}: expected {{ _dg_adp_expected }}, found {{ dg_sql_result }}"
  vars:
    _dg_adp_expected: "{{ db_standby_config[0].dg.archivelog_deletion_policy | upper }}"
