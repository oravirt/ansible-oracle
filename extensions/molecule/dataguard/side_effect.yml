---
# Data Guard tests of the scenario dataguard (after converge):
# 1. initial state: broker SUCCESS, DB1_SITE1 primary, DB1_SITE2 physical standby
# 2. switchover DB1_SITE1 => DB1_SITE2, check roles and temporary tablespaces of the new primary
# 3. switchover DB1_SITE2 => DB1_SITE1, check roles and temporary tablespaces
#
# dgmgrl and sqlplus connect with the connect identifiers of db_standby_config from dataguard-1,
# the SYS password is passed with stdin.
- name: Side-Effect - Data Guard switchover
  hosts: dataguard-1
  gather_facts: false
  any_errors_fatal: true
  become: true
  become_user: oracle
  vars:
    dg_db: "{{ oracle_databases[0] }}"
    dg_oracle_home: "{{ db_homes_config[dg_db.home].oracle_home }}"
    dg_sys_password: "{{ dbpasswords[dg_db.oracle_db_name]['sys'] | default(default_dbpass) }}"
    dg_env:
      ORACLE_HOME: "{{ dg_oracle_home }}"
      LD_LIBRARY_PATH: "{{ dg_oracle_home }}/lib"
    dg_site1: DB1_SITE1
    dg_site2: DB1_SITE2
  tasks:
    - name: Initial state
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: Switchover to {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_switchover.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: State after switchover to {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site2 }}"
        dg_standby: "{{ dg_site1 }}"

    - name: Temporary tablespaces of {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_check_temp.yml
      vars:
        dg_primary: "{{ dg_site2 }}"

    - name: Switchover back to {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_switchover.yml
      vars:
        dg_primary: "{{ dg_site2 }}"
        dg_standby: "{{ dg_site1 }}"

    - name: State after switchover back to {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: Temporary tablespaces of {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_check_temp.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
