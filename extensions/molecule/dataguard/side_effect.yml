---
# Data Guard tests of the scenario dataguard (after converge):
# 0. asserts of orasw_meta for db_standby_config and oracle_databases with standby_config
#    (modified inventory, no change on the hosts)
# 1. initial state: broker SUCCESS, DB1_SITE1 primary, DB1_SITE2 physical standby,
#    archivelog deletion policy on both members
# 2. switchover DB1_SITE1 => DB1_SITE2, check roles and temporary tablespaces of the new primary
# 3. switchover DB1_SITE2 => DB1_SITE1, check roles and temporary tablespaces
#
# dgmgrl and sqlplus connect with the connect identifiers of db_standby_config from dataguard-1,
# the SYS password is passed with stdin.
# The asserts must fail for an invalid inventory before any change on the hosts.
# Only the variables of the test case are changed, all other values come from the inventory.
- name: Side-Effect - Asserts for Data Guard
  hosts: dataguard-1
  gather_facts: true
  any_errors_fatal: true
  tasks:
    # copy of the inventory (set_fact evaluates once):
    # the test cases override oracle_databases / db_standby_config with values based on the copy
    - name: Assert | inventory of the scenario
      ansible.builtin.set_fact:
        _dg_dbs: "{{ oracle_databases }}"
        _dg_cfg: "{{ db_standby_config }}"

    # db_standby_config without dg.archivelog_deletion_policy of the configuration
    - name: Assert | db_standby_config without archivelog_deletion_policy
      ansible.builtin.set_fact:
        _dg_cfg_no_adp: >-
          {{ _dg_cfg | map('combine', {'dg': (_dg_cfg[0].dg | dict2items
                                              | rejectattr('key', 'equalto', 'archivelog_deletion_policy')
                                              | items2dict)}) | list }}

    - name: Assert | unchanged inventory
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: inventory
        dg_assert_expect: ok

    # ---------------------------------------------------------------- oracle_databases
    - name: Assert | archivelog missing
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: archivelog_missing
        dg_assert_expect: failed
        oracle_databases: >-
          {{ _dg_dbs | map('dict2items') | map('rejectattr', 'key', 'equalto', 'archivelog')
             | map('items2dict') | list }}

    - name: Assert | archivelog false
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: archivelog_false
        dg_assert_expect: failed
        oracle_databases: "{{ _dg_dbs | map('combine', {'archivelog': false}) | list }}"

    - name: Assert | force_logging false
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: force_logging_false
        dg_assert_expect: failed
        oracle_databases: "{{ _dg_dbs | map('combine', {'force_logging': false}) | list }}"

    - name: Assert | force_logging missing (set by oradb_standby)
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: force_logging_missing
        dg_assert_expect: ok
        oracle_databases: >-
          {{ _dg_dbs | map('dict2items') | map('rejectattr', 'key', 'equalto', 'force_logging')
             | map('items2dict') | list }}

    # ---------------------------------------------------------------- archivelog_deletion_policy
    - name: Assert | archivelog_deletion_policy missing
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: adp_missing
        dg_assert_expect: failed
        db_standby_config: "{{ _dg_cfg_no_adp }}"

    - name: Assert | archivelog_deletion_policy missing in 1 member
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: adp_missing_member
        dg_assert_expect: failed
        db_standby_config: >-
          {{ [_dg_cfg_no_adp[0] | combine({'members': [_dg_cfg[0].members[0]
                                                      | combine({'dg': {'archivelog_deletion_policy': 'NONE'}}, recursive=true)]
                                                     + _dg_cfg[0].members[1:]})] }}

    - name: Assert | archivelog_deletion_policy in all members
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: adp_members
        dg_assert_expect: ok
        db_standby_config: >-
          {{ [_dg_cfg_no_adp[0] | combine({'members': _dg_cfg[0].members
                                                     | map('combine', {'dg': {'archivelog_deletion_policy':
                                                       'applied on all standby backed up 1 times to device type disk'}},
                                                       recursive=true) | list})] }}

    - name: Assert | archivelog_deletion_policy invalid
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: adp_invalid
        dg_assert_expect: failed
        db_standby_config: >-
          {{ _dg_cfg | map('combine', {'dg': {'archivelog_deletion_policy': 'SHIPPED ON STANDBY'}}, recursive=true) | list }}

    - name: Assert | archivelog_deletion_policy BACKED UP before APPLIED
      ansible.builtin.include_tasks: tasks/dg_assert.yml
      vars:
        dg_assert_id: adp_wrong_order
        dg_assert_expect: failed
        db_standby_config: >-
          {{ _dg_cfg | map('combine', {'dg': {'archivelog_deletion_policy':
                                              'BACKED UP 1 TIMES TO DEVICE TYPE DISK APPLIED ON ALL STANDBY'}},
                           recursive=true) | list }}

    - name: Assert | results
      ansible.builtin.debug:
        var: dg_assert_results

    - name: Assert | all test cases as expected
      ansible.builtin.assert:
        quiet: true
        that:
          - _dg_assert_wrong | length == 0
        fail_msg: "Unexpected results: {{ _dg_assert_wrong }}"
      vars:
        # result differs from expect (error is always wrong)
        _dg_assert_wrong: >-
          {%- set __w = [] -%}
          {%- for r in dg_assert_results if r.result != r.expect -%}
          {%-   set _ = __w.append(r) -%}
          {%- endfor -%}
          {{ __w }}

- name: Side-Effect - Data Guard switchover
  hosts: dataguard-1
  gather_facts: false
  any_errors_fatal: true
  become: true
  become_user: oracle
  vars:
    dg_db: "{{ oracle_databases[0] }}"
    dg_oracle_home: "{{ db_homes_config[dg_db.home].oracle_home }}"
    dg_sys_password: "{{ dbpasswords[dg_db.oracle_db_name]['sys'] | default(default_dbpass) }}"
    dg_env:
      ORACLE_HOME: "{{ dg_oracle_home }}"
      LD_LIBRARY_PATH: "{{ dg_oracle_home }}/lib"
    dg_site1: DB1_SITE1
    dg_site2: DB1_SITE2
  tasks:
    - name: Initial state
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: Archivelog deletion policy of both members
      ansible.builtin.include_tasks: tasks/dg_check_adp.yml
      loop: ["{{ dg_site1 }}", "{{ dg_site2 }}"]
      loop_control:
        loop_var: dg_adp_ci

    - name: Switchover to {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_switchover.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: State after switchover to {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site2 }}"
        dg_standby: "{{ dg_site1 }}"

    - name: Temporary tablespaces of {{ dg_site2 }}
      ansible.builtin.include_tasks: tasks/dg_check_temp.yml
      vars:
        dg_primary: "{{ dg_site2 }}"

    - name: Switchover back to {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_switchover.yml
      vars:
        dg_primary: "{{ dg_site2 }}"
        dg_standby: "{{ dg_site1 }}"

    - name: State after switchover back to {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_check_roles.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
        dg_standby: "{{ dg_site2 }}"

    - name: Temporary tablespaces of {{ dg_site1 }}
      ansible.builtin.include_tasks: tasks/dg_check_temp.yml
      vars:
        dg_primary: "{{ dg_site1 }}"
