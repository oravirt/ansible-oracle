---
dependency:
  name: galaxy
  enabled: true

driver:
  name: docker
platforms:
  - name: dbfs-ol10
    image: "${MOLECULE_IMAGE:-quay.io/rendanic/docker-ol10-ansible:latest}"
    pre_build_image: true
    # The following 4 lines are needed only for making systemd work
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${MOLECULE_SW_DIR}:/vagrant:ro
    cgroupns_mode: host
    privileged: true

verifier:
  name: ansible

provisioner:
  name: ansible
  env:
    # needed for oracle_sw_source_local in host_vars/dbfs-ol10.yml
    MOLECULE_SW_DIR: ${MOLECULE_SW_DIR}
  inventory:
    links:
      group_vars: ../shared_config/inventory/group_vars/
      host_vars: ../shared_config/inventory/host_vars/
