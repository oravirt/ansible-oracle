---
# Inventory structure: doc/guides/standby_databases.adoc
- name: Assert standby configuration
  tags:
    - always
    - assert_ansible_oracle
  block:
    - name: Check switch for orasw_meta_assert_db_standby_config
      ansible.builtin.debug:
        msg: >-
          WARNING!!! Assert for db_standby_config has been disabled!
      when:
        - not orasw_meta_assert_db_standby_config | bool

    - name: Assert db_standby_config
      when:
        - orasw_meta_assert_db_standby_config | bool
        - db_standby_config is defined
      block:
        - name: Assert db_standby_config
          ansible.builtin.assert:
            quiet: true
            that:
              - ass_sc | type_debug == 'dict'
              - ass_sc.name is defined
              - >-
                db_standby_config | selectattr('name', 'defined')
                | selectattr('name', 'equalto', ass_sc.name) | list | length == 1
              - ass_sc.type is defined
              - ass_sc.type in ['dataguard', 'dbvisit']
              # only the sub-dictionary matching type is allowed
              - ass_sc.type == 'dataguard' or ass_sc.dg is not defined
              - ass_sc.type == 'dbvisit' or ass_sc.dbvisit is not defined
              - ass_sc.dg | default({}) | type_debug == 'dict'
              - ass_sc.dbvisit | default({}) | type_debug == 'dict'
              - ass_sc.members is defined
              - ass_sc.members | type_debug == 'list'
              - ass_sc.members | length > 0
              - ass_sc.members | map('type_debug') | reject('equalto', 'dict') | list | length == 0
              - >-
                ass_sc.type == 'dataguard'
                or ass_sc.members | selectattr('dg', 'defined') | list | length == 0
              - >-
                ass_sc.type == 'dbvisit'
                or ass_sc.members | selectattr('dbvisit', 'defined') | list | length == 0
              # hosts: non empty list of inventory_hostname
              - >-
                ass_sc.members | map(attribute='hosts', default='')
                | map('type_debug') | reject('equalto', 'list') | list | length == 0
              - >-
                ass_sc.members | map(attribute='hosts', default=[])
                | map('length') | select('equalto', 0) | list | length == 0
              - >-
                ass_sc.members | map(attribute='hosts', default=[]) | flatten
                | difference(groups['all']) | length == 0
              # initial_role
              - >-
                ass_sc.members | map(attribute='initial_role', default='')
                | reject('in', ['primary', 'physical_standby']) | list | length == 0
              - >-
                ass_sc.members | selectattr('initial_role', 'defined')
                | selectattr('initial_role', 'equalto', 'primary') | list | length == 1
              # a database on this host must reference the configuration
              - >-
                ass_sc.members | selectattr('hosts', 'defined')
                | selectattr('hosts', 'contains', inventory_hostname) | list | length == 0
                or oracle_databases | default([]) | selectattr('standby_config', 'defined')
                | selectattr('standby_config', 'equalto', ass_sc.name) | list | length > 0
          loop: "{{ db_standby_config }}"
          loop_control:
            label: "{{ ass_sc.name | default('') }}"
            loop_var: ass_sc
          register: assertdb_standby_config

      rescue:
        - name: Assert failed db_standby_config
          ansible.builtin.debug:
            msg: "{{ item.assertion }}"
          loop: "{{ assertdb_standby_config['results'] }}"
          loop_control:
            label: "{{ item['ass_sc']['name'] | default('') }}"
          when:
            - assertdb_standby_config.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: Fail assert db_standby_config
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"

    - name: Assert db_standby_config type dataguard
      when:
        - orasw_meta_assert_db_standby_config | bool
        - db_standby_config is defined
      block:
        - name: Assert db_standby_config type dataguard
          ansible.builtin.assert:
            quiet: true
            that:
              # db_unique_name is mandatory and unique
              - ass_scdg.members | rejectattr('db_unique_name', 'defined') | list | length == 0
              - >-
                ass_scdg.members | map(attribute='db_unique_name') | map('upper')
                | unique | list | length == ass_scdg.members | length
              - _protection_mode in ['MaxPerformance', 'MaxAvailability', 'MaxProtection']
              - >-
                _members_dg | map(attribute='log_xpt_mode', default='ASYNC')
                | reject('in', ['ASYNC', 'SYNC', 'FASTSYNC']) | list | length == 0
              - >-
                _members_dg | map(attribute='delay_mins', default=0) | map('string')
                | reject('match', '^[0-9]+$') | list | length == 0
              # MaxAvailability and MaxProtection need SYNC or FASTSYNC for a standby
              - >-
                _protection_mode == 'MaxPerformance'
                or ass_scdg.members | selectattr('initial_role', 'equalto', 'physical_standby')
                | map(attribute='dg', default={}) | map(attribute='log_xpt_mode', default='ASYNC')
                | select('in', ['SYNC', 'FASTSYNC']) | list | length > 0
              # connect_identifier is mandatory and defined in oracle_tnsnames_config
              - >-
                _members_dg | map(attribute='connect_identifier', default='')
                | reject('in', oracle_tnsnames_config | default({}) | list) | list | length == 0
              # creation of the standby database (oradb_standby)
              - _create_method in _create_methods
              - >-
                _members_dg | map(attribute='create_method', default=_create_method)
                | reject('in', _create_methods) | list | length == 0
              # custom needs a tasks file in the member or in the configuration
              - >-
                _members_dg | selectattr('create_method', 'undefined') | list | length == 0
                or _create_method != 'custom'
                or ass_scdg.dg.create_tasks_file is defined
              - >-
                _members_dg | selectattr('create_method', 'defined')
                | selectattr('create_method', 'equalto', 'custom')
                | selectattr('create_tasks_file', 'undefined') | list | length == 0
                or ass_scdg.dg.create_tasks_file is defined
          vars:
            _protection_mode: "{{ ass_scdg.dg.protection_mode | default('MaxPerformance') }}"
            _members_dg: "{{ ass_scdg.members | map(attribute='dg', default={}) | list }}"
            _create_method: "{{ ass_scdg.dg.create_method | default('rman_duplicate_active') }}"
            _create_methods: ['rman_duplicate_active', 'external', 'custom']
          loop: >-
            {{ db_standby_config | selectattr('type', 'defined')
               | selectattr('type', 'equalto', 'dataguard') | list }}
          loop_control:
            label: "{{ ass_scdg.name | default('') }}"
            loop_var: ass_scdg
          register: assertdb_standby_config_dg

      rescue:
        - name: Assert failed db_standby_config type dataguard
          ansible.builtin.debug:
            msg: "{{ item.assertion }}"
          loop: "{{ assertdb_standby_config_dg['results'] }}"
          loop_control:
            label: "{{ item['ass_scdg']['name'] | default('') }}"
          when:
            - assertdb_standby_config_dg.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: Fail assert db_standby_config type dataguard
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"

    # RMAN CONFIGURE ARCHIVELOG DELETION POLICY of each member (oradb_standby)
    # mandatory: archivelog_deletion_policy in dg of the configuration or of each member
    # valid: NONE or [APPLIED ON|SHIPPED TO] [ALL] STANDBY [BACKED UP <n> TIMES TO DEVICE TYPE DISK|SBT]...
    # (APPLIED/SHIPPED before BACKED UP, otherwise no archive log is eligible for deletion)
    - name: Assert archivelog_deletion_policy in db_standby_config
      ansible.builtin.assert:
        quiet: true
        that:
          - _adp_members | select('equalto', '') | list | length == 0
          - _adp_members | reject('match', _adp_regex) | list | length == 0
        fail_msg: >-
          {{ ass_scadp.name | default('') }}: archivelog_deletion_policy is mandatory
          in dg of the configuration or in dg of each member, see doc/guides/standby_databases.adoc.
          Valid values: NONE or [APPLIED ON|SHIPPED TO] [ALL] STANDBY [BACKED UP <n> TIMES TO DEVICE TYPE DISK|SBT],
          e.g. 'APPLIED ON ALL STANDBY BACKED UP 1 TIMES TO DEVICE TYPE DISK'.
          Current values of the members: {{ _adp_members }}
      vars:
        _adp: "{{ ass_scadp.dg.archivelog_deletion_policy | default('') }}"
        # value of each member, upper case, single blanks
        _adp_members: >-
          {{ ass_scadp.members | default([]) | map(attribute='dg', default={})
             | map(attribute='archivelog_deletion_policy', default=_adp)
             | map('string') | map('upper') | map('regex_replace', '\\s+', ' ') | map('trim') | list }}
        _adp_regex: >-
          ^(NONE|((APPLIED ON|SHIPPED TO) (ALL )?STANDBY)?( ?BACKED UP [0-9]+ TIMES TO DEVICE TYPE (DISK|SBT|SBT_TAPE))*)$
      loop: >-
        {{ db_standby_config | default([]) | selectattr('type', 'defined')
           | selectattr('type', 'equalto', 'dataguard') | list }}
      loop_control:
        label: "{{ ass_scadp.name | default('') }}"
        loop_var: ass_scadp
      when:
        - orasw_meta_assert_db_standby_config | bool
        - db_standby_config is defined

    - name: Assert standby_config in oracle_databases
      when:
        - orasw_meta_assert_db_standby_config | bool
        - oracle_databases is defined
      block:
        - name: Assert standby_config in oracle_databases
          ansible.builtin.assert:
            quiet: true
            that:
              # technology specific attributes are defined in the member
              - ass_sdb.dg is not defined
              - ass_sdb.dbvisit is not defined
              - _sc | length > 0
              # exactly 1 member: by host, by db_unique_name when ambiguous
              - _member | length == 1
              - _sc.type != 'dataguard' or ass_sdb.oracle_db_unique_name is defined
              # static listener entry <db_unique_name>_DGMGRL for RMAN DUPLICATE and broker
              - _sc.type != 'dataguard' or ass_sdb.listener_name is defined
              # ARCHIVELOG mode is mandatory for redo transport and RMAN DUPLICATE
              - _sc.type != 'dataguard' or ass_sdb.archivelog | default(false) | bool
              # FORCE LOGGING is set by oradb_standby (primary_prepare.yml),
              # force_logging: false would disable it again in oradb_manage_db
              - _sc.type != 'dataguard' or ass_sdb.force_logging | default(true) | bool
              - >-
                _member | length != 1
                or (ass_sdb.oracle_db_unique_name | default(ass_sdb.oracle_db_name) | upper)
                   == (_member[0].db_unique_name | default(ass_sdb.oracle_db_name) | upper)
          vars:
            _sc: >-
              {{ db_standby_config | default([]) | selectattr('name', 'defined')
                 | selectattr('name', 'equalto', ass_sdb.standby_config) | first | default({}) }}
            _candidates: >-
              {{ _sc.members | default([]) | selectattr('hosts', 'defined')
                 | selectattr('hosts', 'contains', inventory_hostname) | list }}
            _member: >-
              {{ _candidates if _candidates | length <= 1
                 else _candidates | selectattr('db_unique_name', 'defined')
                      | selectattr('db_unique_name', 'equalto', ass_sdb.oracle_db_unique_name | default(''))
                      | list }}
          loop: "{{ oracle_databases | selectattr('standby_config', 'defined') | list }}"
          loop_control:
            label: "{{ ass_sdb.oracle_db_name | default('') }}"
            loop_var: ass_sdb
          register: assertoracle_databases_standby

      rescue:
        - name: Assert failed standby_config in oracle_databases
          ansible.builtin.debug:
            msg: "{{ item.assertion }}"
          loop: "{{ assertoracle_databases_standby['results'] }}"
          loop_control:
            label: "{{ item['ass_sdb']['oracle_db_name'] | default('') }}"
          when:
            - assertoracle_databases_standby.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: Fail assert standby_config in oracle_databases
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"

    # Data Guard requirements in init_parameters of oracle_databases (standby_config type dataguard):
    # - dg_broker_start: TRUE (Data Guard Broker, dgmgrl.cfg of oradb_standby)
    # - standby_file_management: defined, the value is not checked (AUTO or MANUAL)
    # - dg_broker_config_file1/2: defined, different, not below ORACLE_HOME (Out-of-Place Patching)
    # - dg_broker_start below dg_broker_config_file1/2: oradb_manage_parameters changes the parameters
    #   in the order of init_parameters, the files cannot be changed while the broker is running
    # Checked here (start of every play), before oradb_manage_parameters changes the parameters.
    - name: Assert init_parameters for Data Guard
      when:
        - orasw_meta_assert_db_standby_config | bool
        - oracle_databases is defined
      block:
        - name: Assert init_parameters for Data Guard
          ansible.builtin.assert:
            quiet: true
            that:
              - >-
                _orasw_meta_sb_init_params | selectattr('name', 'equalto', 'dg_broker_start')
                | map(attribute='value', default='') | map('string') | map('upper')
                | select('equalto', 'TRUE') | list | length > 0
              - >-
                _orasw_meta_sb_init_params | selectattr('name', 'equalto', 'standby_file_management')
                | list | length > 0
              - _orasw_meta_sb_broker_files | length == 2
              - _orasw_meta_sb_broker_files | unique | length == 2
              - >-
                _orasw_meta_sb_broker_files | select('match', '^' ~ (_oracle_home_db | regex_escape) ~ '/')
                | list | length == 0
              - _orasw_meta_sb_broker_order | bool
            fail_msg: >-
              {{ odb.oracle_db_name }} (standby_config {{ odb.standby_config }}):
              init_parameters needs dg_broker_start=TRUE, standby_file_management
              and dg_broker_config_file1/2 (different, not below ORACLE_HOME {{ _oracle_home_db }})
              (state present, sid '*'), e.g.
              - {name: dg_broker_config_file1, value: '<ORACLE_BASE>/dbs/dr1<db_unique_name>.dat', scope: both, state: present, dbca: false}
              - {name: dg_broker_config_file2, value: '<ORACLE_BASE>/dbs/dr2<db_unique_name>.dat', scope: both, state: present, dbca: false}
              (read-only ORACLE_HOME: ORACLE_BASE/dbs, read-write ORACLE_HOME: ORACLE_BASE/admin/<db_unique_name>/dgbroker)
              - {name: dg_broker_start, value: 'TRUE', scope: both, state: present, dbca: false}
              - {name: standby_file_management, value: 'AUTO', scope: both, state: present}
              dg_broker_start must be defined below dg_broker_config_file1/2.
              Current values: {{ _orasw_meta_sb_broker_files }}
          vars:
            # init_parameters with state present (default) and sid '*' (default)
            _orasw_meta_sb_init_params: >-
              {%- set __p = [] -%}
              {%- for ip in odb.init_parameters | default([])
                    if ip.name is defined
                       and ip.state | default('present') == 'present'
                       and ip.sid | default('*') == '*' -%}
              {%-   set _ = __p.append(ip) -%}
              {%- endfor -%}
              {{ __p }}
            # dg_broker_start below dg_broker_config_file1/2 in init_parameters
            _orasw_meta_sb_broker_order: >-
              {%- set __ns = namespace(start=-1, files=[-1]) -%}
              {%- for ip in _orasw_meta_sb_init_params -%}
              {%-   if ip.name | lower == 'dg_broker_start' -%}
              {%-     set __ns.start = loop.index0 -%}
              {%-   elif ip.name | lower in ['dg_broker_config_file1', 'dg_broker_config_file2'] -%}
              {%-     set __ns.files = __ns.files + [loop.index0] -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ __ns.start > __ns.files | max }}
            _orasw_meta_sb_broker_files: >-
              {{ _orasw_meta_sb_init_params
                 | selectattr('name', 'in', ['dg_broker_config_file1', 'dg_broker_config_file2'])
                 | map(attribute='value', default='') | map('string') | map('trim') | select | list }}
          loop: >-
            {{ oracle_databases | selectattr('standby_config', 'defined')
               | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list }}
          loop_control:
            label: "{{ odb.oracle_db_name | default('') }}"
            loop_var: odb
          when:
            - _odb_standby_config.type | default('') == 'dataguard'
          register: assertoracle_databases_dg_params

      rescue:
        - name: Assert failed init_parameters for Data Guard
          ansible.builtin.debug:
            msg: "{{ item.msg | default(item.assertion | default('')) }}"
          loop: "{{ assertoracle_databases_dg_params['results'] }}"
          loop_control:
            label: "{{ item['odb']['oracle_db_name'] | default('') }}"
          when:
            - assertoracle_databases_dg_params.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: Fail assert init_parameters for Data Guard
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"
