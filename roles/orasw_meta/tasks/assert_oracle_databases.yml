---
# @tag assert_ansible_oracle:description: Assert inventory variables from ansible-oracle
- name: assert ansible-oracle variables
  tags:
    - always
    - assert_ansible_oracle
  block:
    - name: assert db_homes_config
      block:
        - name: assert db_homes_config
          ansible.builtin.assert:
            quiet: true
            that:
              - dbc.value['oracle_home'] is defined
              - dbc.value['version'] is defined
              - dbc.value['version'] in [
                  '26.1.0.0',
                  '19.3.0.0'
                  ]
              - dbc.value['edition'] is defined
              - dbc.value['edition'] in ['EE', 'SE', 'SE2']
              - dbc.value['opatch'] is not defined
                or (dbc.value['opatch'] is defined
                    and dbc.value['opatch_minversion'] is defined
                  )
              - dbc.value['opatchauto'] is not defined
                or (dbc.value['opatchauto'] is defined
                    and dbc.value['opatch_minversion'] is defined
                  )
          with_dict:
            - "{{ db_homes_config }}"
          loop_control:
            label: "{{ dbc.key | default('') }}"
            loop_var: dbc
          when:
            - assert_db_homes_config | bool
            - db_homes_config is defined
          register: assertdb_homes_config

      rescue:

        - name: assert failed assertdb_homes_config
          ansible.builtin.debug:
            msg: "{{ item.assertion }}"
          with_items:
            - "{{ assertdb_homes_config['results'] }}"
          loop_control:
            label: "{{ item['dbc']['key'] | default('') }}"
          when:
            - assertdb_homes_config.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: fail assertdb_homes_config
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"

    - name: assert db_homes_installed
      when:
        - db_homes_installed is defined
      block:
        - name: assert db_homes_installed home definition
          ansible.builtin.assert:
            quiet: true
            that:
              - ass_dbh.home is defined
              - db_homes_config[ass_dbh.home] is defined
          with_items:
            - "{{ db_homes_installed }}"
          loop_control:
            label: "{{ ass_dbh.home | default('') }}"
            loop_var: ass_dbh

        - name: assert db_homes_installed home type
          ansible.builtin.assert:
            quiet: true
            fail_msg: "oracle_db_type must be unique over databases of the same home"
            that: >-
              (oracle_databases
                | selectattr('home','equalto',ass_dbh.home)
                | selectattr('state','equalto','present')
                | map(attribute='oracle_db_type',default='SI')
                | unique | length) <= 1
          loop: "{{ db_homes_installed }}"
          loop_control:
            label: "{{ ass_dbh.home | default('') }}"
            loop_var: ass_dbh
          when: oracle_databases is defined

    - name: Check switch for  orasw_meta_assert_oracle_databases
      ansible.builtin.debug:
        msg: >-
          WARNING!!! Assert for oracle_databases has been disabled!
      when:
        - not orasw_meta_assert_oracle_databases | bool

    - name: assert oracle_databases
      when:
        - orasw_meta_assert_oracle_databases | bool
      block:
        - name: assert oracle_databases
          ansible.builtin.assert:
            quiet: true
            that:
              - ass_odb.oracle_db_name is defined
              - ass_odb.home is defined
              - ass_odb.state is defined
              - ass_odb.state in ['absent', 'present']
              - db_homes_config[ass_odb.home] is defined
              - db_homes_config[ass_odb.home]['version'] is version('21.3.0.0', '<')
                or (db_homes_config[ass_odb.home]['version'] is version('21.3.0.0', '>=')
                    and ass_odb.is_container | default(true) | bool
                  )
              - ass_odb.init_parameters | default([]) | type_debug == 'list'
              # dbca has no SID clause => init_parameters for one instance only after dbca
              - >-
                ass_odb.init_parameters | default([])
                | selectattr('sid', 'defined') | rejectattr('sid', 'equalto', '*')
                | selectattr('dbca', 'defined') | map(attribute='dbca') | map('bool')
                | select | list | length == 0
              - ass_odb.profiles | default([]) | type_debug == 'list'
              - ass_odb.rman_jobs | default([]) | type_debug == 'list'
              - ass_odb.services | default([]) | type_debug == 'list'
              - ass_odb.statspack | default({}) | type_debug == 'dict'
              - ass_odb.tablespaces | default([]) | type_debug == 'list'
              - ass_odb.users | default([]) | type_debug == 'list'
              - ass_odb.oracle_db_type | default('SI') in ('SI', 'RAC', 'RACONENODE')
              - ass_odb.storage_type | default('FS') in ('FS', 'ASM')
              - >-
                (ass_odb.oracle_db_mem_totalmb is defined
                  and ass_odb.init_parameters | default([])
                      | selectattr ('name', 'equalto', 'sga_target') | list | length == 0
                )
                or
                (ass_odb.oracle_db_mem_totalmb is not defined
                  and ass_odb.init_parameters | default([]) | list
                       | selectattr ('name', 'equalto', 'sga_target') | list | length > 0
                )
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

        # datafile_dest and recoveryfile_dest are removed
        # => replaced by db_create_file_dest and db_recovery_file_dest in init_parameters
        - name: assert removed datafile_dest and recoveryfile_dest in oracle_databases
          ansible.builtin.assert:
            quiet: true
            fail_msg: >-
              {{ ass_odb.oracle_db_name | default('') }}:
              datafile_dest and recoveryfile_dest in oracle_databases are removed.
              Use db_create_file_dest and db_recovery_file_dest in init_parameters instead.
              See doc/guides/breaking_changes.adoc.
            that:
              - ass_odb.datafile_dest is not defined
              - ass_odb.recoveryfile_dest is not defined
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

        # ASM without OMF makes no sense in practice
        - name: assert omf with storage_type ASM in oracle_databases
          ansible.builtin.assert:
            quiet: true
            fail_msg: >-
              {{ ass_odb.oracle_db_name | default('') }}:
              omf: false is not allowed with storage_type: ASM.
              See doc/guides/breaking_changes.adoc.
            that:
              - >-
                ass_odb.omf | default(true) | bool
                or ass_odb.storage_type | default('FS') | upper != 'ASM'
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

        # omf: true (default) needs db_create_file_dest and db_recovery_file_dest
        # in init_parameters (needed e.g. for standby databases and Out-of-Place Patching).
        - name: assert db_create_file_dest and db_recovery_file_dest in init_parameters of oracle_databases
          ansible.builtin.assert:
            quiet: true
            fail_msg: >-
              {{ ass_odb.oracle_db_name | default('') }}:
              omf: true (default) needs db_create_file_dest and db_recovery_file_dest in init_parameters,
              e.g. {name: db_create_file_dest, value: '/u02/oradata', scope: both, state: present}
              and {name: db_recovery_file_dest, value: '/u02/fra', scope: both, state: present}.
              See doc/guides/breaking_changes.adoc.
            that:
              - >-
                ass_odb.state | default('present') == 'absent'
                or not ass_odb.omf | default(true) | bool
                or (_ass_create_file_dest | length > 0
                    and _ass_recovery_file_dest | length > 0)
          vars:
            _ass_create_file_dest: >-
              {%- set ns = namespace(v='') -%}
              {%- for p in ass_odb.init_parameters | default([]) -%}
              {%-   if ns.v == '' and p.name | default('') | lower == 'db_create_file_dest'
                      and p.state | default('present') != 'absent' and p.sid | default('*') == '*' -%}
              {%-     set ns.v = p.value | default('') | string -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ ns.v }}
            _ass_recovery_file_dest: >-
              {%- set ns = namespace(v='') -%}
              {%- for p in ass_odb.init_parameters | default([]) -%}
              {%-   if ns.v == '' and p.name | default('') | lower == 'db_recovery_file_dest'
                      and p.state | default('present') != 'absent' and p.sid | default('*') == '*' -%}
              {%-     set ns.v = p.value | default('') | string -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ ns.v }}
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

        # max_pdbs documents the number of PDBs allowed by the license.
        # SE/SE2: max. 3 PDBs
        # EE: max. 1024 PDBs - only with a license for the Multitenant Option,
        #     max. 3 PDBs without. ansible-oracle has no switch for licensed
        #     options yet => the assert allows up to 1024 for EE.
        - name: assert max_pdbs in init_parameters of oracle_databases
          ansible.builtin.assert:
            quiet: true
            fail_msg: >-
              {{ ass_odb.oracle_db_name | default('') }}:
              is_container: true (default) needs max_pdbs in init_parameters
              with an integer value <= {{ _ass_max_pdbs_limit }}
              for edition {{ _ass_edition }}
              (current value: '{{ _ass_max_pdbs }}'),
              e.g. {name: max_pdbs, value: '3', scope: both, state: present}.
              Important: EE allows more than 3 PDBs only with a license
              for the Multitenant Option.
              See doc/guides/breaking_changes.adoc.
            that:
              - >-
                ass_odb.state | default('present') == 'absent'
                or not ass_odb.is_container | default(true) | bool
                or (_ass_max_pdbs is match('^[0-9]+$')
                    and _ass_max_pdbs | int <= _ass_max_pdbs_limit | int)
          vars:
            _ass_edition: >-
              {{ db_homes_config[ass_odb.home]['edition'] | default('EE') | upper }}
            _ass_max_pdbs_limit: "{{ 1024 if _ass_edition == 'EE' else 3 }}"
            _ass_max_pdbs: >-
              {%- set ns = namespace(v='') -%}
              {%- for p in ass_odb.init_parameters | default([]) -%}
              {%-   if ns.v == '' and p.name | default('') | lower == 'max_pdbs'
                      and p.state | default('present') != 'absent' and p.sid | default('*') == '*' -%}
              {%-     set ns.v = p.value | default('') | string | trim -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ ns.v }}
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

        # The local_listener from DBCA is an alias in tnsnames.ora of the ORACLE_HOME.
        # The alias is missing in a new ORACLE_HOME (Out-of-Place Patching)
        # => the instance does not register at the listener.
        # RAC/RAC One Node: Clusterware sets local_listener.
        - name: assert local_listener in init_parameters of oracle_databases
          ansible.builtin.assert:
            quiet: true
            fail_msg: >-
              local_listener is missing in init_parameters of {{ ass_odb.oracle_db_name | default('') }},
              e.g. {name: local_listener, value: '//localhost:1521', scope: both, state: present}.
              See doc/guides/breaking_changes.adoc.
            that:
              - >-
                ass_odb.state | default('present') == 'absent'
                or ass_odb.oracle_db_type | default('SI') != 'SI'
                or (ass_odb.init_parameters | default([])
                    | selectattr('name', 'defined')
                    | selectattr('name', 'match', '(?i)^local_listener$')
                    | map(attribute='state', default='present')
                    | reject('equalto', 'absent')
                    | list | length > 0)
          with_items:
            - "{{ oracle_databases }}"
          loop_control:
            label: "{{ ass_odb.oracle_db_name | default('') }}"
            loop_var: ass_odb
          when:
            - oracle_databases is defined
          register: assertoracle_databases

      rescue:

        - name: assert failed assert oracle_databases
          ansible.builtin.debug:
            msg: "{{ item.msg | default('') }} {{ item.assertion | default('') }}"
          with_items:
            - "{{ assertoracle_databases['results'] }}"
          loop_control:
            label: "{{ item['ass_odb']['oracle_db_name'] | default('') }}"
          when:
            - assertoracle_databases.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: fail assert oracle_databases
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"

    - name: assert oracle_pdbs
      block:
        - name: assert oracle_pdbs
          ansible.builtin.assert:
            quiet: true
            that:
              - ass_pdb.cdb is defined
              - ass_pdb.pdb_name is defined
              - ass_pdb.state is defined
              - ass_pdb.state in ['absent', 'present']
              - ass_pdb.home is defined
              - db_homes_config[ass_pdb.home] is defined
              - oracle_databases | selectattr('oracle_db_name', 'match', ass_pdb.cdb)
                  | list | length == 1
          with_items:
            - "{{ oracle_pdbs }}"
          loop_control:
            label: "cdb {{ ass_pdb.cdb | default('') }} \
                    pdb {{ ass_pdb.pdb_name | default('') }}"
            loop_var: ass_pdb
          when:
            - oracle_pdbs is defined
          register: assertoracle_pdbs

      rescue:

        - name: assert failed assert oracle_pdbs
          ansible.builtin.debug:
            msg: "{{ item.assertion }}"
          with_items:
            - "{{ assertoracle_pdbs['results'] }}"
          loop_control:
            label: "{{ item['ass_pdb']['key'] | default('') }}"
          when:
            - assertoracle_pdbs.results is defined
            - item.failed is defined
            - item.failed | bool

        - name: fail assert oracle_pdbs
          ansible.builtin.fail:
            msg: "See previous debug task for assertation failure"
