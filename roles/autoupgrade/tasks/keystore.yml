---
# The keystore is managed with the interactive console from `-load_password`.
# ansible.builtin.expect is used for the console (requires pexpect).
# The prompts must be literal keys in responses - keys are not templated by Ansible!
#
# 1. keystore exists: check credentials with 'list' (online check against MOS)
# 2. credentials missing/invalid: 'add' credentials with keystore password
# 3. keystore password invalid (e.g. changed mos_password), keystore missing or
#    fingerprint changed (mos_username): remove and create keystore
#
# 'list' checks the login only => a fingerprint of mos_username is stored
# in the keystore directory to detect a changed mos_username.
- name: autoupgrade | Keystore
  become: "{{ _autoupgrade_become }}"
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _autoupgrade_delegate_to }}"
  run_once: "{{ _autoupgrade_run_local | bool }}"
  vars:
    _autoupgrade_load_password_cmd: >-
      {{ _autoupgrade_java }} -jar {{ _autoupgrade_jar_path }}
      -config {{ _autoupgrade_keystore_cfg }} -patch -load_password
    # commands for the console
    _autoupgrade_keystore_cmds:
      - "add -user {{ mos_username }}"
      - exit
    _autoupgrade_keystore_fingerprint_file: "{{ autoupgrade_keystore }}/.ansible_oracle_fingerprint"
    _autoupgrade_keystore_fingerprint: >-
      {{ (mos_username ~ '|') | hash('sha256') }}
    _autoupgrade_keystore_recreate: >-
      {{ autoupgrade_keystore_recreate | bool
         or (_autoupgrade_keystore_stat.stat.exists | default(false)
             and (_autoupgrade_keystore_fingerprint_res.content | default('') | b64decode | trim)
                 != _autoupgrade_keystore_fingerprint) }}
  block:
    - name: autoupgrade | Assert keystore variables
      ansible.builtin.assert:
        quiet: true
        that:
          - mos_username is defined
          - mos_username | length > 0
          - mos_password is defined
          - mos_password | length > 0
          - _autoupgrade_keystore_password | length >= 16
        fail_msg: >-
          mos_username and mos_password are mandatory.
          The keystore password needs at least 16 characters (autoupgrade_keystore_password).

    - name: autoupgrade | Create directories for keystore
      ansible.builtin.file:
        path: "{{ aud }}"
        mode: "0755"
        state: directory
      loop:
        - "{{ _autoupgrade_cfg_dir }}"
        - "{{ autoupgrade_log_dir }}"
      loop_control:
        loop_var: aud

    - name: autoupgrade | Create config file for keystore
      ansible.builtin.template:
        src: keystore.cfg.j2
        dest: "{{ _autoupgrade_keystore_cfg }}"
        mode: "0644"

    - name: autoupgrade | Check keystore
      ansible.builtin.stat:
        path: "{{ autoupgrade_keystore }}/cwallet.sso"
      register: _autoupgrade_keystore_stat

    - name: autoupgrade | Read keystore fingerprint
      ansible.builtin.slurp:
        src: "{{ _autoupgrade_keystore_fingerprint_file }}"
      register: _autoupgrade_keystore_fingerprint_res
      failed_when: false
      when:
        - _autoupgrade_keystore_stat.stat.exists

    - name: autoupgrade | Check credentials in keystore
      ansible.builtin.expect:
        command: "{{ _autoupgrade_load_password_cmd }}"
        responses:
          "MOS> ":
            - list
            - exit
        timeout: "{{ autoupgrade_keystore_timeout }}"
      environment: "{{ proxy_env }}"
      register: _autoupgrade_keystore_check
      changed_when: false
      failed_when: false
      when:
        - _autoupgrade_keystore_stat.stat.exists
        - not _autoupgrade_keystore_recreate | bool

    - name: autoupgrade | Add credentials to keystore
      ansible.builtin.expect:
        command: "{{ _autoupgrade_load_password_cmd }}"
        responses:
          "MOS> ": "{{ _autoupgrade_keystore_cmds }}"
          "Enter wallet password:": "{{ _autoupgrade_keystore_password }}"
          "secret/Password:": "{{ mos_password }}"
          "\\[YES\\|NO\\] \\?": "YES"
          "\\[YES\\|NO\\|SHARED\\]:": "YES"
        timeout: "{{ autoupgrade_keystore_timeout }}"
      environment: "{{ proxy_env }}"
      register: _autoupgrade_keystore_add
      changed_when:
        - _autoupgrade_keystore_add.rc | default(1) == 0
        - "'password was invalid' not in _autoupgrade_keystore_add.stdout | default('')"
      failed_when: false
      no_log: "{{ autoupgrade_keystore_no_log | bool }}"
      when:
        - _autoupgrade_keystore_check is not skipped
        - _autoupgrade_keystore_check.stdout | default('') is not search(_autoupgrade_keystore_loaded_regex)
          or _autoupgrade_keystore_check.stdout | default('') is search(_autoupgrade_keystore_failed_regex)

    - name: autoupgrade | Remove keystore
      ansible.builtin.file:
        path: "{{ autoupgrade_keystore }}"
        state: absent
      register: _autoupgrade_keystore_remove
      when:
        - not _autoupgrade_keystore_stat.stat.exists
          or _autoupgrade_keystore_recreate | bool
          or (_autoupgrade_keystore_add is not skipped
              and (_autoupgrade_keystore_add.rc | default(1) != 0
                   or 'password was invalid' in _autoupgrade_keystore_add.stdout | default('')))

    - name: autoupgrade | Create keystore
      ansible.builtin.expect:
        command: "{{ _autoupgrade_load_password_cmd }}"
        responses:
          "Enter password( again)?:": "{{ _autoupgrade_keystore_password }}"
          "MOS> ": "{{ _autoupgrade_keystore_cmds }}"
          "Enter wallet password:": "{{ _autoupgrade_keystore_password }}"
          "secret/Password:": "{{ mos_password }}"
          "\\[YES\\|NO\\] \\?": "YES"
          "\\[YES\\|NO\\|SHARED\\]:": "YES"
        timeout: "{{ autoupgrade_keystore_timeout }}"
        creates: "{{ autoupgrade_keystore }}/cwallet.sso"
      environment: "{{ proxy_env }}"
      register: _autoupgrade_keystore_create
      no_log: "{{ autoupgrade_keystore_no_log | bool }}"

    - name: autoupgrade | Write keystore fingerprint
      ansible.builtin.copy:
        content: "{{ _autoupgrade_keystore_fingerprint }}\n"
        dest: "{{ _autoupgrade_keystore_fingerprint_file }}"
        mode: "0600"
      when:
        - _autoupgrade_keystore_add is changed or _autoupgrade_keystore_create is changed

    - name: autoupgrade | Verify credentials in keystore
      ansible.builtin.expect:
        command: "{{ _autoupgrade_load_password_cmd }}"
        responses:
          "MOS> ":
            - list
            - exit
        timeout: "{{ autoupgrade_keystore_timeout }}"
      environment: "{{ proxy_env }}"
      register: _autoupgrade_keystore_verify
      changed_when: false
      failed_when: false
      when:
        - _autoupgrade_keystore_add is changed or _autoupgrade_keystore_create is changed

    - name: autoupgrade | Show keystore status
      ansible.builtin.debug:
        msg: >-
          {{ (_autoupgrade_keystore_verify.stdout_lines | default(_autoupgrade_keystore_check.stdout_lines | default([])))
             | select('search', 'My Oracle Support|Oracle Update Advisor|Connection Failed') | list }}

    - name: autoupgrade | Assert credentials in keystore
      ansible.builtin.assert:
        quiet: true
        that:
          - _autoupgrade_keystore_list is search(_autoupgrade_keystore_loaded_regex)
          - _autoupgrade_keystore_list is not search(_autoupgrade_keystore_failed_regex)
        fail_msg: >-
          My Oracle Support credentials in keystore {{ autoupgrade_keystore }} are not valid.
          Check mos_username / mos_password.
      vars:
        _autoupgrade_keystore_list: >-
          {{ _autoupgrade_keystore_verify.stdout | default(_autoupgrade_keystore_check.stdout | default('')) }}
      when:
        - autoupgrade_keystore_fail_on_invalid_credentials | bool
