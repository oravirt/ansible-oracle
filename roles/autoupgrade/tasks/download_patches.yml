---
- name: autoupgrade | Install AutoUpgrade
  ansible.builtin.include_tasks: install.yml

# before the keystore: a wrong proxy leads to misleading errors of the keystore console
- name: autoupgrade | Check connection to Oracle
  ansible.builtin.include_tasks: proxy_check.yml
  when:
    - autoupgrade_proxy_check | bool

- name: autoupgrade | Manage keystore
  ansible.builtin.include_tasks: keystore.yml
  when:
    - autoupgrade_keystore_manage | bool

- name: autoupgrade | Download patches
  become: "{{ _autoupgrade_become }}"
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _autoupgrade_delegate_to }}"
  run_once: "{{ _autoupgrade_run_local | bool }}"
  vars:
    _autoupgrade_download_cfg: "{{ _autoupgrade_cfg_dir }}/download_patches.cfg"
  block:
    - name: autoupgrade | Assert patch list for download
      ansible.builtin.assert:
        quiet: true
        that:
          - _autoupgrade_download_list | length > 0
        fail_msg: >-
          Nothing to download. Set autoupgrade_download_patches or
          oracle_sw_patches / db_homes_installed (autoupgrade_download_use_oracle_sw_patches).

    - name: autoupgrade | Show patch list for download
      ansible.builtin.debug:
        var: _autoupgrade_download_list

    - name: autoupgrade | Warn about ignored patches from oracle_sw_patches
      ansible.builtin.debug:
        msg: >-
          Ignored from oracle_sw_patches (no database patch for {{ autoupgrade_download_platform }}
          or release not in {{ autoupgrade_download_supported_releases }}):
          {{ _autoupgrade_download_skipped | map(attribute='filename') | list }}
      when:
        - autoupgrade_download_use_oracle_sw_patches | bool
        - _autoupgrade_download_skipped | length > 0

    - name: autoupgrade | Create download directory
      ansible.builtin.file:
        path: "{{ autoupgrade_download_dir }}"
        mode: "0755"
        state: directory

    - name: autoupgrade | Create config file
      ansible.builtin.template:
        src: download_patches.cfg.j2
        dest: "{{ _autoupgrade_download_cfg }}"
        mode: "0644"

    - name: autoupgrade | Check keystore
      ansible.builtin.stat:
        path: "{{ autoupgrade_keystore }}/cwallet.sso"
      register: _autoupgrade_keystore_stat
      when:
        - not autoupgrade_keystore_manage | bool

    - name: autoupgrade | Assert keystore
      ansible.builtin.assert:
        quiet: true
        that:
          - _autoupgrade_keystore_stat.stat.exists
        fail_msg: >-
          Auto-login keystore {{ autoupgrade_keystore }}/cwallet.sso is missing.
          Set autoupgrade_keystore_manage: true with mos_username / mos_password,
          or create the keystore manually.
      when:
        - not autoupgrade_keystore_manage | bool

    - name: autoupgrade | Run AutoUpgrade in download mode
      ansible.builtin.command: >-
        {{ _autoupgrade_java }}{{ _autoupgrade_java_opts }} -jar {{ _autoupgrade_jar_path }}
        -config {{ _autoupgrade_download_cfg }}
        -patch -mode download
      environment: "{{ _autoupgrade_proxy_env }}"
      register: _autoupgrade_download_res
      # VALIDATED: patch has been downloaded
      # LOCATED:   patch already exists in autoupgrade_download_dir
      changed_when: "'VALIDATED' in _autoupgrade_download_res.stdout"

    # remove progress indicator (backspaces) and empty lines from output
    # 'File: x.zip | 0%\b\b\b\b/ ... 100%\b\b\b\bVALIDATED' => 'File: x.zip - VALIDATED'
    - name: autoupgrade | Show result
      ansible.builtin.debug:
        msg: >-
          {{ _autoupgrade_download_res.stdout_lines
             | map('regex_replace', '^(.*?) [|/\\-] .*\x08([^\x08]*)$', '\1 - \2')
             | reject('match', '^\s*$')
             | list }}

    # Gold Images get unique filenames with a timestamp from AutoUpgrade.
    # Rename them and create a symlink with the original filename,
    # because AutoUpgrade skips the download when the file exists.
    # Symlinks are created only after the rename => removed symlinks are not recreated.
    - name: autoupgrade | Rename Gold Images
      when:
        - autoupgrade_download_gold_image_rename | bool
      block:
        - name: autoupgrade | Read patches_info.json
          ansible.builtin.slurp:
            src: "{{ autoupgrade_download_dir }}/patches_info.json"
          register: _autoupgrade_patches_info

        - name: autoupgrade | Check downloaded Gold Images
          ansible.builtin.stat:
            path: "{{ autoupgrade_download_dir }}/{{ augi.src }}"
            get_checksum: false
          loop: "{{ _autoupgrade_gold_images }}"
          loop_control:
            loop_var: augi
            label: "{{ augi.src }}"
          register: _autoupgrade_gold_images_stat

        # creates: an existing file with the new name is never replaced
        - name: autoupgrade | Rename Gold Image
          ansible.builtin.command:
            argv:
              - mv
              - "{{ autoupgrade_download_dir }}/{{ augs.augi.src }}"
              - "{{ autoupgrade_download_dir }}/{{ augs.augi.dest }}"
            creates: "{{ autoupgrade_download_dir }}/{{ augs.augi.dest }}"
          loop: "{{ _autoupgrade_gold_images_stat.results }}"
          loop_control:
            loop_var: augs
            label: "{{ augs.augi.src }} => {{ augs.augi.dest }}"
          register: _autoupgrade_gold_images_mv
          when:
            # regular file only, not a symlink from a previous rename
            - augs.stat.isreg | default(false)

        - name: autoupgrade | Create symlink with the original filename
          ansible.builtin.file:
            src: "{{ augm.augs.augi.dest }}"
            dest: "{{ autoupgrade_download_dir }}/{{ augm.augs.augi.src }}"
            state: link
          loop: "{{ _autoupgrade_gold_images_mv.results | selectattr('changed') | list }}"
          loop_control:
            loop_var: augm
            label: "{{ augm.augs.augi.src }} -> {{ augm.augs.augi.dest }}"

        - name: autoupgrade | Warn about Gold Images not renamed
          ansible.builtin.debug:
            msg: >-
              Not renamed, because the file exists already:
              {{ _autoupgrade_gold_images_mv.results
                 | rejectattr('skip_reason', 'defined') | rejectattr('changed')
                 | map(attribute='augs.augi.src') | list }}
          when:
            - _autoupgrade_gold_images_mv.results
              | rejectattr('skip_reason', 'defined') | rejectattr('changed') | list | length > 0

        # All renamed Gold Images in autoupgrade_download_dir, not only from this download
        # => the download of an older release update does not change the symlink
        - name: autoupgrade | Find renamed Gold Images
          ansible.builtin.find:
            paths: "{{ autoupgrade_download_dir }}"
            patterns: "^{{ autoupgrade_download_gold_image_prefix | regex_escape }}[0-9]+\\.[0-9]+\\.zip$"
            use_regex: true
            file_type: file
          register: _autoupgrade_gold_image_files
          when:
            - autoupgrade_download_gold_image_latest | bool

        - name: autoupgrade | Create symlink to the latest Gold Image
          ansible.builtin.file:
            src: "{{ aulg.value.file }}"
            dest: "{{ autoupgrade_download_dir }}/{{ autoupgrade_download_gold_image_prefix }}{{ aulg.key }}_latest.zip"
            state: link
          loop: "{{ _autoupgrade_gold_image_latest | dict2items }}"
          loop_control:
            loop_var: aulg
            label: "{{ autoupgrade_download_gold_image_prefix }}{{ aulg.key }}_latest.zip -> {{ aulg.value.file }}"
          when:
            - autoupgrade_download_gold_image_latest | bool

    - name: autoupgrade | Warn about unavailable patches
      ansible.builtin.debug:
        msg: >-
          {{ _autoupgrade_download_res.stdout_lines | select('search', 'unavailable') | list }}
      when:
        - "'unavailable' in _autoupgrade_download_res.stdout"

    - name: autoupgrade | Check files from oracle_sw_patches
      ansible.builtin.stat:
        path: "{{ autoupgrade_download_dir }}/{{ aupf }}"
        get_checksum: false
      loop: "{{ _autoupgrade_download_expected }}"
      loop_control:
        loop_var: aupf
      register: _autoupgrade_download_stat
      when:
        - autoupgrade_download_use_oracle_sw_patches | bool

    - name: autoupgrade | Warn about missing files from oracle_sw_patches
      ansible.builtin.debug:
        msg: >-
          Missing in {{ autoupgrade_download_dir }}:
          {{ _autoupgrade_download_stat.results | rejectattr('stat.exists') | map(attribute='aupf') | list }}
      when:
        - autoupgrade_download_use_oracle_sw_patches | bool
        - _autoupgrade_download_stat.results | default([]) | rejectattr('stat.exists') | list | length > 0
