---
_oraswgi_install_giignoreprereqparam: "{% if gi_ignoreprereq | bool %}-ignorePrereq{% endif %}"

_oraswgi_install_init_dg_exists: "{{ oracle_asm_init_dg in (asm_diskgroups | map(attribute='diskgroup') | list) }}"

_oraswgi_install_oracle_grid_responsefile: "grid-{{ oracle_cluster_name }}.rsp"

_oraswgi_manage_patches_oracle_directories:
  - {name: "{{ oracle_stage }}", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_rsp_stage }}", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_tmp_stage }}", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_inventory_loc }}", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/cfgtoollogs", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/admin", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/audit", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/cfgtoollogs/dbca", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/cfgtoollogs/sqlpatch", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ grid_base }}/cfgtoollogs/netca", owner: "{{ _grid_install_user }}", group: "{{ oracle_group }}", mode: '0775'}

_oraswgi_install_oracle_gi_image: >-
  {{ oracle_sw_copy | bool | ternary(oracle_stage, oracle_stage_remote) }}/
  {{- oracle_install_image_gi is defined | bool |
     ternary(oracle_install_image_gi, item.filename) }}

# Environment for root.sh: oracle_script_env without _JAVA_OPTIONS
# rootcrs.pl starts cluutil (java) with 'su <grid user> -c' and parses its output.
# With _JAVA_OPTIONS (even empty) java prints 'Picked up _JAVA_OPTIONS: ...' first
# => CLSRSC-732: The Oracle home ... does not exist on the nodes ... (Grid Infrastructure)
_oraswgi_install_rootsh_env: >-
  {{ oracle_script_env | dict2items | rejectattr('key', 'equalto', '_JAVA_OPTIONS') | items2dict }}
