---
- name: Oraswgi_install | Assert variables
  ansible.builtin.assert:
    quiet: true
    that:
      - default_gipass | length > 0 or sysasmpassword | default('',true) | length > 0
      - default_gipass | length > 0 or asmmonitorpassword | default('',true) | length > 0
      - oracle_install_version_gi is defined
      - oracle_gi_cluster_type in ('STANDARD', 'STANDALONE')
  tags: always

# RAC is not supported at the moment!
- name: Oraswgi_install | Assert gi_switch_back
  ansible.builtin.assert:
    quiet: true
    that:
      - gi_switch_back in ('deny', 'allow', 'ignore')
  tags: always

- name: Oraswgi_install | Assert oracle_install_option_gi
  ansible.builtin.assert:
    quiet: true
    that:
      - oracle_install_option_gi in ('HA_CONFIG', 'CRS_CONFIG')
  tags: always

# Oracle desupported the ASM Filter Driver with 26ai
- name: Oraswgi_install | Assert ASM Filter Driver
  ansible.builtin.assert:
    quiet: true
    that:
      - device_persistence != 'asmfd'
        or
        oracle_install_version_gi is version('23', '<')
    fail_msg: >-
      device_persistence: asmfd is not supported with oracle_install_version_gi={{ oracle_install_version_gi }}.
      The ASM Filter Driver is desupported by Oracle with 26ai.
      Use asmlib, udev or device_persistence '' with own device preparation.
      See doc/guides/breaking_changes.adoc (ASM Filter Driver desupported with 26ai).
  tags: always

- name: Oraswgi_install | Assert role_separation
  ansible.builtin.assert:
    quiet: true
    that:
      - (role_separation | bool and grid_user != oracle_user)
        or
        not role_separation | bool
    fail_msg: >-
      Role separation is enabled.
      Different values for grid_user={{ grid_user }}
      and oracle_user={{ _grid_install_user }} needed.
  tags: always

- name: Oraswgi_install | Assert Grid-Infrastructure variables
  ansible.builtin.assert:
    quiet: true
    that:
      - oracle_scan is defined
      - oracle_vip is defined
  when:
    - oracle_install_option_gi == 'CRS_CONFIG'
  tags: always
