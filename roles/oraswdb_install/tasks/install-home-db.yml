---
- name: install_home_db | set fact with ORACLE_HOME
  ansible.builtin.set_fact:
    oracle_home_db: "{% if db_homes_config[dbh.home]['oracle_home'] is defined -%}
                        {{ db_homes_config[dbh.home]['oracle_home'] }}
                    {%- else -%}
                        {{ oracle_base }}/{{ db_homes_config[dbh.home]['version'] }}/{{ db_homes_config[dbh.home]['home'] }}
                    {%- endif %}"  # noqa jinja[spacing]

- name: install_home_db | Check if DB-server is already installed
  ansible.builtin.shell: grep -w {{ oracle_home_db }} "{{ oracle_inventory_loc }}/ContentsXML/inventory.xml" | grep -iv 'REMOVED=.T.' | awk  '{print $3}' | cut -f2 -d'"'
  # noqa risky-shell-pipe
  register: existing_dbhome
  changed_when: false
  failed_when: false
  tags:
    - install_home
    - existing_dbhome
    - checkdbswinstall

- ansible.builtin.debug:  # noqa name[missing]
    msg: "Installing ORACLE_HOME - {{ oracle_home_db }}"
  when: oracle_home_db not in existing_dbhome.stdout_lines

- name: install_home_db | add dotprofile
  ansible.builtin.template:
    src: "{{ oracle_profile_template }}"
    dest: "{{ oracle_user_home }}/.profile_{{ dbh.home }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: 0660
  when: configure_oracle_profile | bool
  tags: create_db,dotprofile_db

- name: install_home_db | Setup response file for install (DB)
  ansible.builtin.template:
    src: "db-install.rsp.{{ db_version }}.j2"
    dest: "{{ oracle_rsp_stage }}/{{ _oraswdb_install_db_responsefile }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: 0600
  when:
    - orasw_meta_primary_node | bool or _oraswdb_install_home_type=='SI'
    - oracle_home_db not in existing_dbhome.stdout_lines
  tags: responsefileswdb

# unarchive Oracle RDBMS 12c+
- name: install_home_db
  when:
    - db_homes_config[dbh.home]['version'] is version('12.2', '>=')
    - orasw_meta_primary_node | bool or _oraswdb_install_home_type=='SI'
  block:
    - name: install_home_db | Extract files
      ansible.builtin.unarchive:
        src: "{{ oracle_stage }}/{{ db_homes_config[dbh.home].imagename | default(item[0].filename) }}"
        dest: "{{ oracle_home_db }}"
        copy: false
        creates: "{{ oracle_home_db }}/{{ item[0].creates }}"
      with_nested:
        - "{{ _oraswdb_install_oracle_sw_image_db | selectattr('version', 'equalto', db_homes_config[dbh.home]['version']) }}"
        - [""]  # dummy to force item.0 instead of item.
      become: true
      become_user: "{{ oracle_user }}"
      when:
        - item[0].version == db_homes_config[dbh.home]['version']
        - dbh.state|lower == 'present'
        - oracle_sw_copy | bool
        - oracle_home_db not in existing_dbhome.stdout_lines
      tags:
        - oradbswunpack

    - name: install_home_db | Extract files (from remote location)
      ansible.builtin.unarchive:
        src: "{{ oracle_stage_remote }}/{{ db_homes_config[dbh.home].imagename | default(item[0].filename) }}"
        dest: "{{ oracle_home_db }}"
        copy: false
        creates: "{{ oracle_home_db }}/{{ item[0].creates }}"
      with_nested:
        - "{{ _oraswdb_install_oracle_sw_image_db | selectattr('version', 'equalto', db_homes_config[dbh.home]['version']) }}"
        - [""]  # dummy to force item.0 instead of item.
      become: true
      become_user: "{{ oracle_user }}"
      when:
        - item[0].version == db_homes_config[dbh.home]['version']
        - dbh.state|lower == 'present'
        - not oracle_sw_copy | bool
        - oracle_home_db not in existing_dbhome.stdout_lines
      tags:
        - oradbswunpack

- ansible.builtin.include_tasks: "{{ db_version }}.yml"  # noqa name[missing]

- name: install_home_db | Handle linkable database options
  become: true
  become_user: "{{ oracle_user }}"
  tags:
    - dbchopt
  block:

    - name: install_home_db | Check for running processes on $ORACLE_HOME/bin/oracle
      # check for running processes on $ORACLE_HOME/bin/oracle
      # 1st check for installed lsof, because systems could miss it...
      ansible.builtin.shell: |
        set -eu
        if lsof > /dev/null  2>&1 ; then
          if lsof {{ oracle_home_db }}/bin/oracle > /dev/null 2>&1 ; then
            echo "running Oracle processes found. Aborting relink of options!"
            exit 10
          fi
        else
          echo "Please install lsof"
          exit 9
        fi
      changed_when: false
      failed_when: false
      register: oracle_binary_in_use

    - name: install_home_db | oracle binary in use
      ansible.builtin.debug:
        msg: "Cannot relink options, {{ oracle_home_db }}/bin/oracle in use"
      when: oracle_binary_in_use.rc == 10

    - name: install_home_db | lsof missing
      ansible.builtin.debug:
        msg: "Cannot relink options, please install lsof first"
      when: oracle_binary_in_use.rc == 9

    - name: install_home_db | Ensure state of linkable database options
      when: oracle_binary_in_use.rc == 0
      block:
        # oracle_ee_options (chopt names) and oracle_all_editions_options_state
        # are remapped to make targets in ins_rdbms.mk (_oraswdb_install_link_options).
        # The current state is read from the libraries, all needed <target>_on|off
        # are collected and oracle is linked once by ioracle at the end.
        - name: install_home_db | Assert linkable database options are known
          ansible.builtin.assert:
            quiet: true
            that:
              - ae_option.make_target is defined
              - ae_option.match_file is defined
              - ae_option.enabled_matches is defined
            fail_msg: >-
              Option {{ ae_option.option }} is unknown for {{ db_version }}.
              Valid in oracle_ee_options for {{ db_version }}: {{ _oracle_ee_options_valid[db_version] | default([]) }}.
              Known all-editions options: {{ oracle_all_editions_options[db_version] | default({}) | list }}
          loop: "{{ _oraswdb_install_link_options }}"
          loop_control:
            loop_var: ae_option
            label: "{{ ae_option.option }}"

        - name: install_home_db | Determine current state of linkable database options  # noqa command-instead-of-shell
          ansible.builtin.shell:
            cmd: "grep -Pqa '{{ ae_option.enabled_matches }}' {{ ae_option.match_file | basename }}"
            chdir: "{{ oracle_home_db }}/{{ ae_option.match_file | dirname }}"
          loop: "{{ _oraswdb_install_link_options }}"
          loop_control:
            loop_var: ae_option
            label: "{{ ae_option.option }}"
          failed_when: false
          changed_when: false
          register: _oraswdb_install_link_state

        - name: install_home_db | Link database options with one relink of oracle  # noqa no-changed-when
          ansible.builtin.command:
            cmd: "make -f ins_rdbms.mk {{ _oraswdb_install_link_targets | join(' ') }} ioracle"
            chdir: "{{ oracle_home_db }}/rdbms/lib"
          when: _oraswdb_install_link_targets | length > 0
          environment:
            ORACLE_HOME: "{{ oracle_home_db }}"

- name: install_home_db | Run root script after installation
  ansible.builtin.shell: "{{ oracle_home_db }}/root.sh"
  # noqa command-instead-of-shell no-handler no-changed-when
  when:
    - orasw_meta_primary_node | bool or _oraswdb_install_home_type=='SI'
    - oradbinstall.changed
  tags:
    - runroot

- name: install_home_db | Generate glogin.sql
  ansible.builtin.template:
    src: glogin.sql.j2
    dest: "{{ oracle_home_db }}/sqlplus/admin/glogin.sql"
    backup: true
    mode: "0644"
  become: true
  become_user: "{{ oracle_user }}"
  tags:
    - glogindb

- name: install_home_db | Check opatch lspatches (DB)
  ansible.builtin.shell: "{{ oracle_home_db }}/OPatch/opatch lspatches"
  # noqa  command-instead-of-shell
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - orasw_meta_primary_node | bool or _oraswdb_install_home_type=='SI'
    - oradbinstall is defined
  changed_when: false
  register: opatchls
  tags:
    - opatchls

- ansible.builtin.debug:  # noqa ignore-errors name[missing]
    var: opatchls.stdout_lines
  when: opatchls is defined
  tags:
    - opatchls
  ignore_errors: true
