---
__patchru_id: >-
  {{ db_homes_config[dbh.home]['opatchauto'] | map(attribute='patchid') | first }}

__patchru_dir: >-
  /u01/stage/patches/19.3.0.0/35940989/35940989

# internal use only
_oraswdb_install_db_responsefile: "{{ dbh.home }}_{{ ansible_hostname }}.rsp"

# _oraswdb_install_opatchid_list: |-
#   {{ db_homes_config[dbh.home]['opatch'] | default({})
#   | selectattr('state', 'match', 'present')
#   | join(',') }}

# _oraswdb_install_applyruopatchauto: |-
#   {{ gi_patches[oracle_install_version_gi]['opatchauto']
#   | selectattr('state', 'equalto', 'present') | list | first }}

_oraswdb_install_opatchauto_dirlist: |-
  {% for __patch_dict in db_homes_config[dbh.home]['opatchauto'] | default({}) | selectattr('state', 'match', 'present') -%}
  {{- _oraswdb_install_patch_dir_prefix }}/{{ __patch_dict.path
  | default((__patch_dict.patchid | string)+ '/' + (__patch_dict.patchid | string)) -}}
  {%- if not loop.last %},{% endif -%}
  {%- endfor %}

_oraswdb_install_patches_dirlist: |-
  {% for __patch_dict in db_homes_config[dbh.home]['opatch'] | default({}) | selectattr('state', 'match', 'present') -%}
  {{- _oraswdb_install_patch_dir_prefix }}/{{ __patch_dict.path
  | default((__patch_dict.unique_patchid | default(__patch_dict.patchid) | string)+ '/' + (__patch_dict.patchid | string)) -}}
  {%- if not loop.last %},{% endif -%}
  {%- endfor %}

_oraswdb_install_patch_dir_prefix: |-
  {{ oracle_sw_copy | bool | ternary(oracle_stage, oracle_stage_remote) }}/patches/{{ db_version }}

_oraswdb_install_patch_unarchive_dir: "{{ oracle_patch_stage }}/{{ db_version }}/{{ _oraswdb_install_patch_upisubdir }}/"
_oraswdb_install_patch_upisubdir: >-
  {{ osp_loop.unique_patchid is defined
  | ternary(osp_loop.unique_patchid,
  |  osp_loop.patchid) }}/

_oraswdb_install_oracle_sw_image_db: "{{ oracle_sw_image_db }}"

_oraswdb_install_oracle_directories:
  - {name: "{{ oracle_stage }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_rsp_stage }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_tmp_stage }}", owner: root, group: root, mode: "u+rwx,g+rwx,o+rwxt"}
  - {name: "{{ oracle_base }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/cfgtoollogs", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/admin", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/audit", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/cfgtoollogs/dbca", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/cfgtoollogs/sqlpatch", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_base }}/cfgtoollogs/netca", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}
  - {name: "{{ oracle_user_home }}/{{ scripts_folder }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0775'}

# Remap of oracle_ee_options (chopt names, state) and
# oracle_all_editions_options_state (enabled) into one list of linkable options:
# {option, enabled, make_target, match_file, enabled_matches}
# make_target, match_file and enabled_matches are missing for unknown options
# => assert in install-home-db.yml
_oraswdb_install_link_options: >-
  {%- set __opts = [] -%}
  {%- if db_homes_config[dbh.home]['edition'] == 'EE'
        and disable_ee_options | bool
        and oracle_ee_options is defined -%}
  {%-   for o in oracle_ee_options | default([], true) -%}
  {%-     set __def = (o.option in _oracle_ee_options_valid[db_version] | default([]))
                      | ternary(_oracle_ee_options_link[o.option] | default({}), {}) -%}
  {%-     set _ = __opts.append(__def
                    | combine({'option': o.option, 'enabled': o.state | bool})) -%}
  {%-   endfor -%}
  {%- endif -%}
  {%- if set_oracle_all_editions_options_state | bool -%}
  {%-   for o in oracle_all_editions_options_state | default([], true) -%}
  {%-     set __def = oracle_all_editions_options[db_version][o.option] | default({}) -%}
  {%-     set _ = __opts.append({'make_target': o.option}
                    | combine(__def)
                    | combine({'option': o.option, 'enabled': o.enabled | bool})) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{- __opts -}}

# make targets (<target>_on|off) for all options not in intended state.
# oraswdb_install_forcechopt: true => all options are linked again.
_oraswdb_install_link_targets: >-
  {%- set __t = [] -%}
  {%- for r in _oraswdb_install_link_state.results | default([]) -%}
  {%-   set __is_enabled = r.rc == 0 -%}
  {%-   if oraswdb_install_forcechopt | bool or __is_enabled != r.ae_option.enabled -%}
  {%-     set _ = __t.append(r.ae_option.make_target ~ '_' ~ (r.ae_option.enabled | ternary('on', 'off'))) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{- __t -}}

_oraswdb_install_dbh_stat: >-
  {{ stat_dbh_installed.results
  | selectattr('invocation.module_args.path', 'equalto', (db_homes_config[dbh.home]['oracle_home'] + '/root.sh'))
  | list | first
  }}

_local_oracle_sw_image_db: >-
  {{ db_homes_config[dbh.home].imagename
      | default((_oraswdb_install_oracle_sw_image_db
        | selectattr('version', 'equalto', db_homes_config[dbh.home]['version'])
        | list)[0]['filename']
      ) }}

_local_oracle_sw_absolute_image_db: >-
  {{ db_homes_config[dbh.home].filesource
      | default((_oraswdb_install_oracle_sw_image_db
        | selectattr('version', 'equalto', db_homes_config[dbh.home]['version'])
        | list)[0]['filesource']
      ) }}
# ORACLE_HOME without database (e.g. dedicated listener home or before a home switch) => SI
_oraswdb_install_home_type: >-
  {{ (oracle_databases | default([]))
      | selectattr('home','equalto',dbh.home)
      | selectattr('state','equalto','present')
      | map(attribute='oracle_db_type',default='SI')
      | unique | first | default('SI') }}
