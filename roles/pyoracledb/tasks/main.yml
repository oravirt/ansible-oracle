---
- name: Installation block
  when: pyoracledb_install | bool
  tags: pyoracledb
  block:
    - name: pyoracledb | Copy wheel files to the target host
      ansible.builtin.copy:
        src: "{{ pyoracledb_wheel_dir | regex_replace('/*$', '') }}/"
        dest: "{{ _pyoracledb_wheel_dir }}/"
        mode: '0644'
        directory_mode: '0755'
      when: _pyoracledb_copy_wheels | bool

    # pip < 19.3 (e.g. Python 3.6 on OL8) does not know manylinux2014 wheels and would try
    # to build python-oracledb from source, which fails.
    # Without executable, the pip of the Python running the modules is used
    # (ansible_python_interpreter), so the version and the installation match.
    - name: pyoracledb | Ensure pip supports manylinux2014 wheels
      ansible.builtin.pip:
        name: "pip>=19.3"
        extra_args: "{{ _pyoracledb_pip_args }}"
        umask: "{{ pyoracledb_umask | default(omit) }}"
        state: present

    - name: pyoracledb | Install python-oracledb
      ansible.builtin.pip:
        name: "oracledb=={{ _pyoracledb_version }}"
        extra_args: "{{ _pyoracledb_pip_args }}"
        umask: "{{ pyoracledb_umask | default(omit) }}"
        state: present
