---
- name: restart network
  ansible.builtin.service:
    name: network
    state: restarted

- name: swapon
  ansible.builtin.command: swapon -a
  # noqa no-changed-when

- name: reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  when: firewall.results and not disable_firewall | bool
