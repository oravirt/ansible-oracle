---
# list of dict with disk, failure_group and quorum for oracle_asmdg (as JSON)
_oraasm_manage_diskgroups_asmdevice_list: |-
  {%- set ns = namespace(disks=[]) %}
  {%- for disk in ad_loop.disk %}
  {%- if device_persistence == 'asmlib' %}
  {%- set _path = _oracle_asm_disk_prefix ~ disk.asmlabel | upper %}
  {%- elif device_persistence == 'asmfd' %}
  {%- set _path = 'AFD:' ~ disk.asmlabel | upper %}
  {%- elif device_persistence == 'udev' %}
  {%- set _path = _oracle_asm_disk_prefix ~ disk.asmlabel %}
  {%- else %}
  {%- set _path = disk.device %}
  {%- endif %}
  {%- set _disk = {'disk': _path} %}
  {%- if disk.failure_group is defined %}
  {%- set _disk = _disk | combine({'failure_group': disk.failure_group}) %}
  {%- endif %}
  {%- if disk.quorum is defined %}
  {%- set _disk = _disk | combine({'quorum': disk.quorum | bool}) %}
  {%- endif %}
  {%- set ns.disks = ns.disks + [_disk] %}
  {%- endfor %}
  {{- ns.disks | to_json }}

_oracle_asm_disk_prefix: |-
  {%- if device_persistence == 'asmlib' %}
  {%- if oracle_asm_disk_string.endswith('*') %}{{ oracle_asm_disk_string[:-1] }}
  {%- else %}{{ oracle_asm_disk_string }}
  {%- endif %}
  {%- elif device_persistence == 'udev' %}{{ oracle_asm_disk_string }}
  {%- else %}
  {%- endif %}
