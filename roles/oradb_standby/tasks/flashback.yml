---
# Flashback Database of a physical standby database (flashback in oracle_databases).
# Requires odb (entry of oracle_databases) as loop_var.
# The role of the local database decides: a primary database is changed by oradb_manage_db.
- name: Flashback | State of database
  ansible.builtin.include_role:
    name: orasw_meta
    tasks_from: standby_state.yml
  when:
    - _odb_standby_config.type | default('') == 'dataguard'

# The primary database is needed for a log switch before FLASHBACK ON (standby_flashback.yml)
- name: Flashback | Find primary database
  ansible.builtin.include_tasks: primary_detect.yml
  when:
    - odb.flashback | bool
    - _odb_standby_config.type | default('') == 'dataguard'
    - _orasw_meta_standby_state.role | default('') | trim == 'PHYSICAL STANDBY'

- name: Flashback | Flashback Database of physical standby database
  ansible.builtin.include_tasks: standby_flashback.yml
  when:
    - _odb_standby_config.type | default('') == 'dataguard'
    - _orasw_meta_standby_state.role | default('') | trim == 'PHYSICAL STANDBY'
