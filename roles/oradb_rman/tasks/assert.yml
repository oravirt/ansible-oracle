---
- name: Default Destinations for RMAN
  ansible.builtin.assert:
    that:
      - oradb_rman_controlfile_autobackup_disk_default | default('', true) | length > 0
      - oradb_rman_channel_disk_default | default('', true) | length > 0

- name: Warn if old style password variable is used
  ansible.builtin.debug:
    msg: '[WARNING]: do not use rman_password in oracle_databases, use dbpasswords[rman_tnsname][rman_user] instead!'
  # make warning red, but continue
  failed_when: true
  # noqa ignore-errors
  ignore_errors: true
  when: item.rman_password is defined
  with_items:
    - "{{ oracle_databases }}"
  loop_control:
    label: "{{ item.oracle_db_name | default('') }}"

- name: assert for wallet
  ansible.builtin.assert:
    quiet: true
    that:
      - oradb_rman_wallet_password is defined
      - odb.rman_user is defined
      - odb.rman_tnsalias is defined
      - (odb.rman_password is defined or dbpasswords[odb.rman_tnsalias][odb.rman_user] is defined)
  with_items:
    - "{{ oracle_databases }}"
  loop_control:
    loop_var: odb
    label: "oracle_db_name {{ odb.oracle_db_name }}"
  when:
    - odb.rman_wallet | default(false) | bool
  tags:
    - assert

# oradb_rman_tns_admin could not point to $ORACLE_HOME/network/admin
# sqlnet.ora could be configured by oradb_rman and oradb_manage_db.
# => oradb_rman_tns_admin could not point to $ORACLE_HOME/network/admin
- name: Assert oradb_rman_tns_admin does not point to $ORACLE_HOME/network/admin
  ansible.builtin.assert:
    quiet: true
    that: (_oracle_home_db + "/network/admin") != oradb_rman_tns_admin
  with_items:
    - "{{ oracle_databases }}"
  loop_control:
    loop_var: odb
    label: "oracle_db_name {{ odb.oracle_db_name }}"
  tags:
    - assert
    - assert_rman_tns_admin

# Best practice for RMAN: control_file_record_keep_time in init_parameters
# (state present, sid '*'). With RECOVERY WINDOW OF <n> DAYS the value must be >= <n>:
# otherwise the controlfile reuses records of backups, which are needed without catalog.
- name: Assert control_file_record_keep_time for RMAN
  ansible.builtin.assert:
    quiet: true
    that:
      - _oradb_rman_keep_time | length > 0
      - _oradb_rman_keep_time is match('^[0-9]+$')
      - _oradb_rman_keep_time | int >= _oradb_rman_window_days | int
    fail_msg: >-
      {{ odb.oracle_db_name }}: init_parameters needs control_file_record_keep_time
      (state present, sid '*') when rman_jobs are defined{{ _oradb_rman_min_msg }}.
      Current value: '{{ _oradb_rman_keep_time }}'.
      Example: {name: control_file_record_keep_time, value: '30', scope: both, state: present}
      Disable the assert with oradb_rman_assert_control_file_record_keep_time: false
  vars:
    # value of control_file_record_keep_time with state present (default) and sid '*' (default)
    _oradb_rman_keep_time: >-
      {%- set __v = [] -%}
      {%- for ip in odb.init_parameters | default([])
            if ip.name | default('') | lower == 'control_file_record_keep_time'
               and ip.state | default('present') == 'present'
               and ip.sid | default('*') == '*' -%}
      {%-   set _ = __v.append(ip.value | default('') | string | trim) -%}
      {%- endfor -%}
      {{ __v | first | default('') }}
    _oradb_rman_policy: "{{ odb.rman_retention_policy | default(oradb_rman_retention_policy_default) }}"
    _oradb_rman_window_days: >-
      {{ _oradb_rman_policy | upper | regex_search('RECOVERY WINDOW OF ([0-9]+) DAYS', '\1') | default([0], true) | first }}
    _oradb_rman_min_msg: >-
      {{ (', min. ' ~ _oradb_rman_window_days ~ ' days for the retention policy ' ~ _oradb_rman_policy)
         if _oradb_rman_window_days | int > 0 else '' }}
  loop: "{{ oracle_databases | selectattr('rman_jobs', 'defined') | list }}"
  loop_control:
    loop_var: odb
    label: "oracle_db_name {{ odb.oracle_db_name | default('') }}"
  when:
    - oradb_rman_assert_control_file_record_keep_time | bool
    - odb.state | default('present') == 'present'
  tags:
    - assert
