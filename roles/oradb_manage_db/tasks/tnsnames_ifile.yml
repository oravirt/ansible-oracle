---
# IFILE entry for tnsnames_ansible.ora in the tnsnames.ora of the ORACLE_HOME / ORACLE_BASE_HOME.
# Requires tnsinst (entry of tnsnames_installed) as loop_var.
#
# Executed before and after the creation of the databases (main.yml):
# dbca writes the tnsnames.ora of the ORACLE_HOME (header 'Generated by Oracle configuration tools.')
# and removes the IFILE entry. Without the 2nd execution the aliases of tnsnames_ansible.ora are not
# available after the 1st run and the next run creates the entry again (idempotence).
- name: tnsnames_ifile | create IFILE entry in tnsnames.ora
  ansible.builtin.lineinfile:
    line: "IFILE={{ _oradb_manage_db_tns_home }}/network/admin/tnsnames_ansible.ora"
    regexp: "^IFILE=/"
    insertbefore: BOF
    path: "{{ _oradb_manage_db_tns_home }}/network/admin/tnsnames.ora"
    backup: true
    create: true
    state: present
    mode: "0644"
  become: true
  become_user: "{{ _oradb_manage_db_listener_oracle_user }}"
