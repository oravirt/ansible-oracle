---
- name: Assert oracle_home_db
  ansible.builtin.assert:
    that:
      - _oracle_home_db | default('', true) | length > 0
    quiet: true
  tags: always

# We need to check if password is set in inventory
# => Check for password length
- name: Assert sys Password
  ansible.builtin.assert:
    quiet: true
    that:
      - _oradb_manage_db_dbca_sys_pass | default('', true) | length > 0
    fail_msg: Please set dbpasswords and/or default_dbpass in inventory.
  when:
    - odb.state in ('present', 'absent')

- name: manage_db | check if GI is present
  ansible.builtin.stat:
    path: /etc/oracle/olr.loc
  register: olrloc
  tags: update_oratab

- name: manage_db | Deploy ocenv.sh
  ansible.builtin.include_tasks: ocenv.yml
  when: deploy_ocenv | bool
  tags:
    - always

# The systemd service needs an information for
# starting the listener from right home
# Mapping from listener to ORACLE_HOME is done with oracle_databases
# => use the old .profile_<DB_SID> for this
# => use the loop over oracle_databases
- name: listener | Deploy dotprofile for listener autostart
  ansible.builtin.template:
    src: dotprofile-db.j2
    dest: >-
      {{ oracle_user_home }}/.profile_{{ odb.oracle_db_instance_name
            | default(odb.oracle_db_unique_name)
            | default(odb.oracle_db_name) }}
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: 0644
  when: odb.state == 'present'
  loop_control:
    label: >-
      db_name: {{ odb.oracle_db_name | default('') }}
      listener: {{ odb.listener_name | default('') }}
  tags:
    - listener2
    - dotprofile_db

- name: state
  ansible.builtin.debug:
    msg: "Maintaining DB - {{ odb.oracle_db_name }}, ORACLE_HOME - {{ _oracle_home_db }}"
  when:
    - odb.state == 'present'
    - orasw_meta_primary_node | bool

# dbca_copy_template is for special situations, when using DBCA-templates
# without executing a template task before.
- name: manage_db | Copy custom dbca Templates for Database to ORACLE_HOME/assistants/dbca/templates
  ansible.builtin.template:
    src: "{{ (odb.dbca_templatepath | default(''), item) | path_join }}"
    dest: "{{ _oracle_home_db }}/assistants/dbca/templates/{{ odb.oracle_db_name }}_{{ item }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  when:
    - odb.state == 'present'
    - odb.dbca_templatename is defined
    - odb.dbca_copy_template | default(true) | bool
    - odb.dbca_templatename not in('New_Database.dbt','General_Purpose.dbc')
  with_items:
    - "{{ odb.dbca_templatename }}"
    - "{{ odb.customscripts | default([]) }}"
  tags:
    - customdbcatemplate
    - dbcatemplate

- name: manage_db | Prepare installation template
  ansible.builtin.template:
    src: "dbca-create-db.rsp.{{ db_version }}.j2"
    dest: "{{ oracle_rsp_stage }}/{{ _oradb_manage_db_oracle_dbca_rsp }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: 0660
  vars:
    # loop_var dbh was replaced by odb in outer loop
    # => no need to change all dbca-templates...
    dbh: "{{ odb }}"
  when:
    - odb.state == 'present'
    - orasw_meta_primary_node | bool
  tags:
    - create_db
    - dbcatemplate
    - molecule-idempotence-notest

# Standby configuration (db_standby_config): oracle_db is not executed for a standby database.
# - the database is running and DATABASE_ROLE is not PRIMARY
# - the database is not running/mounted and initial_role of the member is physical_standby
#   => a missing standby database is created by oradb_standby, not by dbca
- name: manage_db | State of database in standby configuration
  ansible.builtin.include_role:
    name: orasw_meta
    tasks_from: standby_state.yml
  when:
    - odb.state == 'present'
    - _odb_standby_config | length > 0
    - orasw_meta_primary_node | bool

- name: manage_db | Check for standby database
  ansible.builtin.set_fact:
    _oradb_manage_db_standby_skip: >-
      {{ odb.state == 'present'
         and _odb_standby_config | length > 0
         and orasw_meta_primary_node | bool
         and ((_orasw_meta_standby_state.role | length > 0
               and _orasw_meta_standby_state.role != 'PRIMARY')
              or (_orasw_meta_standby_state.role | length == 0
                  and _odb_standby_member.initial_role | default('') == 'physical_standby')) }}

# used by systemd_units.yml: the unit of a standby database is enabled, but not started
- name: manage_db | Remember standby database
  ansible.builtin.set_fact:
    _oradb_manage_db_standby_dbs: >-
      {{ _oradb_manage_db_standby_dbs | default({})
         | combine({_orasw_meta_standby_sid: {'running': _orasw_meta_standby_state.running | bool,
                                              'role': _orasw_meta_standby_state.role}}) }}
  when: _oradb_manage_db_standby_skip | bool

- name: manage_db | Skip oracle_db for standby database
  ansible.builtin.debug:
    msg: >-
      {{ odb.oracle_db_name }} is a standby database
      (role: {{ _orasw_meta_standby_state.role or 'not running/mounted' }},
      initial_role: {{ _odb_standby_member.initial_role | default('') }})
      => oracle_db is not executed. The standby database is created by oradb_standby.
  when: _oradb_manage_db_standby_skip | bool

# Missing directories of a database in a standby configuration before dbca,
# e.g. dg_broker_config_file1/2: oradb_manage_parameters sets dg_broker_start
# on the primary before oradb_standby is executed.
- name: manage_db | Directories of database in standby configuration
  ansible.builtin.include_role:
    name: orasw_meta
    tasks_from: standby_prepare.yml
  when:
    - odb.state == 'present'
    - _odb_standby_config | length > 0
    - orasw_meta_primary_node | bool

# show debug task for environments with display_skipped_hosts = false
- name: manage_db | Start create/manage database
  ansible.builtin.debug:
    msg: "Executing ansible_oracle.oracle_db. This takes some time..."
  when:
    - odb.state == 'present'
    - not _oradb_manage_db_standby_skip | bool

- name: manage_db | create/manage database
  tags:
    - molecule-idempotence-notest
    - create_db
    - manage_db
    - dbca
  block:
    - name: manage_db | create/manage database
      opitzconsulting.ansible_oracle.oracle_db:
        oracle_home: "{{ _oracle_home_db }}"
        hostname: "{{ oracle_hostname }}"
        port: "{{ listener_port_template }}"
        sys_password: "{{ _oradb_manage_db_dbca_sys_pass }}"
        db_name: "{{ odb.oracle_db_name }}"
        db_unique_name: "{{ odb.oracle_db_unique_name | default(omit) }}"
        sid: "{{ odb.oracle_db_instance_name | default(omit) }}"
        responsefile: "{{ oracle_rsp_stage }}/{{ _oradb_manage_db_oracle_dbca_rsp }}"
        archivelog: "{{ odb.archivelog | default(omit) }}"
        flashback: "{{ odb.flashback | default(omit) }}"
        force_logging: "{{ odb.force_logging | default(omit) }}"
        supplemental_logging: "{{ odb.supplemental_logging | default(omit) }}"
        initparams: "{{ _oradb_manage_db_init_params_list | default(omit) }}"
        omf: "{{ odb.omf | default(omit) }}"
        output: verbose
        state: "{{ odb.state }}"
      become: true
      become_user: "{{ oracle_user }}"
      when:
        - odb.state == 'present'
        - orasw_meta_primary_node | bool
        - not _oradb_manage_db_standby_skip | bool
      register: dbca_create

  rescue:
    - name: manage_db | fail create/manage database
      ansible.builtin.fail:
        msg: >-
          Set oradb_facts_ignore_unreachable=false in oracle_databases
          to disable this fail task.qq
      when:
        - not _odb_loop_helper.oradb_facts_ignore_unreachable | default(false) | bool

- name: manage_db | Customize oratab for autostart
  ansible.builtin.lineinfile:
    dest: /etc/oratab
    # regexp: replace an existing entry for the SID (e.g. with a different ORACLE_HOME)
    regexp: "^{{ odb.oracle_db_instance_name | default(odb.oracle_db_name) }}:"
    line: "{{ odb.oracle_db_instance_name | default(odb.oracle_db_name) }}:{{ _oracle_home_db }}:Y"
    state: present
  when: autostartup_service | bool and not olrloc.stat.exists and odb.state == 'present'
  tags: update_oratab

- name: manage_db | Customize oratab for autostart
  ansible.builtin.lineinfile:
    dest: /etc/oratab
    line: "{{ odb.oracle_db_instance_name | default(odb.oracle_db_name) }}:{{ _oracle_home_db }}:N"
    state: absent
  when: autostartup_service | bool and not olrloc.stat.exists and odb.state == 'present'
  become: true
  tags: update_oratab

- ansible.builtin.debug:
    msg: "Removing DB - {{ odb.oracle_db_name }}, ORACLE_HOME - {{ _oracle_home_db }}"  # noqa name[missing]
  when:
    - odb.state == 'absent'
    - orasw_meta_primary_node | bool

- name: manage_db | remove database
  opitzconsulting.ansible_oracle.oracle_db:
    oracle_home: "{{ _oracle_home_db }}"
    hostname: "{{ oracle_hostname }}"
    port: "{{ listener_port_template }}"
    sys_password: "{{ _oradb_manage_db_dbca_sys_pass }}"
    system_password: "{{ _oradb_manage_db_dbca_system_pass }}"
    db_name: "{{ odb.oracle_db_name }}"
    output: verbose
    state: "{{ odb.state }}"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - odb.state == 'absent'
    - orasw_meta_primary_node | bool
  register: dbca_remove
  tags: remove_db,dbca

- ansible.builtin.debug:
    var: dbca_remove.stdout_lines  # noqa name[missing] no-handler
  when: dbca_remove.changed

- name: manage_db | remove dotprofile
  ansible.builtin.file:
    path: "{{ oracle_user_home }}/.profile_{{ odb.oracle_db_name }}"
    state: absent
  when: odb.state == 'absent'
  tags: create_cdb,dotprofile_db
