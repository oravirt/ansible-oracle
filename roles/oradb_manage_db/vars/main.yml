---

_oradb_manage_db_tns_home: "{{ _oradb_manage_db_listener_home }}"

# Do not set this variable in inventory, set_fact ...!
_oradb_manage_db_oracle_dbca_rsp: "dbca_{{ odb.oracle_db_name }}.rsp"

# Do not set this variable in inventory, set_fact ...!
_oradb_manage_db_oracle_netca_rsp: >-
  netca_{{ odb.home }}_{{ listener_name_template }}.rsp

# Do not set this variable in inventory, set_fact ...!
_oradb_manage_db_listener_protocols_template: >-
  {{ odb.listener_protocols | default('listener_protocols') }}

# build init_param_list for dbca execution
# Only parameter with attribute dbca=true are added to the list
# => parameter could be send to dbca directly during execution!
# Parameter for one instance (sid not '*') are not passed to dbca by default (no SID clause).
_oradb_manage_db_init_params_list: "{%- if odb.init_parameters is defined -%}\
                      {%- for p in odb.init_parameters -%}\
                        {%- if p.dbca | default(p.sid | default('*') == '*') -%}\
                            {{ p.name }}={{ p.value }}{%- if not loop.last -%},{%- endif -%}\
                        {%- endif -%}\
                      {%- endfor -%}\
                    {%- endif -%}"

# used in DBCA Responsefiles
_oradb_manage_db_datafile_dest: "{% if odb.storage_type | upper == 'FS' %}{{ oracle_dbf_dir_fs }}\
                {%- elif odb.storage_type | upper == 'ASM' %}{{ oracle_dbf_dir_asm }}\
                {%- endif %}"

# used in DBCA Responsefiles
_oradb_manage_db_recoveryfile_dest: "{% if odb.storage_type | upper == 'FS' %}{{ oracle_reco_dir_fs }}\
                    {%- elif odb.storage_type | upper == 'ASM' %}{{ oracle_reco_dir_asm }}\
                    {%- endif %}"

_oradb_manage_db_create_listener: >-
  {{ oracle_install_option_gi | default('') | length == 0
  and odb is defined and odb.listener_name is defined }}

_oradb_manage_db_listener_loop_helper: |-
  {{ lsnrinst | default(tnsinst) | default(sqlnetinst) | default({}) }}

# GI / Oracle Restart home: use_gi_home (listener_installed, tnsnames_installed, sqlnet_installed)
_oradb_manage_db_listener_gi: "{{ _oradb_manage_db_listener_loop_helper.use_gi_home | default(false) | bool }}"

# OS-User for ORACLE_HOME from Listener
_oradb_manage_db_listener_oracle_user: >-
  {{ _oradb_manage_db_listener_gi | bool
  | ternary((role_separation | bool | ternary(grid_user, oracle_user)), oracle_user) }}

# use_gi_home in listener_installed => crs_home from /etc/oracle/olr.loc (loop_listener_details.yml)
_oradb_manage_db_listener_home: |-
  {% if lsnrinst is defined and _oradb_manage_db_listener_gi | bool %}
  {{- _oradb_manage_db_crs_home | default(oracle_home_gi) }}
  {%- elif _oradb_manage_db_listener_gi | bool %}
  {{- oracle_home_gi }}
  {%- elif db_homes_config[_oradb_manage_db_listener_loop_helper.home]['readonly_home'] | default(false) | bool %}
  {{- oracle_base }}/homes/{{ db_homes_config[_oradb_manage_db_listener_loop_helper.home]['oracle_home_name'] }}
  {%- else %}
  {{- db_homes_config[_oradb_manage_db_listener_loop_helper.home]['oracle_home'] }}
  {%- endif %}

# ORACLE_HOME of the listener resource in Grid Infrastructure / Oracle Restart (srvctl -oraclehome):
# - use_gi_home => crs_home from /etc/oracle/olr.loc
# - otherwise the ORACLE_HOME of home (not ORACLE_BASE_HOME of a read-only ORACLE_HOME)
_oradb_manage_db_listener_crs_oraclehome: >-
  {%- if lsnrinst.use_gi_home | default(false) | bool -%}
  {{ _oradb_manage_db_crs_home | default(oracle_home_gi) }}
  {%- else -%}
  {{ db_homes_config[lsnrinst.home]['oracle_home']
     | default(oracle_base ~ '/' ~ db_homes_config[lsnrinst.home]['version'] ~ '/' ~ lsnrinst.home) }}
  {%- endif -%}

_oradb_manage_db_dbca_sys_pass: "{% if dbpasswords[odb.oracle_db_name] is defined %}\
                  {%- if dbpasswords[odb.oracle_db_name]['sys'] is defined %}{{ dbpasswords[odb.oracle_db_name]['sys'] }}\
                  {%- else %}{{ default_dbpass }}\
                  {%- endif %}\
                {%- else %}{{ default_dbpass }}\
                {%- endif %}"

_oradb_manage_db_dbca_system_pass: "{% if dbpasswords[odb.oracle_db_name] is defined %}\
                     {%- if dbpasswords[odb.oracle_db_name]['system'] is defined %}{{ dbpasswords[odb.oracle_db_name]['system'] }}\
                     {%- else %}{{ default_dbpass }}\
                     {%- endif %}\
                    {%- else %}{{ default_dbpass }}\
                    {%- endif %}"

# default_gipass could be '' when no GI/Restart is used
_oradb_manage_db_default_gipass: >-
  {{ (oracle_install_option_gi | length > 0) | ternary(default_gipass, '') }}

# default_gipass could be '' when no GI/Restart is used
_oradb_manage_db_sysasmpassword: >-
  {{ (oracle_install_option_gi | length > 0) | ternary(default_gipass, '') }}

_oradb_manage_db_asmmonitorpassword: >-
  {{ (oracle_install_option_gi | length > 0) | ternary(default_gipass, '') }}

# Variables for switch_home.yml (Out-of-Place Patching)
# Requires `odb` as `loop_var`.
_oradb_manage_db_switch_sid: "{{ odb.oracle_db_instance_name | default(odb.oracle_db_name) }}"

_oradb_manage_db_switch_new_home: "{{ _oracle_home_db | regex_replace('/$', '') }}"

# 1st line from /etc/oratab for the SID: <SID>:<ORACLE_HOME>:<flag>
_oradb_manage_db_switch_oratab_line: >-
  {{ (_oradb_manage_db_switch_oratab.content | default('') | b64decode).splitlines()
     | select('match', _oradb_manage_db_switch_sid ~ ':')
     | first | default('') }}

_oradb_manage_db_switch_oratab_home: >-
  {{ (_oradb_manage_db_switch_oratab_line.split(':') + [''])[1] | regex_replace('/$', '') }}

# Grid Infrastructure / Oracle Restart: /etc/oratab is not read => N (autostart by the Clusterware)
_oradb_manage_db_switch_oratab_flag: >-
  {{ (_oradb_manage_db_switch_oratab_line.split(':') + ['', 'N'])[2] | default('N', true) }}

# Grid Infrastructure: switch with srvctl for Oracle Restart only (RAC is not supported)
_oradb_manage_db_switch_gi: "{{ _oradb_manage_db_switch_olrloc.stat.exists | default(false) }}"

_oradb_manage_db_switch_supported: >-
  {{ not _oradb_manage_db_switch_gi | bool or oracle_install_option_gi == 'HA_CONFIG' }}

_oradb_manage_db_switch_db_unique_name: "{{ odb.oracle_db_unique_name | default(odb.oracle_db_name) }}"

# Oracle Restart: values from srvctl config database (<key>: <value>)
_oradb_manage_db_switch_srvctl_lines: "{{ (_oradb_manage_db_switch_srvctl.stdout | default('')).splitlines() }}"

_oradb_manage_db_switch_srvctl_home: >-
  {{ _oradb_manage_db_switch_srvctl_lines | select('match', 'Oracle home:') | first | default('')
     | regex_replace('^Oracle home: *', '') | trim | regex_replace('/$', '') }}

_oradb_manage_db_switch_srvctl_spfile: >-
  {{ _oradb_manage_db_switch_srvctl_lines | select('match', 'Spfile:') | first | default('')
     | regex_replace('^Spfile: *', '') | trim }}

_oradb_manage_db_switch_srvctl_pwfile: >-
  {{ _oradb_manage_db_switch_srvctl_lines | select('match', 'Password file:') | first | default('')
     | regex_replace('^Password file: *', '') | trim }}

# Without Grid Infrastructure: PRIMARY (physical standby is not supported)
_oradb_manage_db_switch_role: >-
  {{ _oradb_manage_db_switch_srvctl_lines | select('match', 'Database role:') | first
     | default('Database role: PRIMARY')
     | regex_replace('^Database role: *', '') | trim | upper }}

# Registered ORACLE_HOME: /etc/oratab or Oracle Restart
_oradb_manage_db_switch_registered_home: >-
  {{ _oradb_manage_db_switch_srvctl_home
     if _oradb_manage_db_switch_gi | bool
     else _oradb_manage_db_switch_oratab_home }}

# ORACLE_HOME of the running instance. Empty when the instance is not running.
_oradb_manage_db_switch_running_home: >-
  {{ _oradb_manage_db_switch_running.stdout | default('') | trim }}

# Active ORACLE_HOME: running instance or registered ORACLE_HOME
_oradb_manage_db_switch_old_home: >-
  {{ _oradb_manage_db_switch_running_home
     if _oradb_manage_db_switch_running_home | length > 0
     else _oradb_manage_db_switch_registered_home }}

# Database is running from or registered with a different ORACLE_HOME
_oradb_manage_db_switch_needs_switch: >-
  {{ _oradb_manage_db_switch_old_home | length > 0
     and _oradb_manage_db_switch_old_home != _oradb_manage_db_switch_new_home }}

# Flag file for an incomplete switch (e.g. failed datapatch)
_oradb_manage_db_switch_flagfile: "{{ oracle_base }}/switch_home_{{ _oradb_manage_db_switch_sid }}.pending"

_oradb_manage_db_switch_dbs_old: "{{ _oradb_manage_db_switch_orabaseconfig.results[0].stdout }}/dbs"

_oradb_manage_db_switch_dbs_new: "{{ _oradb_manage_db_switch_orabaseconfig.results[1].stdout }}/dbs"

# SPFile and password file of Oracle Restart in the old location are copied as well
_oradb_manage_db_switch_dbs_files: >-
  {{ (['spfile' ~ _oradb_manage_db_switch_sid ~ '.ora',
       'init' ~ _oradb_manage_db_switch_sid ~ '.ora',
       'orapw' ~ _oradb_manage_db_switch_sid]
      + ([_oradb_manage_db_switch_srvctl_spfile, _oradb_manage_db_switch_srvctl_pwfile]
         | select('match', _oradb_manage_db_switch_dbs_old ~ '/[^/]+$')
         | map('basename') | list))
     | unique }}

# Oracle Restart: new SPFile/password file for srvctl modify database,
# when it is registered in the old location. Empty otherwise.
_oradb_manage_db_switch_srvctl_spfile_new: >-
  {{ _oradb_manage_db_switch_dbs_new ~ '/' ~ (_oradb_manage_db_switch_srvctl_spfile | basename)
     if _oradb_manage_db_switch_srvctl_spfile is match(_oradb_manage_db_switch_dbs_old ~ '/[^/]+$')
     else '' }}

_oradb_manage_db_switch_srvctl_pwfile_new: >-
  {{ _oradb_manage_db_switch_dbs_new ~ '/' ~ (_oradb_manage_db_switch_srvctl_pwfile | basename)
     if _oradb_manage_db_switch_srvctl_pwfile is match(_oradb_manage_db_switch_dbs_old ~ '/[^/]+$')
     else '' }}

_oradb_manage_db_switch_env_old:
  ORACLE_HOME: "{{ _oradb_manage_db_switch_old_home }}"
  ORACLE_SID: "{{ _oradb_manage_db_switch_sid }}"
  PATH: "{{ _oradb_manage_db_switch_old_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin"

_oradb_manage_db_switch_env_new:
  ORACLE_HOME: "{{ _oradb_manage_db_switch_new_home }}"
  ORACLE_SID: "{{ _oradb_manage_db_switch_sid }}"
  PATH: "{{ _oradb_manage_db_switch_new_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin"

# ORACLE_HOME of the running listener in loop_listener_details.yml.
# Empty when the listener is not running.
_oradb_manage_db_listener_running_home: >-
  {{ _oradb_manage_db_listener_running.stdout | default('') | trim }}

# failed database units with the state of the database from oracledb_facts (systemd_units_repair.yml)
_oradb_manage_db_unit_failed: >-
  {%- set __units = [] -%}
  {%- for r in _oradb_manage_db_unit_status.results | default([])
        if r.status is defined and r.status.ActiveState | default('') == 'failed' -%}
  {%-   set __db = oracledb_facts[r.odb.oracle_db_unique_name | default(r.odb.oracle_db_name)]['database']
                   | default({}) -%}
  {%-   set __role = __db.DATABASE_ROLE | default('') -%}
  {%-   set __mode = __db.OPEN_MODE | default('') -%}
  {%-   set _ = __units.append({'name': r.name | default('oracle-db@' ~ (r.odb.oracle_db_instance_name
                                 | default(r.odb.oracle_db_name)) ~ '.service'),
                                'role': __role, 'open_mode': __mode,
                                'repair': __mode.startswith('READ')
                                          or (__role == 'PHYSICAL STANDBY' and __mode == 'MOUNTED')}) -%}
  {%- endfor -%}
  {{ __units }}
_oradb_manage_db_unit_repair: "{{ _oradb_manage_db_unit_failed | selectattr('repair') | list }}"
