---
name: Ansible Lint

on:
  pull_request:
    branches:
      - master
      - release/4.x
      - development
  push:
    branches:
      - 'pr*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
