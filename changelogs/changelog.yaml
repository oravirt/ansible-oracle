      - 'oracle_asmdg: compatible.asm is set first, compatible.rdbms and compatible.advm
        can''t be higher than compatible.asm (oravirt#491) (oravirt#674)'
      - 'oracle_asmdg: create of a disk group without attribute_name failed, attribute
