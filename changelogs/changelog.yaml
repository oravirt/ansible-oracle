      major_changes:
      - Support for ansible-core 2.19 (see doc/guides/breaking_changes.adoc) (oravirt#670)
      - 'ahf: new role for the installation and configuration of Oracle Autonomous
        Health Framework (AHF) incl. registration as AHF Fleet Insights client, see
        doc/guides/ahf.adoc (oravirt#704)'
      - 'ahf_fleet_insights: new role for the installation of Oracle AHF Fleet Insights
        as central web interface for AHF data, see doc/guides/ahf.adoc (oravirt#704)'
      - ansible-core 2.16 is the new minimal version of ansible-oracle (requires_ansible
        in meta/runtime.yml, min_ansible_version of all roles) (oravirt#656)
      - 'oracle_crs_listener: new module in opitzconsulting.ansible_oracle, replaces
        ibre5041.ansible_oracle_modules.oracle_crs_listener in oradb_manage_db. The
        dependency ibre5041.ansible_oracle_modules is removed from galaxy.yml. (oravirt#687)'
      - 'oracle_crs_listener: srvctl add/modify listener is executed with srvctl of
        the ORACLE_HOME of the listener (srvctl of a newer GI home fails with PRCN-3018
        for a listener in an older database home) (oravirt#687)'
      - 'oracle_crs_listener: state present adds/modifies and starts the listener
        (same as started), a disabled listener is not started. state stopped adds
        a listener without starting it (oravirt#687)'
      - 'oracle_crs_listener: the GI home is always crs_home from /etc/oracle/olr.loc,
        there is no option crs_home (oravirt#687)'
      minor_changes:
      - New setting `firewall_open_listener_ports` to open Listener ports on the OS
        firewall. (oravirt#666)
      - New variable `oracle_extra_firewall_ports` to open additional ports on the
        OS firewall. (oravirt#666)
      - 'ahf: new variable ahf_fleet_insights_manage - false keeps the registration
        in AHF Fleet Insights unchanged (no registration, no deregistration) (oravirt#710)'
      - 'all roles: boolean variables from the inventory are evaluated with ''| bool''
        in conditionals, strings like ''yes'' or -e var=false work with ansible-core
        2.19 (oravirt#670)'
      - 'ansible-doctor: new version 8.4.3 (oravirt#652)'
      - 'ansible-doctor: render all READMEs with new version (oravirt#652)'
