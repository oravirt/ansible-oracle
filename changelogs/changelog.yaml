      - 'oracle_opatch: restore shebang #!/usr/bin/python, /usr/bin/env python3 fails
        with ansible-core 2.17 (oravirt#521) (oravirt#653)'
      - 'oracle_parameter: check mode with scope=spfile failed with an AttributeError
