      release_summary: 'This is by far the most extensive release since the project
        began.


        The release contains numerous breaking changes. They are described in the

        documentation. Please read it carefully before updating an existing

        environment.


        All issues known over the past years have been resolved with release 5.0.0.


        The majority of the code was developed with the help of Claude.

        '
      removed_features:
      - 'cxoracle: the role is removed, all modules use python-oracledb instead of
        cx_Oracle. Use the role pyoracledb (see doc/guides/breaking_changes.adoc)
        (oravirt#670)'
      - 'cxoracle: the variables of the role are removed and have no effect anymore.
        Replace them in the inventory - install_cx_oracle => pyoracledb_install, cx_oracle_source
        and cx_oracle3_source => pyoracledb_wheel_dir (directory with wheel files
        of python-oracledb instead of a single cx_Oracle file), cx_oracle_umask =>
        pyoracledb_umask, use_proxy => pyoracledb_use_proxy, http_proxy => pyoracledb_http_proxy,
        extra_args => pyoracledb_extra_args (see doc/guides/breaking_changes.adoc)
        (oravirt#670)'
      - 'oradb_manage_db: totalMemory is not set in the dbca response files for 19c
        and 26ai anymore (oracle_db_mem_totalmb) (oravirt#702)'
      - 'orasw_meta: datafile_dest and recoveryfile_dest in oracle_databases are removed,
        the assert fails. Use db_create_file_dest and db_recovery_file_dest in init_parameters
        (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orasw_meta: oracle_db_mem_totalmb in oracle_databases is not supported anymore,
        the assert fails. Use sga_target and pga_aggregate_target in init_parameters
        (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orasw_meta: oracle_dbf_dir_asm and oracle_reco_dir_asm are removed. ASM databases
        use db_create_file_dest and db_recovery_file_dest from init_parameters (see
        doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'oraswahf_install: removed the empty role, replaced by ahf (oravirt#704)'
      security_fixes:
      - 'oracle_asmdg, oracle_asmvol: the error message of a failed connection contained
        the user and the password in plain text. The message is now the same as in
        the other modules (error and connect descriptor only) (oravirt#670)'
      - 'oracle_profile: the error message of a failed connection contained the user
        and the password in plain text. The message is now the same as in the other
        modules (error and connect descriptor only) (oravirt#670)'
