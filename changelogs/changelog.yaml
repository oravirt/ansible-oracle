        same number of entries (oravirt#491) (oravirt#674)'
      - 'oracle_crs_listener: a running listener kept the old ORACLE_HOME after a
        change of oraclehome. The listener is stopped before srvctl modify listener
        -oraclehome and started afterwards. A listener process running from another
        ORACLE_HOME than the resource is stopped with lsnrctl of its ORACLE_HOME and
