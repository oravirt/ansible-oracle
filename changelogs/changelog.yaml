      - 'oracle_parameter: errors of ALTER SYSTEM RESET were reported without the
        Oracle error message (oravirt#670)'
      - 'oracle_parameter: size parameters (e.g. sga_target, shared_pool_size) were
        changed on every run, because Oracle rounds the memory value up to the granule
        size. Size parameters are compared in bytes now (units K, M, G, T, P), the
        memory value of SGA components may be up to one granule larger than value.
        (oravirt#670)'
      - 'oracle_parameter: state=reset/absent with scope=both was never idempotent
        with 23ai and newer, because ALTER SYSTEM RESET does not raise ORA-32010 any
        more. The module checks V$SPPARAMETER.ISSPECIFIED and V$PARAMETER.ISMODIFIED
        before the reset now, so check mode returns the correct changed state as well.
        (oravirt#670)'
      - 'oracle_parameter: state=reset/absent with scope=memory failed with ORA-32012
        for a parameter that is not modified in memory, it returns changed=false now
        (oravirt#670)'
      - 'oracle_parameter: the current value is compared for the instance given in
        sid (memory from GV$PARAMETER of the running instance, spfile entry for sid),
        not for the connected instance or another spfile entry. Only the spfile is
        changed for an instance that is not running, scope=memory fails for it (oravirt/ansible-oracle#677)
        (oravirt#682)'
      - 'oracle_parameter: the current value with scope=spfile and sid=''*'' is read
        from the spfile entry for ''*'', not from an entry for another instance (oravirt/ansible-oracle#677)
        (oravirt#682)'
      - 'oracle_parameter: with scope=both the spfile value of a size parameter is
