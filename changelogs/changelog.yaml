        sort interfaces for a stable /etc/motd (oravirt#670)'
      - 'common: python3-packaging is installed on RHEL9/OL9 and RHEL10/OL10, because
        ansible.builtin.pip (used by pyoracledb) needs packaging or setuptools and
        RHEL10/OL10 has no setuptools by default. On RHEL8/OL8 python3-packaging is
        only in CodeReady Builder, setuptools is installed by default (oravirt#680)'
      - 'galaxy.yml: community.crypto is limited to <3.0.0, because version 3.x needs
