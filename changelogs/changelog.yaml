      - 'molecule: module test oracle_crs_listener in scenario has-ol9 (oravirt#687)'
      - 'molecule: module test oracle_db does not check /etc/oratab for missing databases
        with Grid Infrastructure / Oracle Restart (oravirt#686)'
      - 'oraasm_manage_diskgroups: a disk group without attributes passed the string
        None as attribute to oracle_asmdg. The internal variables _oraasm_manage_diskgroups_attr_name
        and _oraasm_manage_diskgroups_attr_value are removed, see doc/guides/breaking_changes.adoc
        (oravirt#491) (oravirt#674)'
      - 'oracle_asmdg: attributes of an existing disk group were not set (e.g. compatible.rdbms
        of the disk group created by gridSetup), fixed with v4.14.0 (oravirt#534).
