      - 'oracle_job, oracle_jobschedule: invalid escape sequences in the regular expression
        for the name (SyntaxWarning, fix by Rafal Kolodziej, oravirt#588) (oravirt#670)'
      - 'oracle_job: an existing job without logging_level failed with an AttributeError,
        the logging level is only compared when logging_level is set now (oravirt#670)'
      - 'oracle_job: with convert_to_upper=false an existing job with a mixed case
        name was not found, so state=present failed with ORA-27477 and state=absent
        did nothing (oravirt#670)'
      - 'oracle_ldapuser: python-ldap returns bytes on Python 3, so user names and
        memberOf could not be compared and invalid names raised a RuntimeError (fix
