    changes:
      breaking_changes:
      - 'devsec: Removed dev-sec from ansible-oracle (oravirt#664)'
      - 'example: New beginners Guide (oravirt#663)'
      - 'galaxy: update community.general dependency to version >=11.0.0,<12.0.0 for
        Python 3.6 (oravirt#656)'
      - 'oracle_directory: a directory name in double quotes is case sensitive like
        in SQL, a name without quotes is used in uppercase as before (see doc/guides/breaking_changes.adoc)
        (oravirt#670)'
      - 'oracle_grants: names in double quotes are case sensitive like in SQL, names
        without quotes are used in uppercase. Grants on existing objects or roles
        with a lower or mixed case name must be given in double quotes now, they were
        compared case insensitive before (see doc/guides/breaking_changes.adoc) (oravirt#670)'
      - 'oracle_profile, oracle_job: a name in double quotes is case sensitive like
        in SQL, a name without quotes is used in uppercase. oracle_profile compares
        the name exactly with DBA_PROFILES now, an existing profile with a lower or
        mixed case name must be given in double quotes (see doc/guides/breaking_changes.adoc)
        (oravirt#670)'
      - 'oradb_manage_db: autostart with one systemd unit per database (oracle-db@<ORACLE_SID>.service)
        and listener (oracle-listener@<LISTENER_NAME>.service), environment in /etc/sysconfig/oracledb.
        oracle-rdbms.service is disabled and removed without stopping the databases,
        see doc/guides/breaking_changes.adoc (oravirt#265) (oravirt#676)'
      - 'oradb_manage_db: is_container in oracle_databases is true by default. A 19c
        database without is_container is created as CDB, set is_container: false for
        a non-CDB (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'oradb_manage_db: omf in oracle_databases is true by default. dbca is called
        with -useOMF true. OMF is strongly recommended, databases without OMF are
        not tested anymore. omf: false needs an own DBCA template without OMF (dbca_templatename)
        (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'oradb_manage_db: the database unit monitors PMON and restarts a crashed database
        after autostartup_service_restart_sec (2min). autostartup_service_restart
        (default true) disables the restart for all databases or per database in oracle_databases.
        A shutdown outside of systemd is detected by the alert log and not restarted,
        see doc/guides/breaking_changes.adoc (oravirt#265) (oravirt#676)'
      - 'oradb_manage_db: with Grid Infrastructure / Oracle Restart a listener with
        home in listener_installed is registered with srvctl in the ORACLE_HOME of
        home (oracle_crs_listener oraclehome), before a new listener resource was
        added in the GI home. Use use_gi_home: true for a listener in the GI / Oracle
        Restart home (see doc/guides/breaking_changes.adoc) (oravirt#687)'
      - 'oradb_rman: assert for control_file_record_keep_time in init_parameters of
        databases with rman_jobs (>= n for RECOVERY WINDOW OF n DAYS), emergency switch
        oradb_rman_assert_control_file_record_keep_time: false (see doc/guides/breaking_changes.adoc)
        (oravirt#685)'
      - 'oradb_rman: rman_backup.sh allows only one execution of an action for a database
        (flock), a 2nd execution stops with exit code 30 (see doc/guides/breaking_changes.adoc)
        (oravirt#685)'
      - 'oradb_rman: rman_backup.sh writes all output to stdout and a logfile per
        execution <RMAN_LOGDIR>/<db_unique_name>_<action>_<timestamp>_<pid>.log (also
        manual executions), symlink <db_unique_name>_<action>.log to the last execution,
        RMAN_LOG_RETENTION removes old logfiles (oradb_rman_log_retention, default
        30 days). The prefix is db_unique_name instead of ORACLE_SID, an old logfile
        with the name of the symlink is renamed to ``*.log.old`` (see doc/guides/breaking_changes.adoc)
        (oravirt#685)'
      - 'oradb_rman: the crontab entries redirect the output to /dev/null, oradb_rman_cron_logdir
        and rman_cron_logdir are removed, /var/log/oracle/rman/log is no longer written
        (see doc/guides/breaking_changes.adoc) (oravirt#685)'
      - 'oradb_rman: the templates parameter_rac and parameter_fra_disk use db_create_file_dest
        from init_parameters for the snapshot controlfile instead of oracle_dbf_dir_asm
        (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orahost: disable_firewall is now false by default (was true before) (oravirt#666)'
      - 'orahost: firewall_open_listener_ports is now true by default (was false before)
        (oravirt#666)'
      - 'orahost_meta: the assert of oracle_databases requires processes in init_parameters
        for databases with state present. processes is needed for the calculation
        of kernel.sem, before a database without processes failed with an undefined
        variable or was ignored in kernel.sem. Usually irrelevant in practice, the
        default of processes is too small in most cases anyway (see doc/guides/breaking_changes.adoc)
        (oravirt#706)'
      - 'orasw_meta: init_parameters of oracle_databases with sid other than ''*''
        and dbca=true are not allowed, because dbca has no SID clause - the assert
        of oracle_databases fails (oravirt/ansible-oracle#677, see doc/guides/breaking_changes.adoc)
        (oravirt#682)'
      - 'orasw_meta: new variable autostartup_service_mode with default units. The
        autostart with autostartup_service: true replaces oracle-rdbms.service and
        /usr/local/bin/manage_oracle_rdbms_procs.sh by one systemd unit per database
        and listener. Set autostartup_service_mode: legacy before the upgrade to keep
        the solution of 4.x, see doc/guides/breaking_changes.adoc (oravirt#265) (oravirt#676)'
      - 'orasw_meta: only Oracle 19c (19.3.0.0) and 26ai (26.1.0.0) are allowed as
        version in db_homes_config (see doc/guides/breaking_changes.adoc) (oravirt#667)'
      - 'orasw_meta: the assert of oracle_databases fails for memory_target or memory_max_target
        in init_parameters with Hugepages (configure_hugepages: true, default). Automatic
        Memory Management prevents the usage of Hugepages (see doc/guides/breaking_changes.adoc)
        (oravirt#702)'
      - 'orasw_meta: the assert of oracle_databases fails for omf: false with storage_type:
        ASM (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orasw_meta: the assert of oracle_databases requires control_management_pack_access
        in init_parameters for databases of an Enterprise Edition home with state
        present. Allowed values are NONE, DIAGNOSTIC and DIAGNOSTIC+TUNING. For SE2
        the parameter is optional and must be NONE if defined. DIAGNOSTIC needs a
        license for the Diagnostics Pack, DIAGNOSTIC+TUNING for the Diagnostics and
        Tuning Pack (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orasw_meta: the assert of oracle_databases requires db_create_file_dest and
        db_recovery_file_dest in init_parameters for databases with state present
        and omf: true (default). dbca uses them for the datafile and recovery area
        destination (see doc/guides/breaking_changes.adoc) (oravirt#702)'
      - 'orasw_meta: the assert of oracle_databases requires local_listener in init_parameters
        of Single Instance databases (also with Oracle Restart) with state present.
        The local_listener alias from DBCA is missing in tnsnames.ora of a new ORACLE_HOME
        after Out-of-Place Patching, the instance does not register at the listener.
        Use EZConnect, e.g. //localhost:1521 (see doc/guides/breaking_changes.adoc)
        (oravirt#701)'
      - 'orasw_meta: the assert of oracle_databases requires max_pdbs in init_parameters
        for Container Databases (is_container: true, default) with state present.
        The value must be <= 3 for SE2 and <= 1024 for EE. EE allows more than 3 PDBs
        only with a license for the Multitenant Option (see doc/guides/breaking_changes.adoc)
        (oravirt#702)'
      - 'orasw_meta: the assert of oracle_databases requires sga_target and pga_aggregate_target
        in init_parameters for databases with state present (see doc/guides/breaking_changes.adoc)
        (oravirt#702)'
      - 'orasw_meta: the default of autostartup_service is true (4.x: false), a Single
        Instance without Grid Infrastructure / Oracle Restart gets the autostart of
        the databases. Set autostartup_service: false to keep the behavior of 4.x,
        see doc/guides/breaking_changes.adoc (oravirt#265) (oravirt#676)'
      - 'orasw_meta: the default of oracle_install_version_gi is 26.1.0.0 (26ai) instead
        of 19.3.0.0. Inventories with Grid Infrastructure or Oracle Restart must set
        oracle_install_version_gi matching the installation media; without it, the
        default of oracle_home_gi changes as well (see doc/guides/breaking_changes.adoc)
        (oravirt#707)'
      - 'orasw_meta_internal: oracle_sw_copy and oracle_sw_unpack are now real booleans.
        With install_from_nfs: true the defaults evaluate to false as documented,
        before they were always true (see doc/guides/breaking_changes.adoc) (oravirt#670)'
      - 'oraswahf_install: the empty role is removed and replaced by the new role
        ahf. Own playbooks with oraswahf_install must use ahf, see doc/guides/breaking_changes.adoc
        (oravirt#704)'
      - 'os.yml: the playbook installs python-oracledb with the new role pyoracledb
        instead of cx_Oracle. The default source is the Python package index. Target
        hosts without access to the package index or with a proxy need the new variables
        pyoracledb_wheel_dir, pyoracledb_use_proxy and pyoracledb_http_proxy (see
        doc/guides/breaking_changes.adoc) (oravirt#670)'
      bugfixes:
      - 'common: acl is installed on RHEL10/OL10, because Ansible needs setfacl for
        become_user oracle (Failed to set permissions on the temporary files Ansible
        needs to create when becoming an unprivileged user ... chmod: invalid mode:
