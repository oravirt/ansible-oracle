      - 'oracle_crs_listener: oraclehome with the path of the GI home was modified
        in every run, the path and %CRS_HOME% are the same now (oravirt#687)'
      - 'oracle_crs_listener: srvctl add listener used -oraclehome %CRS_HOME% (default
        of oraclehome) for a new listener. oraclehome is not set by default now, the
        GI home is used for a new listener and an existing ORACLE_HOME is not changed
        (oravirt#687)'
      - 'oracle_crs_listener: srvctl/crsctl used ORACLE_HOME and LD_LIBRARY_PATH of
        the environment (e.g. database home), now the GI home is used (oravirt#687)'
      - 'oracle_crs_listener: the last resource of crsctl stat res -p was lost, when
        the output did not end with an empty line (oravirt#687)'
      - 'oracle_db: state started/restarted called start_instance with shifted arguments
        (script_env missing, ORACLE_SID as israc) => srvctl status instance failed
        with PRKO-2012 in Oracle Restart (oravirt#686)'
      - 'oracle_db: state=present on 19c and newer executed ALTER DATABASE ADD/DROP
        SUPPLEMENTAL LOG DATA on every run and returned changed=true, because the
