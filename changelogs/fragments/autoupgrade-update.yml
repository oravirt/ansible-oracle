---
minor_changes:
  - "autoupgrade: autoupgrade_run_local executes AutoUpgrade on the Ansible controller (default true) or on the target host (false) for all task files"
  - "autoupgrade: install.yml checks the Python module pexpect on the host executing AutoUpgrade (pexpect is not installed by the role)"
  - "autoupgrade: install.yml creates oracle_base on the target host - AutoUpgrade can be used before the installation of the Oracle software"
  - "autoupgrade: autoupgrade_download_latest downloads the latest autoupgrade.jar on the Ansible controller, or on the target host when oracle_sw_copy is false"
  - "autoupgrade: autoupgrade_download_gold_image_rename renames downloaded Gold Images to autoupgrade_download_gold_image_prefix + release (e.g. db_home_19.32.zip) and creates a symlink with the original filename"
