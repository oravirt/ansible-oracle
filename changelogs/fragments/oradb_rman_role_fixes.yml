---
bugfixes:
  - "oradb_rman: the variables in vars/main.yml used item instead of loop_var odb since the refactoring of the role => service, catalog connect, rman_log_dir and rman_script_dir were never added to the crontab, rman_retention_policy, rman_channel_disk and rman_controlfile_autobackup_disk of a database were ignored, mk-job failed (oradb_rman_cron_mkjob)"
  - "oradb_rman: Execute RMAN-Script at playbook fails when rman_backup.sh fails (pipefail), uses oradb_rman_cron_logdir instead of rman_cron_logdir"
  - "oradb_rman: rman_wallet false was handled as wallet for the registration in the catalog"
  - "oradb_rman: ASM template parameter_fra_disk used item instead of odb"
minor_changes:
  - "oradb_rman: the catalog connect with rman_user (without rman_wallet) is stored in oradb_rman_catalog_dir/<oracle_db_name>.conf (mode 0600) and passed with rman_backup.sh --catalogfile => the password is not part of the crontab"
  - "oradb_rman: rman_backup.sh --role PRIMARY|STANDBY executes the backup only for a database with this role (Data Guard), --catalogfile reads the catalog connect from a file"
