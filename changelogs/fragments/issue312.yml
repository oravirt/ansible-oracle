minor_changes:
  - "oracle_user: new options quotas (list of tablespace/size) and quotas_mode (append/enforce) to manage the tablespace quotas of a user. With quotas, the default_tablespace gets no automatic quota unlimited, see doc/guides/breaking_changes.adoc (oravirt#312)"
  - "oradb_manage_users: new attributes quotas and quotas_mode for users in oracle_databases and oracle_pdbs (oravirt#312)"
