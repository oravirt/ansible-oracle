---
breaking_changes:
  - "oradb_manage_db: is_container in oracle_databases is true by default. A 19c database without is_container is created as CDB, set is_container: false for a non-CDB (see doc/guides/breaking_changes.adoc)"
  - "oradb_manage_db: omf in oracle_databases is true by default. dbca is called with -useOMF true. OMF is strongly recommended, databases without OMF are not tested anymore. omf: false needs an own DBCA template without OMF (dbca_templatename) (see doc/guides/breaking_changes.adoc)"
  - "orasw_meta: the assert of oracle_databases requires db_create_file_dest and db_recovery_file_dest in init_parameters for databases with state present and omf: true (default). dbca uses them for the datafile and recovery area destination (see doc/guides/breaking_changes.adoc)"
  - "orasw_meta: the assert of oracle_databases fails for omf: false with storage_type: ASM (see doc/guides/breaking_changes.adoc)"
  - "oradb_rman: the templates parameter_rac and parameter_fra_disk use db_create_file_dest from init_parameters for the snapshot controlfile instead of oracle_dbf_dir_asm (see doc/guides/breaking_changes.adoc)"
removed_features:
  - "orasw_meta: datafile_dest and recoveryfile_dest in oracle_databases are removed, the assert fails. Use db_create_file_dest and db_recovery_file_dest in init_parameters (see doc/guides/breaking_changes.adoc)"
  - "orasw_meta: oracle_dbf_dir_asm and oracle_reco_dir_asm are removed. ASM databases use db_create_file_dest and db_recovery_file_dest from init_parameters (see doc/guides/breaking_changes.adoc)"
minor_changes:
  - "orasw_meta: omf, is_container and the file destinations of dbca documented for oracle_databases"
bugfixes:
  - "oradb_rman: parameter_fra_disk created the snapshot controlfile name with two + (++DATA)"
