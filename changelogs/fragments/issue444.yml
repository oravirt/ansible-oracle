minor_changes:
  - "oracle_asmdg: disks can be a dictionary with disk, failure_group and quorum to create disks in (quorum) failure groups. The failure group of an existing disk is not changed, the module returns a warning (oravirt#444)"
  - "oraasm_manage_diskgroups: new attributes failure_group and quorum for disk in asm_diskgroups (oravirt#444)"
  - "oraswgi_install: failure_group and quorum of the disks are used for the initial disk group in the response file for 19c, 21c and 26ai (oravirt#444)"
bugfixes:
  - "orahost_meta: get the kdump state as root, the task failed in plays without become, e.g. when a role with orahost_meta as dependency is used in a play as oracle (oravirt#444)"
