---
breaking_changes:
  - "oradb_manage_db: with Grid Infrastructure / Oracle Restart a listener with home in listener_installed is registered with srvctl in the ORACLE_HOME of home (oracle_crs_listener oraclehome), before a new listener resource was added in the GI home. Use use_gi_home: true for a listener in the GI / Oracle Restart home (see doc/guides/breaking_changes.adoc)"
minor_changes:
  - "oradb_manage_db: the GI / Oracle Restart home of a listener with use_gi_home in listener_installed is crs_home from /etc/oracle/olr.loc"
