---
minor_changes:
  - "molecule: dbfs - tests for oracle_tablespace grow and shrink the autoextend nextsize/maxsize with units in lower case (k, m, g) and check the documented limits (size of existing files is not changed, k and unlimited are not detected)"
  - "molecule: dbfs - test for oracle_profile idempotence with all limits set to DEFAULT, UNLIMITED and NULL (oravirt#564)"
  - "molecule: dbfs - tests for oracle_profile with '/' in the profile name, with and without double quotes (oravirt#566)"
  - "molecule: Taskfile - option C=false for task module-test to skip the reinstallation of the collection"
  - "molecule: the module tests are shared by the scenarios dbfs and has-ol9 (extensions/molecule/shared_config/module_tests), the scenario specific variables and known bugs are in <scenario>/module_tests.yml, task module-test S=has-ol9"
  - "molecule: has-ol9 - module tests instead of the 2nd run of swgi/manage_db in side_effect (use task idempotence), wallet and tnsnames.ora for ORCLPDB1, 3 spare ASM disks (molecule_asm_spare_disks) for the tests, new tests for oracle_asmdg and oracle_services with Grid Infrastructure"
  - "molecule: module tests - an error outside of a check aborts only the tests of the module (failed check <module>.aborted), the result file and the summary are written always, new summary per module, the result file contains module and status of every check"
