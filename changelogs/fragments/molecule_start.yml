---
minor_changes:
  - "molecule: new task 'task start S=<scenario>' (tools/start.sh) starts the stopped containers of a scenario again, e.g. after a restart of WSL/docker, and runs start.yml of the scenario if it exists. start.yml of the scenario rac attaches the loop devices of the ASM disks again, restarts the Clusterware stack and waits for the RAC databases"
