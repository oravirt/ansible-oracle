bugfixes:
  - "oracle_asmdg: attributes of an existing disk group were not set (e.g. compatible.rdbms of the disk group created by gridSetup), fixed with v4.14.0 (oravirt#534). Read-only attributes in a row in attribute_name were not removed, the module failed (oravirt#491)"
  - "oracle_asmdg: compatible.asm is set first, compatible.rdbms and compatible.advm can't be higher than compatible.asm (oravirt#491)"
  - "oracle_asmdg: create of a disk group without attribute_name failed, attribute values as numbers failed. attribute_name and attribute_value must have the same number of entries (oravirt#491)"
  - "oraasm_manage_diskgroups: a disk group without attributes passed the string None as attribute to oracle_asmdg. The internal variables _oraasm_manage_diskgroups_attr_name and _oraasm_manage_diskgroups_attr_value are removed, see doc/guides/breaking_changes.adoc (oravirt#491)"
