---
minor_changes:
  - "oradb_manage_db: Out-of-Place Patching (switch of the ORACLE_HOME) for Single Instance databases with Oracle Restart. Stop/start with srvctl, srvctl modify database -oraclehome (and -spfile/-pwfile, when copied), start with the start option of the resource, datapatch for the role PRIMARY only. Grid Infrastructure for a Cluster, RAC and RAC One Node are not supported (see doc/guides/out_of_place_patching.adoc)"
  - "oradb_manage_db: with Oracle Restart (/etc/oracle/olr.loc exists) the entry <db_unique_name>:<ORACLE_HOME>:N is written into /etc/oratab, because the Clusterware does not maintain it correctly. /etc/oratab is never read for the state of a database with Oracle Restart"
  - "doc: featurelist with Data Guard (Single Instance without Oracle Restart) and Out-of-Place Patching (Single Instance without and with Oracle Restart), terms Oracle Restart, Grid Infrastructure (cluster) and RAC, Grid Infrastructure for a Cluster is marked as not tested"
bugfixes:
  - "oracle_crs_listener: a running listener kept the old ORACLE_HOME after a change of oraclehome. The listener is stopped before srvctl modify listener -oraclehome and started afterwards. A listener process running from another ORACLE_HOME than the resource is stopped with lsnrctl of its ORACLE_HOME and started with srvctl"
