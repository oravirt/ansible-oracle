bugfixes:
  - "oradb_facts: an unreachable database of a standby configuration (db_standby_config) fails the play, when the member is not a physical standby (e.g. the primary after dbca). Before, the state was set to unreachable without an error and roles like oradb_manage_parameters skipped the database silently (dg_broker_start not set). The fail message shows the connection data and the error, oradb_facts_ignore_unreachable: true disables the fail"
