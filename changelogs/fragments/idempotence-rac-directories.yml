bugfixes:
  - "orahost, oraswgi_install: owner and permissions of oracle_inventory_loc are no longer changed in every run. orahost sets the owner (oracle_user) for a new directory only, oraswgi_install sets the grid user, which is needed by the installer of Grid Infrastructure. Group and the permissions of owner and group (ug+rwx) are ensured by both roles, orainstRoot.sh removes the permissions of others"
  - "oraswgi_install, oraswgi_manage_patches, oraswdb_install: the directories of the stage (oracle_stage, oracle_rsp_stage, oracle_tmp_stage below oracle_stage, version and patch directories) belong to oracle_user in all roles, group oinstall and 0775. Before, the roles changed the owner between the grid user and oracle_user in every run in a cluster with role separation"
  - "orahost_ssh: the task ssh-keyscan reads the host keys only and is no longer reported as changed"
