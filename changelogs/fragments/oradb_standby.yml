---
minor_changes:
  - "oradb_standby: new role - creates a physical standby database for a member with initial_role physical_standby, create_method rman_duplicate_active (RMAN DUPLICATE FROM ACTIVE DATABASE), external or custom (oravirt#65)"
  - "oradb_standby: dgmgrl script ORACLE_BASE/admin/<db_unique_name>/pfile/dgmgrl.cfg for the creation of the Data Guard Broker configuration on each member, with the local database as primary database (oravirt#65)"
  - "oradb_standby: executes dgmgrl.cfg once on the host of the primary database, when no broker configuration exists and all other members are physical standby databases, switch oradb_standby_broker_create (oravirt#65)"
  - "oradb_standby: standby_file_management is no longer set by the preparation of the primary, missing directories of dg_broker_config_file1/2 are created before the broker configuration, existing directories are not changed (oravirt#65)"
