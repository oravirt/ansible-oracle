breaking_changes:
  - "orasw_meta: the assert of oracle_databases requires control_management_pack_access in init_parameters for databases of an Enterprise Edition home with state present. Allowed values are NONE, DIAGNOSTIC and DIAGNOSTIC+TUNING. For SE2 the parameter is optional and must be NONE if defined. DIAGNOSTIC needs a license for the Diagnostics Pack, DIAGNOSTIC+TUNING for the Diagnostics and Tuning Pack (see doc/guides/breaking_changes.adoc)"
trivial:
  - "extensions: controller-only tests for control_management_pack_access in oracle_databases"
