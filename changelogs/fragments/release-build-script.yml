---
minor_changes:
  - "release: tools/release/build_release.sh with mode pr - set version from branch pr/<version>, commit the version, create the release pull request, add PR references to fragments, create the changelog and write the release notes into the pull request"
  - "release: tools/release/build_release.sh with mode release - create tag v<version> and a draft release with the description of the release pull request"
  - "release: tools/release/build_release.sh with mode galaxy - sync master of the fork with upstream and start the workflow Deploy Collection, when the latest release points to the last commit and the version is not on Ansible Galaxy"
  - "release: new tasks release:pr, release:draft and release:galaxy, task changelog-release removed"
  - "doc: development guide describes nix-shell as recommended development environment and the local Ansible-Controller as separate option"
