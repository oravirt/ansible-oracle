---
minor_changes:
  - "oradb_standby: new attribute reopen_secs in dg of a member of db_standby_config (broker property ReopenSecs, default 300). The molecule scenario dataguard uses 30 seconds, the redo transport recovers faster after the restart of the standby database during a switchover (oravirt#65)"
bugfixes:
  - "oradb_standby: the broker properties LogXptMode, DelayMins and ReopenSecs of an existing broker configuration are changed, when they differ from db_standby_config. Before they were only set by dgmgrl.cfg for a new configuration (oravirt#65)"
