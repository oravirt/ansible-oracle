---
major_changes:
  - "ahf: new role for the installation and configuration of Oracle Autonomous Health Framework (AHF) incl. registration as AHF Fleet Insights client, see doc/guides/ahf.adoc"
  - "ahf_fleet_insights: new role for the installation of Oracle AHF Fleet Insights as central web interface for AHF data, see doc/guides/ahf.adoc"
breaking_changes:
  - "oraswahf_install: the empty role is removed and replaced by the new role ahf. Own playbooks with oraswahf_install must use ahf, see doc/guides/breaking_changes.adoc"
removed_features:
  - "oraswahf_install: removed the empty role, replaced by ahf"
