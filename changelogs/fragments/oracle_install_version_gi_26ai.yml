breaking_changes:
  - "orasw_meta: the default of oracle_install_version_gi is 26.1.0.0 (26ai) instead of 19.3.0.0. Inventories with Grid Infrastructure or Oracle Restart must set oracle_install_version_gi matching the installation media; without it, the default of oracle_home_gi changes as well (see doc/guides/breaking_changes.adoc)"
