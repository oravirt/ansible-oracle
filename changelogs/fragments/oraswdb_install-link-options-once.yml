---
minor_changes:
  - "oraswdb_install: database options from oracle_ee_options and oracle_all_editions_options_state are linked by one make call with a single relink of oracle (ioracle) instead of one chopt/make call per option. The current state is read from libknlopt.a, the chopt state files in $ORACLE_HOME/install are not used anymore. The variables are unchanged."
  - "oraswdb_install: unknown options in oracle_ee_options or oracle_all_editions_options_state fail with an assert. Options are checked per release like in chopt.ini, e.g. oaa and olap are invalid for 26ai"
