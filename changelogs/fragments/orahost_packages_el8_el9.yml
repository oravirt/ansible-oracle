minor_changes:
  - "orahost: install the required packages of the official lists of Oracle on RHEL/OL 8 and 9 (``oracle_packages_el8``, ``oracle_packages_el9``, Grid Infrastructure Installation and Upgrade Guide 26ai). Before, no packages for Oracle were installed on RHEL/OL 8 and 9, e.g. ``compat-openssl11`` was missing for the prerequisite checks of Grid Infrastructure 26ai"
bugfixes:
  - "orahost: ``kernel.panic`` was missing in ``oracle_sysctl``. The prerequisite checks of Grid Infrastructure 26ai failed with PRVG-1205. New default ``kernel.panic = 10`` (minimum value of Oracle)"
