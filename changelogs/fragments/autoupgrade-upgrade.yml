---
minor_changes:
  - "autoupgrade: upgrade_fixups.yml - fixups phase (AutoUpgrade fixups) between analyze and deploy phase"
  - "autoupgrade: upgrade_analyze.yml - analyze phase for the Unplug/Plug upgrade of PDBs with AutoUpgrade analyze, configured with attribute autoupgrade in oracle_pdbs (oracle_pdbs defines the end state in the target CDB)"
  - "autoupgrade: upgrade_deploy.yml - Unplug/Plug upgrade of PDBs with AutoUpgrade deploy, the analyze phase is always executed first"
  - "autoupgrade: the analyze phase shows the logfiles and preupgrade reports of the AutoUpgrade job"
  - "autoupgrade: autoupgrade_upgrade_restoration (default false) and autoupgrade.restoration in oracle_pdbs control the Guaranteed Restore Point (upg1.restoration)"
  - "autoupgrade: PDBs with status UNPLUGGED in the source CDB (keep_source_pdb) are ignored by the state check of the PDBs"
  - "autoupgrade: recovery data of AutoUpgrade - an unfinished deploy is resumed by the deploy phase, recovery data of a finished deploy is cleared before a new upgrade, autoupgrade_upgrade_clear_recovery_data discards it"
  - "autoupgrade: global_log_dir per AutoUpgrade job (recovery data per job)"
  - "playbooks: new autoupgrade_upgrade_analyze.yml, autoupgrade_upgrade_fixups.yml and autoupgrade_upgrade.yml"
  - "oradb_manage_db: switch_home.yml fails, when the release of the new ORACLE_HOME differs (upgrade with role autoupgrade needed)"
  - "molecule: new scenario upgrade for the upgrade from 19c to 26ai"
  - "doc: new guide doc/guides/autoupgrade_upgrade.adoc"
