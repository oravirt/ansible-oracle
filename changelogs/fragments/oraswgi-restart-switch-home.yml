---
minor_changes:
  - "oraswgi_install: Out-of-Place Patching of Oracle Restart 26ai. A change of oracle_home_gi switches the running stack into the new home (gridSetup.sh -setupHomeAs/-switchGridHome, root.sh, CRS flag in the central inventory), see doc/guides/out_of_place_patching.adoc"
  - "oraswgi_install: stops with an error, when oracle_home_gi differs from crs_home in /etc/oracle/olr.loc for Grid Infrastructure for a Cluster or Oracle Restart before 21c. The difference was ignored before."
  - "oraswgi_install: new variable oraswgi_install_remove_obsolete_homes removes obsolete Grid Infrastructure homes of Oracle Restart from the central inventory with deinstall (only homes with oracle.crs, not crs_home and not oracle_home_gi, after a check with deinstall -checkonly)"
