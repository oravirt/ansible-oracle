# Taskfile.yml
version: '3'

includes:
  molecule:
    taskfile: extensions/Taskfile.yml
    dir: extensions

tasks:
  changelog-release:
    desc: Create a new release with ansible-changelog
    platforms: ["linux"]
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - .venv/antsibull/bin/antsibull-changelog release
