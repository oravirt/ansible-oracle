# Taskfile.yml
# Local renovate checks - lookup only, nothing is changed in the repository.
# fork: run renovate against the github fork - creates branches and PRs there.
# upstream: run renovate against the upstream repository - creates branches and PRs there.
version: '3'

vars:
  RENOVATE_REPORT: .renovate-report.json
  FORK_REPO: '{{.FORK_REPO | default "Rendanic/ansible-oracle"}}'
  FORK_BASE: '{{.FORK_BASE | default "master"}}'
  UPSTREAM_REPO: '{{.UPSTREAM_REPO | default "oravirt/ansible-oracle"}}'
  UPSTREAM_BASE: '{{.UPSTREAM_BASE | default "master"}}'

env:
  # keep clones and cache between runs (default is $TMPDIR, which differs per nix-shell)
  RENOVATE_BASE_DIR: '{{.HOME}}/.cache/renovate'

tasks:
  validate:
    desc: Validate renovate.json
    cmds:
      - renovate-config-validator --strict renovate.json

  check:
    desc: Check pip modules and docker images for updates (lookup only)
    cmds:
      - task: lookup
        vars:
          MANAGERS: '{{.MANAGERS | default ""}}'
      - task: report

  pip:
    desc: Check pip modules and pre-commit hooks for updates (lookup only)
    cmds:
      - task: check
        vars:
          MANAGERS: '["pip_requirements","pep621","pre-commit"]'

  docker:
    desc: Check docker images for updates (lookup only)
    cmds:
      - task: check
        vars:
          MANAGERS: '["dockerfile","docker-compose","custom.regex"]'

  galaxy:
    desc: Check collections in galaxy.yml and requirements.yml for updates (lookup only)
    cmds:
      - task: check
        vars:
          MANAGERS: '["ansible-galaxy"]'
      - task: galaxy:requires

  galaxy:requires:
    desc: Check requires_ansible of the collections in galaxy.yml against meta/runtime.yml
    cmds:
      - tools/renovate/galaxy_requires.py

  lookup:
    internal: true
    env:
      LOG_LEVEL: '{{.LOG_LEVEL | default "warn"}}'
      RENOVATE_PLATFORM: local
      # pre-commit hooks are looked up with github tags - token from gh if available
      GITHUB_COM_TOKEN:
        sh: gh auth token 2>/dev/null || true
      # renovate.json is read from the working tree (must be tracked by git)
      RENOVATE_ONBOARDING: 'false'
      RENOVATE_DRY_RUN: lookup
      RENOVATE_REPORT_TYPE: file
      RENOVATE_REPORT_PATH: '{{.RENOVATE_REPORT}}'
      # force overrides enabledManagers from renovate.json
      RENOVATE_FORCE: '{{if .MANAGERS}}{"enabledManagers": {{.MANAGERS}}}{{else}}{}{{end}}'
    cmds:
      - renovate

  fork:dry-run:
    desc: Show what renovate would do on the github fork (FORK_REPO, FORK_BASE)
    cmds:
      - task: run
        vars: {REPO: '{{.FORK_REPO}}', BASE: '{{.FORK_BASE}}', FORK: 'true', DRY_RUN: full}

  fork:
    desc: Run renovate on the github fork - creates branches and PRs (FORK_REPO, FORK_BASE, M=<milestone>, L=<label,...>)
    prompt: Create renovate branches and PRs in {{.FORK_REPO}} ({{.FORK_BASE}}){{if .M}} milestone {{.M}}{{end}}{{if .L}} labels {{.L}}{{end}}?
    cmds:
      - task: run
        vars: {REPO: '{{.FORK_REPO}}', BASE: '{{.FORK_BASE}}', FORK: 'true'}

  upstream:dry-run:
    desc: Show what renovate would do on the upstream repository (UPSTREAM_REPO, UPSTREAM_BASE)
    cmds:
      - task: run
        vars: {REPO: '{{.UPSTREAM_REPO}}', BASE: '{{.UPSTREAM_BASE}}', DRY_RUN: full}

  upstream:
    desc: Run renovate on the upstream repository - creates branches and PRs there (UPSTREAM_REPO, UPSTREAM_BASE, M=<milestone>, L=<label,...>)
    prompt: Create renovate branches and PRs in the UPSTREAM repository {{.UPSTREAM_REPO}} ({{.UPSTREAM_BASE}}){{if .M}} milestone {{.M}}{{end}}{{if .L}} labels {{.L}}{{end}}?
    cmds:
      - task: run
        vars: {REPO: '{{.UPSTREAM_REPO}}', BASE: '{{.UPSTREAM_BASE}}'}

  run:
    internal: true
    vars:
      # M: number or title of a milestone in REPO
      MILESTONE:
        sh: |
          m='{{.M | default ""}}'
          case "$m" in
            '') ;;
            *[!0-9]*) gh api 'repos/{{.REPO}}/milestones?state=all' --paginate \
                        -q ".[] | select(.title == \"$m\") | .number" ;;
            *) echo "$m" ;;
          esac
      # L: comma separated list of labels
      LABELS: '{{if .L}}{{regexSplit "\\s*,\\s*" (trim .L) -1 | toJson}}{{end}}'
    preconditions:
      - sh: '[ -z "{{.M | default ""}}" ] || [ -n "{{.MILESTONE}}" ]'
        msg: milestone '{{.M}}' not found in {{.REPO}}
      - sh: '[ -n "${RENOVATE_TOKEN:-}" ] || gh auth token >/dev/null 2>&1'
        msg: login with 'gh auth login' or set RENOVATE_TOKEN to a github token with write access to {{.REPO}}
      - sh: '{{if .FORK}}[ "{{.REPO | lower}}" = "{{.REPO | lower | trimPrefix "oravirt/"}}" ]{{else}}true{{end}}'
        msg: FORK_REPO must be a fork, not the upstream repository oravirt/ansible-oracle
      - sh: '{{if .FORK}}true{{else}}[ "$(gh api repos/{{.REPO}} -q .permissions.push)" = true ]{{end}}'
        msg: your github account has no write access to {{.REPO}}
    env:
      # RENOVATE_TOKEN from the environment, otherwise the token from gh (only for this run)
      RENOVATE_TOKEN:
        sh: printf '%s' "${RENOVATE_TOKEN:-$(gh auth token 2>/dev/null)}"
      # no fork mode: branches and PRs are created in REPO
      RENOVATE_FORK_TOKEN: ''
      LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: '["{{.REPO}}"]'
      RENOVATE_BASE_BRANCH_PATTERNS: '["{{.BASE}}"]'
      # renovate.json is read from BASE in REPO - no run without it
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_ONBOARDING: 'false'
      # renovate skips forked repositories by default
      RENOVATE_FORK_PROCESSING: enabled
      # no dependency dashboard (issues are disabled in the fork) - force overrides config:recommended
      # labels and milestone (L, M) for the PRs
      RENOVATE_FORCE: '{"dependencyDashboard": false{{if .LABELS}}, "labels": {{.LABELS}}{{end}}{{if .MILESTONE}}, "milestone": {{.MILESTONE}}{{end}}}'
      # postUpgradeTasks in renovate.json: changelog fragment for antsibull-changelog
      RENOVATE_ALLOWED_COMMANDS: '["^tools/renovate/changelog_fragment\\.sh "]'
    cmds:
      - renovate{{if .DRY_RUN}} --dry-run={{.DRY_RUN}}{{end}}

  report:
    desc: Show updates from the last renovate run (ONLY_UPDATES=false shows all dependencies)
    preconditions:
      - test -f {{.RENOVATE_REPORT}}
    cmds:
      - |
        jq -r '
          .repositories[].packageFiles
          | to_entries[] | .key as $mgr | .value[]
          | .packageFile as $file | .deps[]
          | ([ .updates[]? | "\(.newValue // .newDigest[0:12]) (\(.updateType))" ] | join(", ")) as $upd
          {{if ne (.ONLY_UPDATES | default "true") "false"}}| select($upd != ""){{end}}
          | [ $mgr, $file, .depName, (.currentValue // "-"),
              (if $upd != "" then $upd else (.skipReason // "up-to-date") end) ]
          | @tsv' {{.RENOVATE_REPORT}} \
        | sort | column -t -s $'\t' -N MANAGER,FILE,DEPENDENCY,CURRENT,UPDATES
