---
is_sw_source_local: true
oracle_sw_copy: false
oracle_sw_unpack: true

# Directory with installation media and patches on the Ansible controller.
# Set by the Taskfile (ORACLE_SW_SOURCE); the files are copied to oracle_stage on the target.
# oracle_sw_source_local: "{{ lookup('ansible.builtin.env', 'ORACLE_SW_SOURCE', default='/mnt/d/ORACLE/sw/linux64') }}"
oracle_sw_source_local: /u01/sw

# Directory for response files, extraceted patches etc.
oracle_stage: /u01/stage

# Example for Remote NFS
install_from_nfs: false          # Mount NFS-Share?
nfs_server_sw: 192.168.66.2    # NFS-Server
nfs_server_sw_path: /sw         # NFS-Share
oracle_stage_remote: /u01/sw    # local mount point for NFS share
