---
apply_patches_db: false
db_homes_config:

  db26_si_ee: &db26_si_ee
    version: 26.1.0.0
    oracle_home: /u01/app/oracle/product/db26_si_ee
    edition: EE
    imagename: db_home_26_latest.zip
    opatch_minversion: 12.2.0.1.36
    state: present

  # current Release Update of 19c from oracle_ru.yml (example_ru_19)
  db19curr_si_ee: &db19curr_si_ee
    version: 19.3.0.0
    oracle_home: "/u01/app/oracle/product/19/db{{ example_ru_19_nodot }}-si-ee"
    oracle_home_name: "db{{ example_ru_19_nodot }}_si_ee"
    imagename: "db_home_{{ example_ru_19 }}.zip"
    edition: EE

  db19_si_se2:
    <<: *db19curr_si_ee
    readonly_home: true

  db19_si_ee:
    <<: *db19curr_si_ee
    oracle_home: /u01/app/oracle/product/19/db1
    oracle_home_name: db19_si_ee
    readonly_home: true
