---
# Oracle Restart (Grid Infrastructure for a Standalone Server)
oracle_install_option_gi: HA_CONFIG
oracle_install_version_gi: 26.1.0.0

# Gold Image of Oracle Restart from AutoUpgrade (autoupgrade.yml):
# gi_goldimage_26_latest.zip -> latest downloaded Gold Image, e.g. gi_goldimage_26_04.zip
oracle_install_image_gi: gi_goldimage_26_latest.zip
# below grid_base (= oracle_base /u01/app/oracle), mandatory for Oracle Restart
oracle_home_gi: /u01/app/oracle/product/gi26_restart

# the Gold Image contains the Release Update
apply_patches_gi: false
patch_before_rootsh: false

# Oracle Restart is installed and owned by oracle
role_separation: false
